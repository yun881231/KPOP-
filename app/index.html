/* ========================================================================
   11.5 第五關：看MV片段猜歌（三張截圖，逐步解鎖、已解鎖的不收回）
   ====================================================================== */
function Level5Stage({ q, revealed, duck, unduck }) {
  // open = 已經解鎖到第幾張（1 起算）。只會往上加，永遠不會把前面的收回去。
  const [open, setOpen] = useState(1);
  const duckedRef = useRef(false);
  const doDuck = () => { if (!duckedRef.current) { duckedRef.current = true; duck(); } };
  const doUnduck = () => { if (duckedRef.current) { duckedRef.current = false; unduck(); } };
  useEffect(() => () => doUnduck(), []);
  useEffect(() => { doUnduck(); setOpen(1); }, [q.id]);

  const shots = (q.shots && q.shots.length) ? q.shots : [];
  const total = shots.length || 3;

  // 解鎖第 i 張時把前面的一起打開（就算直接點第 3 張也不會跳號）
  const unlock = (i) => { SFX.click(); setOpen(o => Math.max(o, i + 1)); };

  if (revealed) {
    return (
      <div className="w-full flex flex-col items-center gap-4 pop">
        {q.answer
          ? <video src={assetUrl(q.answer)} controls autoPlay className="w-full max-h-[46vh] rounded-2xl bg-black"
                   onPlay={doDuck} onPause={doUnduck} onEnded={doUnduck} />
          : (
            <div className="w-full grid gap-3 grid-cols-3">
              {shots.map((src, i) => (
                <div key={i} className="rounded-2xl bg-black/50 border border-white/10 h-[22vh] flex items-center justify-center p-1.5">
                  <img className="soft-img" src={assetUrl(src)} alt="" onError={onImgError} />
                </div>
              ))}
            </div>
          )}
        <div className="text-center">
          <div className="text-sm text-emerald-300 font-semibold">{q.group}</div>
          <div className="text-3xl sm:text-4xl font-black text-white mt-1">{q.title}</div>
        </div>
      </div>
    );
  }

  return (
    <div className="w-full">
      <div className="grid gap-3 grid-cols-3">
        {[0, 1, 2].map(i => {
          const src = shots[i];
          const shown = i < open;
          return (
            <div key={i}>
              <div className={cx("text-xs font-bold mb-1.5 flex items-center gap-1",
                                 shown ? "text-emerald-300" : "text-slate-500")}>
                <span>{shown ? "🎬" : "🔒"}</span>片段 {i + 1}
              </div>
              <div className={cx("rounded-2xl border h-[24vh] sm:h-[30vh] flex items-center justify-center p-1.5 transition-all",
                shown ? "bg-black/50 border-white/10" : "bg-black/30 border-white/15 border-dashed")}>
                {!src
                  ? <span className="text-slate-600 text-xs text-center px-2">（沒有這張片段）</span>
                  : shown
                    ? <img className="soft-img pop" src={assetUrl(src)} alt="" onError={onImgError} />
                    : (
                      <button onClick={() => unlock(i)}
                        className="w-full h-full grid place-items-center rounded-xl hover:bg-white/5 transition group">
                        <div className="text-center px-2">
                          <div className="text-3xl sm:text-4xl mb-2 opacity-60 group-hover:opacity-100 transition">🔓</div>
                          <div className="text-xs sm:text-sm font-bold text-slate-300">公布片段 {i + 1}</div>
                          <div className="text-[10px] text-slate-500 mt-1">前面的片段會留著</div>
                        </div>
                      </button>
                    )}
              </div>
            </div>
          );
        })}
      </div>
      <p className="text-center text-[11px] text-slate-500 mt-3">
        目前看到 <b className="text-emerald-300">{Math.min(open, total)} / {total}</b> 張片段 ·
        看得越少猜對越厲害，看不出來就再解鎖下一張
      </p>
    </div>
  );
}

/* ========================================================================
   12. 第四關：拖拉式互動（團名 / 眼睛 / 嘴巴）
   ====================================================================== */
const ZONES = [
  { key: "eyes",  label: "眼睛", emoji: "👁️", tint: "text-cyan-300", ring: "border-cyan-400/40" },
  { key: "mouth", label: "嘴巴", emoji: "👄", tint: "text-pink-300", ring: "border-pink-400/40" },
];

function FeatureImg({ src, className }) {
  return (
    <div className={cx("rounded-2xl overflow-hidden bg-black/50 border border-white/10 flex items-center justify-center p-1.5", className)}>
      {src ? <img src={assetUrl(src)} alt="" className="max-w-full max-h-full w-auto h-auto object-contain rounded-xl" onError={onImgError} />
           : <span className="text-slate-600 text-sm">（無素材）</span>}
    </div>
  );
}

/* 成員名牌永遠可以重複使用、也永遠拖得動：
   1. 放錯在「眼睛」的人，很可能正是「嘴巴」的正解 → 不能有「答錯就永久劃掉」
   2. 已經放進某一格的名牌仍然可以再拖到另一格（會自動和那一格的人對調）
      → 所以只是變暗，不能設 pointer-events:none */
function Chip({ value, used, selected, onPointerDown, onPointerMove, onPointerUp, onClick }) {
  return (
    <button type="button" title={used ? "已放入，可再拖到另一格對調" : ""}
      className={cx("chip px-3.5 py-2 rounded-xl text-sm font-bold border shadow-lg",
        used ? "opacity-45 bg-white/5 border-white/15 text-slate-400 border-dashed"
        : selected ? "bg-gradient-to-r from-pink-500 to-fuchsia-600 border-pink-300 text-white shadow-pink-500/30 scale-105"
                   : "bg-white/10 border-white/20 text-slate-100 hover:bg-white/20")}
      onPointerDown={onPointerDown} onPointerMove={onPointerMove}
      onPointerUp={onPointerUp} onPointerCancel={onPointerUp} onClick={onClick}>
      {value}
    </button>
  );
}

/* 第四關：兩段式拖拉
   第一步 選團體 → 第二步 展開該團所有成員，拖進「眼睛」與「嘴巴」
   團名 + 眼睛 + 嘴巴 三個都對才算全對 */
function Level4Stage({ q, two, mode, revealed, st, onJudge, onSelectGroup, onBackGroup }) {
  const [slots, setSlots] = useState({ eyes: null, mouth: null });
  const [marks, setMarks] = useState(null);
  const [shakeOn, setShakeOn] = useState(false);
  const [selected, setSelected] = useState(null);
  const [drag, setDrag] = useState(null);
  const [hotZone, setHotZone] = useState(null);

  const dragRef = useRef(null);
  const justDroppedRef = useRef(0);
  const zoneRefs = { eyes: useRef(null), mouth: useRef(null) };

  const sel = st.sel || null;
  const badGroups = st.badGroups || [];
  const attempts = st.attempts || 0;

  useEffect(() => { setSlots({ eyes: null, mouth: null }); setMarks(null); setSelected(null); setDrag(null); setHotZone(null); setShakeOn(false); }, [q.id]);
  useEffect(() => { setSlots({ eyes: null, mouth: null }); setMarks(null); setSelected(null); }, [sel]);

  const filled = !!(slots.eyes && slots.mouth);
  const lsSrc = lsOf(q);

  /* 放置規則：
     - 目標格空的 → 直接放進去
     - 目標格已有人，而且拖過來的人本來在另一格 → 兩格「對調」（一次拖曳就換好）
     - 目標格已有人，拖過來的是還沒用過的人 → 覆蓋
     只清掉被動到的那幾格的對錯標記，沒動到的格子維持原本的 ✅ / ❌ */
  const place = (zone, value) => {
    const from = Object.keys(slots).filter(k => slots[k] === value)[0];
    const displaced = slots[zone];
    setSlots(s => {
      const n = { ...s };
      n[zone] = value;
      if (from && from !== zone) n[from] = displaced || null;
      return n;
    });
    setMarks(mk => {
      if (!mk) return null;
      const o = { ...mk };
      o[zone] = null;
      if (from && from !== zone) o[from] = null;
      return o;
    });
    SFX.drop();
  };
  const clearZone = (zone) => {
    setSlots(s => ({ ...s, [zone]: null }));
    setMarks(mk => (mk ? { ...mk, [zone]: null } : null));
  };

  const zoneAt = (x, y) => {
    for (const z of ZONES) {
      const el = zoneRefs[z.key].current;
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return z.key;
    }
    return null;
  };

  const startDrag = (e, value) => {
    if (revealed) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    dragRef.current = { value, id: e.pointerId, moved: false };
    setDrag({ value, x: e.clientX, y: e.clientY });
  };
  const moveDrag = (e) => {
    const d = dragRef.current;
    if (!d || d.id !== e.pointerId) return;
    d.moved = true;
    setDrag(s => (s ? { ...s, x: e.clientX, y: e.clientY } : s));
    setHotZone(zoneAt(e.clientX, e.clientY));
  };
  const endDrag = (e) => {
    const d = dragRef.current;
    if (!d || d.id !== e.pointerId) return;
    dragRef.current = null;
    const z = zoneAt(e.clientX, e.clientY);
    setDrag(null); setHotZone(null);
    if (z) { justDroppedRef.current = Date.now(); place(z, d.value); setSelected(null); }
    else if (!d.moved) setSelected(s => (s && s.value === d.value) ? null : { value: d.value });
  };
  const tapZone = (zone) => {
    if (revealed) return;
    if (Date.now() - justDroppedRef.current < 400) return;
    if (selected) { place(zone, selected.value); setSelected(null); }
    else if (slots[zone]) clearZone(zone);
  };

  // ── 判定：團名 + 眼睛 + 嘴巴 三個都對才算全對 ─────────────────
  const submit = () => {
    if (!filled || revealed || !sel) return;
    const m = {
      group: sel === two.correctGroup,
      eyes:  slots.eyes  === two.correctEyes,
      mouth: slots.mouth === two.correctMouth,
    };
    const allRight = m.group && m.eyes && m.mouth;
    setMarks(m);

    if (allRight) { SFX.correct(); onJudge(true, { slots }); return; }
    SFX.wrong();
    if (mode === "single") { onJudge(false, { slots, marks: m }); return; }

    // 多人：只抖一下提示，不清空任何格子、也不換團體
    setShakeOn(true);
    setTimeout(() => setShakeOn(false), 480);
    onJudge(false, { slots, marks: m, groupOk: m.group });
  };

  // ── 已公布答案 ────────────────────────────────────────────────
  if (revealed) {
    const mine = st.slots || slots;
    const rows = [
      { label: "團名", emoji: "🏷️", tint: "text-amber-300", src: lsSrc, name: two.correctGroup, my: sel },
      { label: "眼睛", emoji: "👁️", tint: "text-cyan-300",  src: (q.eyes && (q.eyes.a || q.eyes.q)),  name: two.correctEyes,  my: mine.eyes },
      { label: "嘴巴", emoji: "👄", tint: "text-pink-300",  src: (q.mouth && (q.mouth.a || q.mouth.q)), name: two.correctMouth, my: mine.mouth },
    ];
    return (
      <div className="w-full">
        <div className="grid gap-4 sm:grid-cols-3">
          {rows.map(r => {
            const ok = r.my === r.name;
            return (
              <div key={r.label} className="pop">
                <div className={cx("text-xs font-bold mb-2 flex items-center gap-1", r.tint)}>
                  <span>{r.emoji}</span>{r.label}的答案
                </div>
                <FeatureImg src={r.src} className="h-[24vh] sm:h-[28vh]" />
                <div className="text-center mt-3">
                  <div className="text-2xl font-black text-white break-words">{r.name || "—"}</div>
                  {r.my != null && (
                    <div className={cx("text-xs mt-1 font-semibold", ok ? "text-emerald-300" : "text-rose-300")}>
                      {ok ? "✅ 你選對了" : "❌ 你選的是「" + r.my + "」"}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <p className="text-center text-slate-400 text-sm mt-4">
          眼睛與嘴巴來自 <b className="text-slate-200">{two.correctGroup}</b> 的<b className="text-slate-200">不同兩位成員</b>
        </p>
      </div>
    );
  }

  // ── 題目素材（兩個步驟都看得到） ──────────────────────────────
  const puzzle = (
    <div className="grid gap-3 grid-cols-3 mb-5">
      <div>
        <div className="text-xs font-bold mb-1.5 flex items-center gap-1 text-amber-300"><span>🔦</span>手燈（團體提示）</div>
        <FeatureImg src={lsSrc} className="h-[17vh] sm:h-[22vh]" />
      </div>
      <div>
        <div className="text-xs font-bold mb-1.5 flex items-center gap-1 text-cyan-300"><span>👁️</span>眼睛</div>
        <FeatureImg src={q.eyes && q.eyes.q} className="h-[17vh] sm:h-[22vh]" />
      </div>
      <div>
        <div className="text-xs font-bold mb-1.5 flex items-center gap-1 text-pink-300"><span>👄</span>嘴巴</div>
        <FeatureImg src={q.mouth && q.mouth.q} className="h-[17vh] sm:h-[22vh]" />
      </div>
    </div>
  );

  // ── 第一步：選團體 ────────────────────────────────────────────
  if (!sel) {
    return (
      <div className="w-full">
        {puzzle}
        <StepBadge n="1" text="第一步：先看手燈選出團體" />
        <GroupGrid groups={two.groups} correctGroup={two.correctGroup}
                   revealed={false} badGroups={badGroups} onPick={onSelectGroup} />
        {st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
      </div>
    );
  }

  // ── 第二步：展開該團成員，拖進眼睛／嘴巴 ──────────────────────
  const members = two.items[sel] || [];
  const used = [slots.eyes, slots.mouth].filter(Boolean);

  return (
    <div className="w-full">
      {puzzle}
      <StepBadge n="2" text="第二步：把成員拖進「眼睛」與「嘴巴」" />
      <SelectedGroupBar group={sel} onBack={onBackGroup}
                        mark={st.groupMark == null ? null : st.groupMark} />

      <div className={cx("grid gap-3 grid-cols-2 max-w-2xl mx-auto", shakeOn && "shake")}>
        {ZONES.map(z => {
          const val = slots[z.key];
          const mark = marks ? marks[z.key] : null;
          return (
            <div key={z.key} ref={zoneRefs[z.key]} onClick={() => tapZone(z.key)}
              className={cx("drop-zone rounded-2xl border-2 border-dashed p-3 min-h-[86px] grid place-items-center text-center cursor-pointer",
                val ? "bg-white/[.08] border-solid " + z.ring : "bg-black/30 border-white/15",
                hotZone === z.key && "zone-hot border-pink-400",
                mark === true && "glow-ok border-emerald-400/70 border-solid",
                mark === false && "glow-bad border-rose-400/70 border-solid")}>
              <div>
                <div className={cx("text-[11px] font-bold mb-1", z.tint)}>{z.emoji} {z.label}</div>
                {val
                  ? <div className="px-2 py-1.5 rounded-xl bg-white/15 border border-white/25 font-black text-[13px] sm:text-lg leading-tight break-words">
                      {val}{mark === true ? " ✅" : mark === false ? " ❌" : ""}
                    </div>
                  : <div className="text-[11px] text-slate-500">拖成員到這裡</div>}
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-4">
        <div className="text-[11px] text-slate-300/80 font-bold mb-1.5">{sel} 的成員（拖到上面兩格）</div>
        <div className="flex flex-wrap gap-2">
          {members.map(v => (
            <Chip key={v} value={v}
              used={used.indexOf(v) >= 0}
              selected={!!(selected && selected.value === v)}
              onPointerDown={e => startDrag(e, v)}
              onPointerMove={moveDrag} onPointerUp={endDrag}
              onClick={e => e.preventDefault()} />
          ))}
        </div>
      </div>

      <div className="mt-5 flex items-center justify-center gap-3 flex-wrap">
        <Btn tone="good" size="lg" disabled={!filled} onClick={submit}>確認作答 ✅</Btn>
        <Btn tone="ghost" size="sm" onClick={() => { setSlots({ eyes: null, mouth: null }); setMarks(null); setSelected(null); }}>清空重放</Btn>
        {attempts > 0 && mode === "multi" && (
          <Pill className="bg-rose-500/20 text-rose-200 border border-rose-400/30">已嘗試 {attempts} 次 · 換掉 ❌ 那格再送出</Pill>
        )}
      </div>
      {st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
      <p className="text-center text-[11px] text-slate-500 mt-3">
        眼睛與嘴巴一定是<b className="text-slate-300">這一團的不同兩位成員</b> ·
        可以直接拖曳，也可以「點成員 → 點空格」放入
      </p>

      {drag && (
        <div className="chip-ghost px-3.5 py-2 rounded-xl text-sm font-black bg-gradient-to-r from-pink-500 to-fuchsia-600 text-white border border-pink-300"
             style={{ left: drag.x + "px", top: drag.y + "px" }}>
          {drag.value}
        </div>
      )}
    </div>
  );
}

/* ========================================================================
   13. 挑戰畫面
   ====================================================================== */
function QuizScreen({ mode, deck, config, scores, setScores, states, patchState, onMenu, onFinish, bgm }) {
  const [idx, setIdx] = useState(0);
  const [left, setLeft] = useState(config.timer);
  const [running, setRunning] = useState(config.timer > 0);
  const q = deck[idx];
  const st = states[idx] || {};
  const revealed = !!st.revealed;
  const single = mode === "single";

  useEffect(() => {
    setLeft(config.timer);
    setRunning(config.timer > 0 && !revealed);
    bgm.resetDuck();
  }, [idx]);

  useEffect(() => {
    if (!running || config.timer === 0 || revealed) return;
    if (left <= 0) { setRunning(false); SFX.timeup(); return; }
    const t = setTimeout(() => { setLeft(l => l - 1); if (left <= 4) SFX.tick(); }, 1000);
    return () => clearTimeout(t);
  }, [left, running, revealed, config.timer]);

  const next = () => {
    if (idx + 1 >= deck.length) { SFX.finish(); onFinish(); } else setIdx(i => i + 1);
  };
  const prev = () => setIdx(i => Math.max(0, i - 1));

  // 主持人手動公布（卡關時的逃生門）
  const revealNow = () => { patchState(idx, { revealed: true }); setRunning(false); SFX.reveal(); };

  const two = q.__two;
  /* 答對之後一律「停在原地」等人按「下一題 →」，不做任何自動跳轉。
     單人要看清楚答案、多人要留時間給主持人加分，兩邊都不該被搶走節奏。 */

  // ── 兩段式：第一步 選團體 ──────────────────────────────────
  const selectGroup = (g) => { if (revealed) return; SFX.click(); patchState(idx, { sel: g, hint: null }); };
  const backGroup   = () => { if (revealed) return; SFX.click(); patchState(idx, { sel: null, picked: null, hint: null }); };

  // ── 兩段式：第二步 選成員／選歌曲（第一～三關）──────────────
  const pickItem = (label) => {
    if (revealed || !two) return;
    const sel = st.sel;
    const groupOk = sel === two.correctGroup;
    const ok = groupOk && label === two.correctItem;

    if (ok) {
      SFX.correct();
      patchState(idx, { revealed: true, picked: label, ok: true, hint: null });
      setRunning(false);
      return;
    }
    SFX.wrong();
    if (single) {
      // 單人：立刻公布正解
      patchState(idx, { revealed: true, picked: label, ok: false, hint: null });
      setRunning(false);
      return;
    }
    /* 多人：答對才能過關。
       這裡刻意「不動 sel」—— 玩家展開的是哪一團的清單就留在那一團，
       只把剛剛按錯的那一個劃掉，可以立刻在同一張清單上換一個再試。
       團體如果選錯了，另外把它記進 badGroups，等玩家自己按「↩ 重選團體」
       回到第一步時才會看到它被劃掉，畫面不會被強制拉回去。 */
    const attempts = (st.attempts || 0) + 1;
    patchState(idx, {
      attempts,
      picked: label,
      groupMark: groupOk,
      badItems: uniq((st.badItems || []).concat([label])),
      badGroups: groupOk ? (st.badGroups || []) : uniq((st.badGroups || []).concat([sel])),
      hint: groupOk
        ? "「" + label + "」不對，同一團裡再挑一個" + (two.kind === "song" ? "歌" : "人")
        : "這一團不對 —— 按上面的「↩ 重選團體」換一團試試",
    });
  };

  // ── 第四關拖拉判定回呼 ─────────────────────────────────────
  const judgeL4 = (ok, info) => {
    if (ok) {
      patchState(idx, { revealed: true, ok: true, slots: info.slots, hint: null });
      setRunning(false);
      return;
    }
    if (single) {
      patchState(idx, { revealed: true, ok: false, slots: info.slots, hint: null });
      setRunning(false);
      return;
    }
    /* 多人：不公布答案，也「不清空任何東西」——
       已選的團體、已經拖好的眼睛／嘴巴通通留在原位，只在格子上標 ✅ / ❌，
       玩家直接把標 ❌ 的那格換成別人再送出就好。
       注意：不能把放錯的成員名牌永久劃掉 —— 放錯在「眼睛」的人，
       很可能正是「嘴巴」的正解。 */
    const attempts = (st.attempts || 0) + 1;
    patchState(idx, {
      attempts,
      slots: info.slots,
      groupMark: info.groupOk,
      badGroups: info.groupOk ? (st.badGroups || []) : uniq((st.badGroups || []).concat([st.sel])),
      hint: info.groupOk
        ? "打 ❌ 的那一格放錯人了，換掉再送出一次"
        : "這一團不對 —— 按上面的「↩ 重選團體」換一團試試",
    });
  };

  const addScore = (ti, d) => {
    setScores(s => { const n = s.slice(); n[ti] = (n[ti] || 0) + d; return n; });
    if (d > 0) SFX.correct(); else SFX.wrong();
  };

  const meta = LEVEL_META.filter(m => m.id === q.__level)[0];
  const timePct = config.timer ? Math.max(0, left) / config.timer * 100 : 0;
  const answered = states.filter(s => s && s.ok != null);
  const rightN = answered.filter(s => s.ok).length;
  const wrongN = answered.length - rightN;

  return (
    <div className="relative min-h-screen flex flex-col">
      <div className="fixed inset-0 z-0 bg-[#07040f]" />
      <div className="aurora opacity-60"><i /><i /><i /><i /></div>

      <div className="relative z-10 flex flex-col min-h-screen">
        {/* 頂部 */}
        <div className="sticky top-0 z-20 backdrop-blur bg-black/50 border-b border-white/10">
          <div className="mx-auto max-w-6xl px-4 py-3 flex items-center gap-3 flex-wrap">
            <button onClick={() => { SFX.click(); onMenu(); }} className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-sm">← 主選單</button>
            <Pill className={cx("bg-gradient-to-r text-white", meta ? meta.accent : "from-slate-600 to-slate-700")}>
              {meta ? meta.emoji + " 第" + CN[meta.n-1] + "關 " + meta.title : "題目"}
            </Pill>
            <Pill className={cx("border", single ? "bg-cyan-500/20 text-cyan-200 border-cyan-400/30" : "bg-pink-500/20 text-pink-200 border-pink-400/30")}>
              {single ? "🎮 單人" : "🏆 多人"}
            </Pill>
            <div className="text-sm text-slate-300 font-mono">{idx + 1} / {deck.length}</div>
            <div className="flex-1 min-w-[80px] h-1.5 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all" style={{ width: ((idx + 1) / deck.length * 100) + "%" }} />
            </div>
            {config.timer > 0 && (
              <div className="flex items-center gap-2">
                <div className="relative w-12 h-12 grid place-items-center">
                  <svg className="absolute inset-0 -rotate-90" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,.12)" strokeWidth="3" />
                    <circle cx="18" cy="18" r="16" fill="none" stroke={left <= 5 ? "#f43f5e" : "#22d3ee"} strokeWidth="3"
                            strokeDasharray={2 * Math.PI * 16} strokeDashoffset={2 * Math.PI * 16 * (1 - timePct / 100)}
                            strokeLinecap="round" style={{ transition: "stroke-dashoffset .9s linear" }} />
                  </svg>
                  <span className={cx("text-sm font-black", left <= 5 ? "text-rose-400" : "text-cyan-300")}>{Math.max(0, left)}</span>
                </div>
                <button onClick={() => { SFX.click(); setRunning(r => !r); }} className="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs">
                  {running ? "⏸" : "▶"}
                </button>
              </div>
            )}
            <BgmButton bgm={bgm} className="!px-3 !py-1.5 !rounded-lg" />
          </div>
        </div>

        {/* 題目 */}
        <div className="flex-1 mx-auto w-full max-w-5xl px-4 py-6">
          <div className="fade-in" key={q.id}>
            {q.__level === "level1" && <Level1Stage q={q} revealed={revealed} flashSec={config.flashSec} />}
            {q.__level === "level2" && <Level2Stage q={q} revealed={revealed} duck={bgm.duck} unduck={bgm.unduck} />}
            {q.__level === "level3" && <Level3Stage q={q} revealed={revealed} maskMode={config.maskMode} maskLevel={config.maskLevel} duck={bgm.duck} unduck={bgm.unduck} />}
            {q.__level === "level4" && (
              <Level4Stage q={q} two={two} mode={mode} revealed={revealed} st={st}
                           onJudge={judgeL4} onSelectGroup={selectGroup} onBackGroup={backGroup} />
            )}
            {q.__level === "level5" && <Level5Stage q={q} revealed={revealed} duck={bgm.duck} unduck={bgm.unduck} />}
          </div>

          {/* 第一～三關：兩段式作答（先選團體 → 再選成員／歌曲） */}
          {q.__level !== "level4" && two && (
            <div className="mt-6">
              <TwoStage two={two} st={st} revealed={revealed}
                        onSelectGroup={selectGroup} onBackGroup={backGroup} onPickItem={pickItem} />
            </div>
          )}

          {/* 結果橫幅 */}
          {revealed && st.ok != null && (
            <div className={cx("mt-5 mx-auto max-w-3xl rounded-2xl px-5 py-3 text-center font-black text-lg border pop",
              st.ok ? "bg-emerald-500/20 border-emerald-400/50 text-emerald-200"
                    : "bg-rose-600/20 border-rose-400/50 text-rose-200")}>
              {st.ok ? "🎉 完全正確！" : "😵 答錯了，正確答案已公布"}
              <span className="block text-xs font-medium opacity-80 mt-1">
                看完答案後按下面的「{idx + 1 >= deck.length ? "看結果 🏁" : "下一題 →"}」繼續
              </span>
            </div>
          )}
          {!revealed && !single && (st.attempts || 0) > 0 && q.__level !== "level4" && (
            <div className="mt-5 mx-auto max-w-3xl rounded-2xl px-5 py-2.5 text-center font-bold border pop
                            bg-rose-500/15 border-rose-400/40 text-rose-200 text-sm">
              已嘗試 {st.attempts} 次 · 答對才會進入下一題 —— 目前的選擇都留著，直接換一個再點就好
            </div>
          )}

          <div className="mt-7 flex flex-wrap gap-3 justify-center">
            <Btn tone="ghost" size="sm" onClick={prev} disabled={idx === 0}>← 上一題</Btn>
            {!revealed
              ? <Btn size="lg" tone="ghost" onClick={revealNow}>
                  {single ? "放棄，看答案" : "主持人公布答案"}
                </Btn>
              : <Btn size="lg" tone={st.ok ? "good" : "cyan"} onClick={next}
                     className={st.ok ? "flash-ring" : ""}>
                  {idx + 1 >= deck.length ? "看結果 🏁" : "下一題 →"}
                </Btn>}
            <Btn tone="ghost" size="sm" onClick={next} disabled={!single && !revealed}>跳過 →</Btn>
          </div>
        </div>

        {/* 底部：單人計分 / 多人計分板 */}
        <div className="sticky bottom-0 backdrop-blur bg-black/55 border-t border-white/10">
          <div className="mx-auto max-w-6xl px-4 py-3 flex gap-3 overflow-x-auto scroll-thin">
            {single ? (
              <div className="flex items-center gap-3 mx-auto">
                <Pill className="bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 !px-4 !py-1.5 !text-sm">
                  ✅ 答對 <b className="text-lg ml-1">{rightN}</b>
                </Pill>
                <Pill className="bg-rose-500/20 text-rose-200 border border-rose-400/30 !px-4 !py-1.5 !text-sm">
                  ❌ 答錯 <b className="text-lg ml-1">{wrongN}</b>
                </Pill>
                <Pill className="bg-white/10 text-slate-300 !px-4 !py-1.5 !text-sm">
                  已作答 {answered.length} / {deck.length}
                </Pill>
              </div>
            ) : (
              config.teams.map((t, i) => (
                <div key={i} className="flex items-center gap-2 shrink-0 rounded-2xl bg-white/5 border border-white/10 px-3 py-2">
                  <div className="min-w-[70px]">
                    <div className="text-xs text-slate-400 truncate max-w-[110px]">{t}</div>
                    <div className="text-xl font-black text-white leading-none">{scores[i] || 0}</div>
                  </div>
                  <button onClick={() => addScore(i, 1)} className="w-9 h-9 rounded-xl bg-emerald-500/80 hover:bg-emerald-400 font-bold">＋</button>
                  <button onClick={() => addScore(i, -1)} className="w-9 h-9 rounded-xl bg-rose-600/70 hover:bg-rose-500 font-bold">－</button>
                </div>
              ))
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================================
   14. 結算
   ====================================================================== */
function ResultScreen({ mode, config, deck, states, scores, bgm, onMenu, onCover, onAgain }) {
  const single = mode === "single";

  if (single) {
    const answered = states.filter(s => s && s.ok != null);
    const right = answered.filter(s => s.ok).length;
    const total = deck.length;
    const pct = total ? Math.round(right / total * 100) : 0;
    const grade = pct >= 90 ? { t: "KPOP 之王 👑", c: "text-amber-300" }
                : pct >= 70 ? { t: "資深粉絲 💖", c: "text-pink-300" }
                : pct >= 40 ? { t: "路人轉粉中 🌱", c: "text-cyan-300" }
                            : { t: "還要多聽幾首 🎧", c: "text-slate-300" };
    const byLevel = LEVEL_META.map(m => {
      const idxs = deck.map((q, i) => q.__level === m.id ? i : -1).filter(i => i >= 0);
      const r = idxs.filter(i => states[i] && states[i].ok).length;
      return { m, n: idxs.length, r };
    }).filter(x => x.n > 0);

    return (
      <div className="relative min-h-screen grid place-items-center px-4 py-12">
        <AnimatedBackdrop cover={null} />
        <div className="fixed top-4 right-4 z-40"><BgmButton bgm={bgm} /></div>
        <Card className="relative z-10 p-8 w-full max-w-2xl text-center fade-in">
          <div className="text-6xl mb-2">🎮</div>
          <h1 className="text-4xl font-black title-glow">單人挑戰結果</h1>
          <div className={cx("mt-3 text-2xl font-black", grade.c)}>{grade.t}</div>

          <div className="mt-7 flex items-end justify-center gap-2">
            <span className="text-7xl font-black text-white leading-none">{right}</span>
            <span className="text-2xl text-slate-400 mb-2">/ {total} 題</span>
          </div>
          <div className="mt-3 mx-auto max-w-sm h-3 rounded-full bg-white/10 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all" style={{ width: pct + "%" }} />
          </div>
          <div className="mt-2 text-slate-300 font-mono">正確率 {pct}%</div>

          <div className="mt-7 space-y-2 text-left">
            {byLevel.map(({ m, n, r }) => (
              <div key={m.id} className="flex items-center gap-3 rounded-2xl bg-white/5 border border-white/10 px-4 py-2.5">
                <span className="text-xl">{m.emoji}</span>
                <span className="flex-1 text-sm font-bold">第{CN[m.n-1]}關 · {m.title}</span>
                <span className="font-mono text-slate-300">{r} / {n}</span>
                <span className="w-16 text-right font-black text-white">{n ? Math.round(r / n * 100) : 0}%</span>
              </div>
            ))}
          </div>

          <div className="mt-8 flex gap-3 justify-center flex-wrap">
            <Btn onClick={onAgain}>再玩一次 🔁</Btn>
            <Btn tone="ghost" onClick={onMenu}>回主選單</Btn>
            <Btn tone="ghost" onClick={onCover}>回封面</Btn>
          </div>
        </Card>
      </div>
    );
  }

  const rank = config.teams.map((t, i) => ({ name: t, score: scores[i] || 0 })).sort((a, b) => b.score - a.score);
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div className="relative min-h-screen grid place-items-center px-4 py-12">
      <AnimatedBackdrop cover={null} />
      <div className="fixed top-4 right-4 z-40"><BgmButton bgm={bgm} /></div>
      <Card className="relative z-10 p-8 w-full max-w-2xl text-center fade-in">
        <div className="text-6xl mb-2">👑</div>
        <h1 className="text-4xl font-black title-glow">賽果揭曉</h1>
        <p className="text-slate-400 mt-2">恭喜本屆 KPOP 之王！</p>
        <div className="mt-8 space-y-3">
          {rank.map((r, i) => (
            <div key={i} className={cx("flex items-center gap-4 rounded-2xl px-5 py-4 border",
              i === 0 ? "bg-gradient-to-r from-amber-500/25 to-yellow-500/10 border-amber-400/40" : "bg-white/5 border-white/10")}>
              <span className="text-2xl w-8">{medals[i] || (i + 1)}</span>
              <span className="flex-1 text-left font-bold text-lg">{r.name}</span>
              <span className="text-3xl font-black text-white">{r.score}</span>
            </div>
          ))}
        </div>
        <div className="mt-8 flex gap-3 justify-center flex-wrap">
          <Btn onClick={onAgain}>再玩一次 🔁</Btn>
          <Btn tone="ghost" onClick={onMenu}>回主選單</Btn>
          <Btn tone="ghost" onClick={onCover}>回封面</Btn>
        </div>
      </Card>
    </div>
  );
}

/* ========================================================================
   15. 根元件
   ====================================================================== */
const BASE_LEVELS = {
  level1: { on: true, count: 5 }, level2: { on: true, count: 5 },
  level3: { on: true, count: 5 }, level4: { on: true, count: 5 },
  level5: { on: true, count: 5 },
};
const DEFAULT_CFG = {
  single: {
    levels: JSON.parse(JSON.stringify(BASE_LEVELS)),
    teams: ["我"],
    timer: 0,             // 單人預設也不計時
    flashSec: 1.0,
    optionCount: 12,      // 第一步要出現幾個團體
    maskMode: "silhouette", maskLevel: 0.7,
    sfx: true, sfxVol: 0.85, mixLevels: false,
  },
  multi: {
    levels: JSON.parse(JSON.stringify(BASE_LEVELS)),
    teams: ["隊伍 1", "隊伍 2"],
    timer: 0,             // 多人預設不計時（主持人自己控節奏）
    flashSec: 1.0,
    optionCount: 12,
    maskMode: "silhouette", maskLevel: 0.7,
    sfx: true, sfxVol: 0.85, mixLevels: false,
  },
};

function App() {
  const [screen, setScreen] = useState("cover");
  const [mode, setMode] = useState("single");
  const [cfgAll, setCfgAll] = useState(DEFAULT_CFG);
  const [deck, setDeck] = useState([]);
  const [states, setStates] = useState([]);     // 每題作答狀態
  const [scores, setScores] = useState([0, 0]);
  const [showSettings, setShowSettings] = useState(false);

  // 全域設定（不分模式）：BGM 音量／曲目、封面背景卡片數量
  const TRACKS = useMemo(() => (DATA && DATA.bgm ? DATA.bgm : []), []);
  const [gcfg, setGcfg] = useState(() => ({
    bgmVol: 0.42,
    photoCount: 12,
    bgmTrack: (DATA && DATA.bgm && DATA.bgm[0]) || "",
    trackName: trackLabel((DATA && DATA.bgm && DATA.bgm[0]) || ""),
    custom: false,
  }));

  const config = cfgAll[mode];
  const setConfig = useCallback((updater) => {
    setCfgAll(all => {
      const cur = all[mode];
      const nextCfg = typeof updater === "function" ? updater(cur) : updater;
      return { ...all, [mode]: nextCfg };
    });
  }, [mode]);

  const pools = useMemo(() => {
    const out = {};
    LEVEL_KEYS.forEach(k => { out[k] = []; });
    if (!DATA || !DATA.levels) return out;
    LEVEL_KEYS.forEach(k => {
      const lv = DATA.levels[k];
      out[k] = (lv && lv.questions ? lv.questions : []).map(q => ({ ...q, __level: k }));
    });
    return out;
  }, []);

  // 第四關名冊：優先用掃描器產生的 groups，沒有就從題目推回來
  const l4groups = useMemo(() => {
    const lv = DATA && DATA.levels && DATA.levels.level4;
    if (lv && lv.groups && lv.groups.length) return lv.groups;
    return deriveL4Groups(pools.level4);
  }, [pools]);

  // 兩段式作答用的名冊：團體 → 成員 / 團體 → 歌曲
  const rosters = useMemo(() => buildRosters(pools, l4groups), [pools, l4groups]);

  const cover = (DATA && DATA.cover) ? DATA.cover : null;
  const totals = LEVEL_META.map(m => ({ label: m.title, emoji: m.emoji, n: pools[m.id].length }));

  const dataError = useMemo(() => {
    if (!DATA) return "找不到題庫檔 quiz-data.js。請先執行資料夾中的「更新題庫.bat」重新掃描素材。";
    const total = Object.keys(pools).reduce((s, k) => s + pools[k].length, 0);
    if (total === 0) return "題庫是空的。請確認 D:\\kpop 各關資料夾內有素材，並執行「更新題庫.bat」。";
    return null;
  }, [pools]);

  // 四關「第一步」可選的團體總數，設定畫面拿來顯示上限
  const groupTotal = useMemo(() => {
    const s2 = {};
    Object.keys(rosters.members).forEach(k => { s2[k] = 1; });
    Object.keys(rosters.songs).forEach(k => { s2[k] = 1; });
    (l4groups || []).forEach(g => { s2[g.name] = 1; });
    return Object.keys(s2).length;
  }, [rosters, l4groups]);

  const bgm = useBgm(gcfg.bgmTrack);
  useEffect(() => { bgm.setBaseVolume(gcfg.bgmVol); }, [gcfg.bgmVol]);
  useEffect(() => { SFX.setEnabled(config.sfx); }, [config.sfx]);
  useEffect(() => { SFX.setVolume(config.sfxVol); }, [config.sfxVol]);

  const patchState = useCallback((i, patch) => {
    setStates(s => { const n = s.slice(); n[i] = { ...(n[i] || {}), ...patch }; return n; });
  }, []);

  const buildDeck = () => {
    let d = [];
    LEVEL_KEYS.forEach(k => {
      const lv = config.levels[k];
      if (!lv.on) return;
      d = d.concat(pickN(pools[k], lv.count));
    });
    if (config.mixLevels) d = shuffle(d);
    // 出題當下就把兩段式選項算好，之後上一題下一題都不會變
    return d.map(q => attachTwo(q, config, rosters, l4groups));
  };

  const startChallenge = () => {
    const d = buildDeck();
    if (!d.length) return;
    setDeck(d);
    setStates(d.map(() => ({})));
    setScores(config.teams.map(() => 0));
    bgm.resetDuck();
    bgm.suspend();              // 進入挑戰 → 自動停止背景音樂
    setScreen("quiz");
  };

  const pickMode = (m) => { setMode(m); setScreen("menu"); };
  const goMenu  = () => { bgm.resetDuck(); bgm.wake(); setScreen("menu"); };
  const goCover = () => { bgm.resetDuck(); bgm.wake(); setScreen("cover"); };
  const finish  = () => { bgm.resetDuck(); bgm.wake(); setScreen("result"); };

  const settings = showSettings && (
    <GlobalSettingsModal g={gcfg} setG={setGcfg} tracks={TRACKS} maxPhotos={MAX_PHOTOS}
                         onClose={() => setShowSettings(false)} />
  );
  const openSettings = () => setShowSettings(true);

  let screenEl;
  if (screen === "cover")
    screenEl = <CoverScreen cover={cover} totals={totals} bgm={bgm} photoCount={gcfg.photoCount}
                            onPickMode={pickMode} onOpenSettings={openSettings} />;
  else if (screen === "menu")
    screenEl = <MenuScreen mode={mode} config={config} setConfig={setConfig} pools={pools}
                           groupTotal={groupTotal} dataError={dataError} bgm={bgm}
                           onBack={goCover} onStart={startChallenge} onOpenSettings={openSettings} />;
  else if (screen === "quiz")
    screenEl = <QuizScreen mode={mode} deck={deck} config={config} scores={scores} setScores={setScores}
                           states={states} patchState={patchState}
                           bgm={bgm} onMenu={goMenu} onFinish={finish} />;
  else
    screenEl = <ResultScreen mode={mode} config={config} deck={deck} states={states} scores={scores} bgm={bgm}
                             onMenu={goMenu} onCover={goCover} onAgain={startChallenge} />;

  return <>{screenEl}{settings}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
