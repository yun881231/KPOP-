<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPOP之王巔峰賽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0a0616" />
<meta name="description" content="KPOP之王巔峰賽 — 四大關卡 K-POP 互動測驗" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #07040f;
    overflow-x: hidden;
  }

  /* ---------- 動態背景：極光光暈 ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1){ width:56vw; height:56vw; left:-14vw; top:-18vw; background:#ec4899; animation-duration:24s; }
  .aurora i:nth-child(2){ width:48vw; height:48vw; right:-12vw; top:-10vw; background:#6366f1; animation-duration:31s; animation-delay:-6s; }
  .aurora i:nth-child(3){ width:44vw; height:44vw; left:22vw; bottom:-20vw; background:#22d3ee; animation-duration:28s; animation-delay:-12s; opacity:.4; }
  .aurora i:nth-child(4){ width:34vw; height:34vw; right:8vw; bottom:-14vw; background:#a855f7; animation-duration:35s; animation-delay:-3s; }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    33%  { transform: translate3d(6vw,4vh,0) scale(1.15); }
    66%  { transform: translate3d(-5vw,7vh,0) scale(.92); }
    100% { transform: translate3d(3vw,-5vh,0) scale(1.08); }
  }

  /* ---------- 掃過畫面的光帶 ---------- */
  .sheen { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .sheen::after {
    content:""; position:absolute; top:-50%; left:-60%; width:35%; height:200%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.055), transparent);
    transform: rotate(12deg); animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep { 0%,72% { left:-60%; } 100% { left:130%; } }

  /* ---------- 封面照片牆 ---------- */
  /* 封面照片卡 —— 不使用任何固定比例容器
     .pw-slot  絕對定位 + 滑鼠視差（inline transform）+ 淡入（只動 opacity）
     .pw-float 上下浮動 + drop-shadow 柔邊光暈（會沿著圖片實際形狀，不是方框）
     img       width:100% / height:auto → 完全依原圖比例自適應，永不裁切
               border-radius 20px + mask 羽化 → 柔邊矩形 */
  .pw-slot { position: absolute; pointer-events: auto; will-change: transform;
             animation: pwFade .8s ease both; }
  @keyframes pwFade { from { opacity: 0 } to { opacity: 1 } }

  .pw-float {
    display: block;
    animation: floaty 9s ease-in-out infinite alternate;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.55));
    transition: filter .3s ease;
    will-change: transform, filter;
  }
  @keyframes floaty { from { transform: translateY(0) } to { transform: translateY(-16px) } }

  .pw-main {
    display: block; margin: 0 auto;
    /* 只給最大值、寬高都 auto → 瀏覽器等比縮到剛好，元素本身就是原圖比例 */
    max-width: 100%;
    max-height: min(22vh, 200px);
    width: auto; height: auto;
    object-fit: contain;              /* 完整顯示，絕不裁切 */
    border-radius: 20px;
    transition: transform .3s ease, filter .3s ease;
    will-change: transform;
    /* 柔邊羽化：邊緣淡出一點點，不會像貼紙硬邊 */
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
  }
  .pw-float:hover .pw-main { transform: scale(1.05); filter: brightness(1.12) saturate(1.06); }
  .pw-float:hover { filter: drop-shadow(0 14px 40px rgba(236,72,153,.55)); }

  /* 中央主視覺大圖：同樣不鎖比例，只給最大高寬 */
  .hero-wrap {
    display: block;
    filter: drop-shadow(0 16px 44px rgba(0,0,0,.65));
    transition: filter .3s ease;
  }
  .hero-wrap:hover { filter: drop-shadow(0 20px 56px rgba(236,72,153,.5)); }
  .hero-img {
    display: block;
    max-width: min(90vw, 640px);
    max-height: 26vh;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 24px;
    transition: transform .3s ease;
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
  }
  .hero-wrap:hover .hero-img { transform: scale(1.05); }

  /* ---------- 封面：鎖死單一螢幕，絕不出現捲軸 ---------- */
  body.no-scroll { overflow: hidden !important; height: 100%; }
  .cover-root {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  .cover-stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(6px, 1.4vh, 18px);
    padding: clamp(8px, 2vh, 28px) 4vw;
    text-align: center;
    pointer-events: none;
  }
  .cover-title {
    font-size: clamp(26px, min(8.2vh, 9vw), 84px);
    line-height: 1.04;
    font-weight: 900;
    margin: 0;
  }
  .cover-sub  { font-size: clamp(10px, 1.7vh, 16px); }
  .cover-hint { font-size: clamp(9px, 1.3vh, 12px); }
  .cover-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  @media (max-height: 560px) { .cover-stats, .cover-hint { display: none; } }
  @media (max-height: 440px) { .cover-sub { display: none; } }

  .fade-in { animation: fadeIn .45s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .fade-up-1 { animation: fadeIn .7s ease .10s both; }
  .fade-up-2 { animation: fadeIn .7s ease .28s both; }
  .fade-up-3 { animation: fadeIn .7s ease .46s both; }
  .pop{ animation: pop .3s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)} }

  .pixelated { image-rendering: pixelated; image-rendering: -moz-crisp-edges; }
  input[type=range]{ accent-color:#ec4899; }
  .flash-ring{ box-shadow:0 0 0 2px rgba(236,72,153,.55), 0 0 44px rgba(236,72,153,.28); }
  .scroll-thin::-webkit-scrollbar{ width:8px; height:8px }
  .scroll-thin::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:8px }

  /* 柔邊矩形圖片：只給最大寬高、寬高都 auto → 原比例完整顯示，永不裁切 */
  .soft-img {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 16px;
    -webkit-mask-image: radial-gradient(122% 122% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(122% 122% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
  }

  /* ---------- 第四關：拖拉互動 ---------- */
  /* touch-action:none 讓手機拖曳時不會變成捲動頁面；
     所有拖曳都用 Pointer Events，滑鼠／觸控／觸控筆同一套程式碼。
     另外每個名牌也支援「點一下選取 → 點空格放入」的無拖曳操作方式。 */
  .chip {
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    cursor: grab;
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
  }
  .chip:active { cursor: grabbing; }
  .chip:hover  { transform: translateY(-2px); }
  .chip-ghost {
    position: fixed; z-index: 70; pointer-events: none;
    transform: translate(-50%, -50%) scale(1.08) rotate(-2deg);
    box-shadow: 0 18px 40px rgba(0,0,0,.6);
  }
  .drop-zone { transition: transform .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .zone-hot  { transform: scale(1.035); box-shadow: 0 0 0 3px rgba(236,72,153,.55), 0 0 34px rgba(236,72,153,.3); }
  .shake { animation: shakeX .42s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeX {
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
  }
  .glow-ok  { box-shadow: 0 0 0 2px rgba(52,211,153,.65), 0 0 30px rgba(52,211,153,.28); }
  .glow-bad { box-shadow: 0 0 0 2px rgba(244,63,94,.65),  0 0 30px rgba(244,63,94,.28); }

  /* ---------- 標題／光環／背景推鏡 ----------
     這幾個是自訂類別，不是 Tailwind 產生的，所以直接寫在這裡，
     重新編譯 styles.css 也不會被洗掉。 */
  .title-glow {
    background: linear-gradient(100deg,#ffffff 0%,#fbcfe8 26%,#f0abfc 48%,#a5f3fc 74%,#ffffff 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(236,72,153,.45));
    animation: titleSheen 7s ease-in-out infinite;
  }
  @keyframes titleSheen { 0%,100%{ background-position: 0% 50% } 50%{ background-position: 100% 50% } }

  .cta-ring { position: relative; }
  .cta-ring::before {
    content:""; position:absolute; inset:-10px; border-radius:9999px; z-index:-1; pointer-events:none;
    background: radial-gradient(closest-side, rgba(236,72,153,.45), rgba(236,72,153,0) 70%);
    animation: ctaPulse 2.4s ease-in-out infinite;
  }
  @keyframes ctaPulse { 0%,100%{ transform:scale(1); opacity:.55 } 50%{ transform:scale(1.12); opacity:.95 } }

  .kenburns { animation: kenburnsMove 28s ease-in-out infinite alternate; transform-origin: 50% 45%; }
  @keyframes kenburnsMove { from{ transform:scale(1) } to{ transform:scale(1.14) translate3d(-1.5%,-1%,0) } }

  @media (prefers-reduced-motion: reduce) {
    .aurora i, .sheen::after, .pw-slot, .pw-float, .title-glow, .cta-ring::before, .kenburns { animation: none !important; }
    .pw-main, .hero-img, .pw-float, .hero-wrap, .chip, .drop-zone { transition: none !important; }
  }
</style>
</head>
<body class="text-slate-100">
<div id="root"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>
<script src="./quiz-data.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ========================================================================
   0. 工具
   ====================================================================== */
const DATA = (typeof window !== "undefined" && window.QUIZ_DATA) ? window.QUIZ_DATA : null;

// 本機直接開檔時素材在上一層（".."）；打包成網頁版時改成 "assets"
const ASSET_BASE = (DATA && DATA.assetBase ? String(DATA.assetBase) : "..").replace(/\/+$/, "");
const _warned = {};

/* 把題庫裡的路徑轉成瀏覽器可以讀的網址。三種情況都支援：
   1. http(s):// 或 // 開頭 → 圖床／外連圖片，原樣使用
   2. data: 開頭            → 內嵌圖片，原樣使用
   3. 其餘                  → 一律當成專案內的相對路徑，接在 ASSET_BASE 後面
   另外會擋掉誤填的本機絕對路徑（D:\kpop\... 或 file:///D:/...），
   自動改回相對路徑並在 console 提醒，避免分享出去後別人看不到圖。 */
function assetUrl(p) {
  if (!p) return "";
  let s = String(p).trim();
  if (/^(https?:)?\/\//i.test(s) || /^data:/i.test(s) || /^blob:/i.test(s)) return s;
  s = s.replace(/\\/g, "/");
  const abs = s.match(/^(?:file:\/\/\/)?[A-Za-z]:\/(.*)$/i);
  if (abs) {
    const segs = abs[1].split("/");
    const i = segs.findIndex(g => /^(封面|cover|assets|第[一二三四]關|level[1-4]|介面音樂|bgm)/.test(g));
    const fixed = (i >= 0 ? segs.slice(i) : segs.slice(-2)).join("/");
    if (!_warned[p]) {
      _warned[p] = 1;
      console.warn("[KPOP] 題庫裡有本機絕對路徑，別人的電腦讀不到，已自動改成相對路徑：\n  " + p + "\n→ " + fixed);
    }
    s = fixed;
  }
  s = s.replace(/^\/+/, "");
  return ASSET_BASE + "/" + s.split("/").map(encodeURIComponent).join("/");
}

/* 圖片載不到時顯示可見的佔位圖並在 console 印出實際網址，
   這樣分享給朋友出問題時，一眼就知道是哪一個檔案缺了 */
const MISSING_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">' +
  '<rect width="100%" height="100%" rx="20" fill="#1c1030"/>' +
  '<rect x="6" y="6" width="308" height="228" rx="16" fill="none" stroke="#5b4a7a" stroke-dasharray="8 6"/>' +
  '<g fill="#8d86a8" font-family="sans-serif" text-anchor="middle">' +
  '<text x="160" y="120" font-size="46">?</text>' +
  '<text x="160" y="160" font-size="15">找不到圖片</text></g></svg>');

function onImgError(e) {
  const el = e.currentTarget;
  if (el.dataset.failed) return;
  el.dataset.failed = "1";
  console.warn("[KPOP] 圖片載入失敗：", el.getAttribute("src"),
               "\n檢查 docs/assets 底下是否真的有這個檔案，以及大小寫是否完全一致。");
  el.src = MISSING_IMG;
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function pickN(arr, n) { return (!n || n >= arr.length) ? shuffle(arr) : shuffle(arr).slice(0, n); }
function cx(...a) { return a.filter(Boolean).join(" "); }
function uniq(a) { const s = {}, o = []; a.forEach(v => { if (v && !s[v]) { s[v] = 1; o.push(v); } }); return o; }
const CN = ["一", "二", "三", "四", "五"];
const LEVEL_KEYS = ["level1", "level2", "level3", "level4", "level5"];

/* ========================================================================
   1. 音效（Web Audio 合成）— 可調音量
   ====================================================================== */
const SFX = (() => {
  let ctx = null, enabled = true, master = 1;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type, vol) {
    if (!enabled) return;
    const v = (vol || 0.22) * master;
    if (v <= 0.0005) return;                 // 音量 0 時直接不發聲（指數斜坡不能收到 0）
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(v, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  return {
    setEnabled(v) { enabled = !!v; },
    setVolume(v) { master = Math.max(0, Math.min(1.2, Number(v) || 0)); },
    unlock() { ac(); },
    correct() { tone(784,0,.18,"triangle",.25); tone(1046,.12,.28,"triangle",.25); tone(1318,.24,.40,"triangle",.2); },
    wrong()   { tone(220,0,.22,"sawtooth",.18); tone(160,.16,.34,"sawtooth",.16); },
    reveal()  { tone(523,0,.12,"sine",.18); tone(659,.08,.14,"sine",.18); tone(880,.16,.3,"sine",.18); },
    tick()    { tone(1200,0,.05,"square",.06); },
    timeup()  { tone(440,0,.18,"square",.2); tone(330,.18,.18,"square",.2); tone(220,.36,.5,"square",.2); },
    click()   { tone(900,0,.04,"sine",.08); },
    drop()    { tone(620,0,.06,"sine",.10); tone(880,.05,.08,"sine",.08); },
    enter()   { tone(392,0,.12,"triangle",.16); tone(587,.09,.16,"triangle",.16); tone(784,.19,.32,"triangle",.16); },
    finish()  { [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.5,"triangle",.22)); }
  };
})();

/* ========================================================================
   2. 背景音樂：loop / ducking / 進入挑戰自動停止
   ====================================================================== */
function useBgm(src) {
  const audioRef = useRef(null);
  const baseVolRef = useRef(0.42);
  const fadeRef = useRef(null);
  const duckRef = useRef(0);
  const [muted, setMuted] = useState(false);
  const [suspended, setSuspended] = useState(false);
  const [unlocked, setUnlocked] = useState(false);

  useEffect(() => {
    if (!src) { audioRef.current = null; return; }
    const a = new Audio(assetUrl(src));
    a.loop = true; a.volume = 0; a.preload = "auto";
    audioRef.current = a;
    return () => { try { a.pause(); } catch (e) {} audioRef.current = null; };
  }, [src]);

  const fadeTo = useCallback((target, ms, thenPause) => {
    const a = audioRef.current; if (!a) return;
    if (fadeRef.current) clearInterval(fadeRef.current);
    const steps = Math.max(1, Math.round(ms / 40));
    const from = a.volume; let i = 0;
    fadeRef.current = setInterval(() => {
      i++;
      try { a.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps))); } catch (e) {}
      if (i >= steps) {
        clearInterval(fadeRef.current); fadeRef.current = null;
        if (thenPause) { try { a.pause(); } catch (e) {} }
      }
    }, 40);
  }, []);

  // 第一次互動解鎖播放
  useEffect(() => {
    const unlock = () => { SFX.unlock(); setUnlocked(true); };
    window.addEventListener("pointerdown", unlock);
    window.addEventListener("keydown", unlock);
    return () => { window.removeEventListener("pointerdown", unlock); window.removeEventListener("keydown", unlock); };
  }, []);

  const shouldPlay = unlocked && !muted && !suspended;
  useEffect(() => {
    const a = audioRef.current; if (!a) return;
    if (shouldPlay) {
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      fadeTo(duckRef.current > 0 ? 0.05 : baseVolRef.current, 650);
    } else {
      fadeTo(0, 380, true);
    }
  }, [shouldPlay, fadeTo, src]);        // 換曲之後要重新淡入

  const duck = useCallback(() => {
    duckRef.current += 1;
    if (duckRef.current === 1 && shouldPlay) fadeTo(0.05, 420);
  }, [fadeTo, shouldPlay]);
  const unduck = useCallback(() => {
    duckRef.current = Math.max(0, duckRef.current - 1);
    if (duckRef.current === 0 && shouldPlay) fadeTo(baseVolRef.current, 650);
  }, [fadeTo, shouldPlay]);
  const resetDuck = useCallback(() => {
    duckRef.current = 0;
    if (shouldPlay) fadeTo(baseVolRef.current, 450);
  }, [fadeTo, shouldPlay]);

  const toggle = useCallback(() => {
    SFX.unlock(); setUnlocked(true);
    if (muted || suspended) { setMuted(false); setSuspended(false); }
    else setMuted(true);
  }, [muted, suspended]);

  const setBaseVolume = useCallback((v) => {
    baseVolRef.current = v;
    if (shouldPlay && duckRef.current === 0) fadeTo(v, 200);
  }, [fadeTo, shouldPlay]);

  return {
    on: !muted && !suspended,
    playing: shouldPlay,
    hasTrack: !!src,
    toggle,
    suspend: () => setSuspended(true),
    wake: () => setSuspended(false),
    duck, unduck, resetDuck, setBaseVolume,
  };
}

/* ========================================================================
   3. 共用 UI
   ====================================================================== */
function Btn({ children, onClick, tone = "primary", size = "md", disabled, className }) {
  const tones = {
    primary: "bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-400 hover:to-fuchsia-500 text-white shadow-lg shadow-pink-500/25",
    ghost: "bg-white/10 hover:bg-white/20 text-slate-100 border border-white/15",
    good: "bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white shadow-lg shadow-emerald-500/20",
    bad: "bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-lg shadow-rose-500/20",
    cyan: "bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-white shadow-lg shadow-cyan-500/20",
    amber: "bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white shadow-lg shadow-amber-500/20",

/* ========================================================================
   4. 動態背景（極光 + Canvas 粒子 + 可選背景影片/圖片）
   ====================================================================== */
function ParticleField() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let raf = 0, w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
    const N = 70;
    const ps = [];
    const reset = (p, first) => {
      p.x = Math.random() * w;
      p.y = first ? Math.random() * h : h + 20;
      p.r = 0.6 + Math.random() * 2.2;
      p.vy = -(0.12 + Math.random() * 0.45);
      p.vx = (Math.random() - 0.5) * 0.22;
      p.a = 0.15 + Math.random() * 0.5;
      p.hue = [330, 275, 190][Math.floor(Math.random() * 3)];
      p.tw = Math.random() * Math.PI * 2;
    };
    const size = () => {
      w = c.clientWidth; h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size();
    for (let i = 0; i < N; i++) { const p = {}; reset(p, true); ps.push(p); }
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy; p.tw += 0.03;
        if (p.y < -20 || p.x < -20 || p.x > w + 20) reset(p, false);
        const a = p.a * (0.65 + 0.35 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},95%,78%,${a})`;
        ctx.shadowBlur = 12; ctx.shadowColor = `hsla(${p.hue},95%,70%,${a})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    window.addEventListener("resize", size);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 w-full h-full z-[2] pointer-events-none" />;
}

/* 照片牆版位。每一組是左右對稱的一對，所以不管取前幾張，畫面都是平衡的。
   t 是距離畫面頂端的百分比 —— 卡片還會上下浮動 16px，
   所以最上面那一排刻意留了 4% 以上的空隙，不會被螢幕上緣切到。 */
const SLOTS = [
  { l: 1.5, t: 10, w: 17, d: 1.0, r: -5, sm: true },
  { l: 81,  t: 11, w: 17, d: 1.0, r: 5,  sm: true },
  { l: -1,  t: 38, w: 16, d: 1.4, r: 3,  sm: true },
  { l: 84,  t: 40, w: 16, d: 1.4, r: -3, sm: true },
  { l: 0.5, t: 68, w: 19, d: 1.1, r: -3, sm: true },
  { l: 80,  t: 70, w: 19, d: 1.1, r: 4,  sm: true },
  { l: 21,  t: 6,  w: 12, d: 0.7, r: 4 },
  { l: 66,  t: 7,  w: 12, d: 0.7, r: -4 },
  { l: 19,  t: 76, w: 11, d: 0.6, r: 6 },
  { l: 69,  t: 78, w: 11, d: 0.6, r: -6 },
  { l: 35,  t: 4,  w: 10, d: 0.5, r: 2 },
  { l: 54,  t: 4.5,w: 10, d: 0.5, r: -2 },
  { l: 11,  t: 52, w: 11, d: 1.2, r: -6 },
  { l: 78,  t: 54, w: 11, d: 1.2, r: 6 },
  { l: 31,  t: 87, w: 10, d: 0.8, r: 3 },
  { l: 59,  t: 88, w: 10, d: 0.8, r: -3 },
];
const MAX_PHOTOS = SLOTS.length;

function PhotoWall({ photos, count }) {
  const [mouse, setMouse] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      setMouse({
        x: (e.clientX / window.innerWidth - 0.5) * 2,
        y: (e.clientY / window.innerHeight - 0.5) * 2,
      });
    };
    window.addEventListener("pointermove", onMove);
    return () => window.removeEventListener("pointermove", onMove);
  }, []);

  const want = Math.max(0, Math.min(MAX_PHOTOS, count == null ? 12 : count));
  if (!photos || !photos.length || want === 0) return null;
  const list = SLOTS.slice(0, want).map((s, i) => ({ slot: s, src: photos[i % photos.length], i }));

  return (
    <div className="fixed inset-0 z-[3] pointer-events-none overflow-hidden">
      {list.map(({ slot, src, i }) => (
        <div key={i}
          className={cx("pw-slot", !slot.sm && "hidden lg:block")}
          style={{
            left: slot.l + "%", top: slot.t + "%",
            width: "clamp(104px, " + slot.w + "vw, 240px)",
            transform: `translate3d(${(-mouse.x * 14 * slot.d).toFixed(1)}px, ${(-mouse.y * 12 * slot.d).toFixed(1)}px, 0) rotate(${slot.r}deg)`,
            animationDelay: (i * 0.09).toFixed(2) + "s",
          }}>
          <div className="pw-float"
               style={{
                 animationDuration: (7.5 + (i % 5) * 1.1).toFixed(1) + "s",
                 animationDelay: "-" + (i * 0.9).toFixed(1) + "s",
               }}>
            <img className="pw-main" src={assetUrl(src)} alt="" loading="lazy" onError={onImgError} />
          </div>
        </div>
      ))}
      <div className="absolute inset-0"
           style={{ background: "radial-gradient(closest-side at 50% 46%, rgba(7,4,15,.93) 24%, rgba(7,4,15,.46) 52%, rgba(7,4,15,0) 80%)" }} />
    </div>
  );
}

/* ========================================================================
   8. 第三關即時遮蔽
   ====================================================================== */
function maskFilter(mode, level) {
  const b = 0.85 - level * 0.7;
  switch (mode) {
    case "silhouette": return `grayscale(1) contrast(${Math.round(400 + level * 900)}%) brightness(${b.toFixed(2)})`;
    case "shadow": return `blur(${(2 + level * 6).toFixed(1)}px) grayscale(1) contrast(${Math.round(300 + level * 500)}%) brightness(${b.toFixed(2)})`;
    case "dark": return `brightness(${(0.4 - level * 0.32).toFixed(2)}) contrast(${Math.round(200 + level * 300)}%) saturate(.2)`;
    case "mosaic": return `saturate(.35) brightness(${(1.0 - level * 0.45).toFixed(2)}) contrast(140%)`;
    default: return "none";
  }
}

function MaskedVideo({ src, mode, level, playKey }) {
  const videoRef = useRef(null), canvasRef = useRef(null), rafRef = useRef(null);
  const isMosaic = mode === "mosaic";

  useEffect(() => {
    const v = videoRef.current; if (!v) return;
    v.currentTime = 0;
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    return () => { try { v.pause(); } catch (e) {} };
  }, [playKey, src]);

  useEffect(() => {
    if (!isMosaic) { if (rafRef.current) cancelAnimationFrame(rafRef.current); return; }
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !c) return;
    const ctx = c.getContext("2d");
    const draw = () => {
      if (v.videoWidth) {
        const w = Math.max(16, Math.round(120 - level * 88));
        const h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
        if (c.width !== w) { c.width = w; c.height = h; }
        ctx.drawImage(v, 0, 0, w, h);
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [isMosaic, src, playKey, level]);

  return (
    <div className="relative w-full overflow-hidden rounded-2xl bg-black">
      <video ref={videoRef} src={assetUrl(src)} muted loop playsInline
        className={cx("w-full max-h-[52vh] object-contain", isMosaic && "invisible absolute inset-0 pointer-events-none")}
        style={{ filter: isMosaic ? "none" : maskFilter(mode, level) }} />
      {isMosaic && (
        <canvas ref={canvasRef} className="pixelated w-full max-h-[52vh] object-contain"
                style={{ filter: maskFilter("mosaic", level) }} />
      )}
    </div>
  );
}

/* ========================================================================
   9. 出題邏輯：兩段式作答（先選團體 → 再選成員／歌曲）
   ====================================================================== */
/* 名冊 rosters：
     members[團名] = [成員…]  ← 第一關照片、第四關眼睛／嘴巴 通通併進來，
                                所以就算某團在第一關只有 1 張照片，
                                展開時仍然看得到那一團完整的成員清單
     songs[團名]   = [歌名…]  ← 第二關 + 第三關的歌併在一起當候選 */
function buildRosters(pools, l4groups) {
  const mem = {}, song = {};
  const add = (m, g, v) => { if (!g || !v) return; if (!m[g]) m[g] = {}; m[g][v] = 1; };
  pools.level1.forEach(q => add(mem, q.group, q.name));
  pools.level2.forEach(q => add(song, q.group, q.title));
  pools.level3.forEach(q => add(song, q.group, q.title));
  pools.level5.forEach(q => add(song, q.group, q.title));
  (l4groups || []).forEach(g => {
    (g.eyes || []).forEach(n => add(mem, g.name, n));
    (g.mouths || []).forEach(n => add(mem, g.name, n));
  });
  pools.level4.forEach(q => {
    add(mem, q.group, q.eyes && q.eyes.name);
    add(mem, q.group, q.mouth && q.mouth.name);
  });
  const flat = m => { const o = {}; Object.keys(m).forEach(k => { o[k] = Object.keys(m[k]).sort(); }); return o; };
  return { members: flat(mem), songs: flat(song) };
}

// 第一步的團體選項：正解團體 + (n-1) 個其他團體，洗牌
function buildGroupChoices(correct, all, n) {
  const others = shuffle(all.filter(g => g && g !== correct)).slice(0, Math.max(1, n - 1));
  return shuffle([correct].concat(others));
}

/* 出題當下就把兩段式的選項全部算好放進 q.__two，
   之後不管重繪幾次、回上一題再回來，選項都不會變 */
function attachTwo(q, cfg, rosters, l4groups) {
  const n = Math.max(2, cfg.optionCount || 4);

  if (q.__level === "level1") {
    const groups = buildGroupChoices(q.group, Object.keys(rosters.members), n);
    const items = {};
    groups.forEach(g => { items[g] = shuffle((rosters.members[g] || []).slice()); });
    if (!items[q.group]) items[q.group] = [];
    if (items[q.group].indexOf(q.name) < 0) items[q.group] = shuffle(items[q.group].concat([q.name]));
    return { ...q, __two: { kind: "member", step2: "選成員", groups, items,
                            correctGroup: q.group, correctItem: q.name } };
  }

  if (q.__level === "level2" || q.__level === "level3" || q.__level === "level5") {
    const groups = buildGroupChoices(q.group, Object.keys(rosters.songs), n);
    const items = {};
    groups.forEach(g => {
      const all = (rosters.songs[g] || []).slice();
      // 正解團體：一定要含正解，其餘隨機補到 4 首
      // 其他團體：就顯示那一團的歌（裡面自然沒有正解）
      const list = (g === q.group)
        ? uniq([q.title].concat(shuffle(all.filter(t => t !== q.title)))).slice(0, 4)
        : shuffle(all).slice(0, 4);
      items[g] = shuffle(list);
    });
    return { ...q, __two: { kind: "song", step2: "選歌曲", groups, items,
                            correctGroup: q.group, correctItem: q.title } };
  }

  if (q.__level === "level4") {
    const names = (l4groups || []).map(g => g.name);
    const groups = buildGroupChoices(q.group, names, n);
    const items = {};
    groups.forEach(g => {
      const rec = (l4groups || []).filter(x => x.name === g)[0] || {};
      items[g] = shuffle(uniq([].concat(rec.eyes || [], rec.mouths || [])));
    });
    const eN = q.eyes ? q.eyes.name : "", mN = q.mouth ? q.mouth.name : "";
    let own = items[q.group] || [];
    if (own.indexOf(eN) < 0) own = own.concat([eN]);
    if (own.indexOf(mN) < 0) own = own.concat([mN]);
    items[q.group] = shuffle(uniq(own));
    return { ...q, __two: { kind: "face", step2: "拖成員", groups, items,
                            correctGroup: q.group, correctEyes: eN, correctMouth: mN } };
  }
  return q;
}

// 沒有 groups 名冊的舊題庫 → 從題目本身推回來，維持相容
function deriveL4Groups(qs) {
  const m = {}, order = [];
  qs.forEach(q => {
    const g = q.group || (q.eyes && q.eyes.group) || (q.mouth && q.mouth.group) || "";
    if (!g) return;
    if (!m[g]) { m[g] = { name: g, lightstick: lsOf(q), eyes: [], mouths: [] }; order.push(g); }
    if (q.eyes && q.eyes.name && m[g].eyes.indexOf(q.eyes.name) < 0) m[g].eyes.push(q.eyes.name);
    if (q.mouth && q.mouth.name && m[g].mouths.indexOf(q.mouth.name) < 0) m[g].mouths.push(q.mouth.name);
  });
  return order.map(k => m[k]);
}
// 手燈欄位新舊格式都吃：字串路徑，或 { image: "..." }
function lsOf(q) {
  const v = q && q.lightstick;
  if (!v) return "";
  return typeof v === "string" ? v : (v.image || "");
}

function StepBadge({ n, text, done }) {

        done ? "bg-emerald-500 text-white" : "bg-pink-500 text-white")}>{done ? "✓" : n}</span>
      <span className="text-sm font-bold text-slate-200">{text}</span>
    </div>

}

function GroupGrid({ groups, correctGroup, revealed, badGroups, onPick }) {
  return (
    <div className={cx("w-full mx-auto grid gap-2 sm:gap-2.5 grid-cols-2 sm:grid-cols-3",
                       groups.length > 6 ? "max-w-4xl lg:grid-cols-4" : "max-w-3xl")}>
      {groups.map((g, i) => {
        const bad = badGroups.indexOf(g) >= 0;
        const isCorrect = g === correctGroup;
        let cls = "bg-white/[.07] border-white/15 hover:bg-white/[.16] text-slate-100";
        if (revealed && isCorrect) cls = "bg-emerald-500/25 border-emerald-400/70 text-emerald-100 glow-ok";
        else if (revealed) cls = "bg-white/[.03] border-white/10 text-slate-500";
        else if (bad) cls = "bg-rose-900/30 border-rose-500/40 text-rose-300/60 line-through";
        return (
          <button key={i} disabled={revealed || bad} onClick={() => onPick(g)}
            className={cx("px-2.5 py-3 rounded-2xl border font-bold text-center text-sm sm:text-base leading-tight transition-all active:scale-[.97] disabled:cursor-default break-words", cls)}>
            {g}
            {revealed && isCorrect && " ✅"}
            {!revealed && bad && " ❌"}
          </button>
        );
      })}
    </div>
  );
}

/* 已選團體列。mark = true/false/null：
   多人模式送出過一次之後，這裡會直接告訴你團體選對了沒，
   但畫面不會被重設，玩家想留在原本的清單裡繼續換答案都可以。 */
function SelectedGroupBar({ group, onBack, locked, tone, mark }) {
  const auto = mark === true ? "bg-emerald-500/20 border-emerald-400/50 text-emerald-100"
             : mark === false ? "bg-rose-600/20 border-rose-400/50 text-rose-100"
             : "bg-amber-500/20 border-amber-400/40 text-amber-100";
  return (
    <div className="w-full max-w-3xl mx-auto flex items-center gap-2 mb-4 flex-wrap">
      <span className={cx("px-4 py-2 rounded-2xl font-black border", tone || auto)}>
        🏷️ {group}{mark === true ? " ✅" : mark === false ? " ❌" : ""}
      </span>
      {!locked && (
        <button onClick={onBack}
          className={cx("px-3 py-2 rounded-xl border text-xs transition",
            mark === false ? "bg-pink-500/25 border-pink-400/50 text-pink-100 hover:bg-pink-500/40 font-bold"
                           : "bg-white/10 hover:bg-white/20 border-white/15 text-slate-300")}>
          ↩ 重選團體
        </button>
      )}
    </div>
  );
}

function TwoStage({ two, st, revealed, onSelectGroup, onBackGroup, onPickItem }) {
  if (!two) return null;
  const sel = st.sel || null;
  const badGroups = st.badGroups || [];
  const badItems = st.badItems || [];
  const items = sel ? (two.items[sel] || []) : [];

  // 第一步：選團體
  if (!sel) {
    return (
      <div className="w-full">
        <StepBadge n="1" text="第一步：選團體" />
        <GroupGrid groups={two.groups} correctGroup={two.correctGroup}
                   revealed={revealed} badGroups={badGroups} onPick={onSelectGroup} />
        {st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
      </div>
    );
  }

  // 第二步：選成員 / 選歌曲
  const label = two.kind === "song" ? "第二步：選歌曲" : "第二步：選成員";
  return (
    <div className="w-full">
      <StepBadge n="2" text={label} done={false} />
      <SelectedGroupBar group={sel} onBack={onBackGroup} locked={revealed}
        mark={revealed ? (sel === two.correctGroup) : (st.groupMark == null ? null : st.groupMark)} />
      {items.length === 0 && <p className="text-center text-slate-500 text-sm">（題庫裡這一團還沒有可選的項目）</p>}
      <div className="w-full max-w-3xl mx-auto grid gap-2.5 sm:grid-cols-2">
        {items.map((label2, i) => {
          const isCorrect = sel === two.correctGroup && label2 === two.correctItem;
          const isPicked = label2 === st.picked;
          const bad = badItems.indexOf(label2) >= 0;
          let cls = "bg-white/[.07] border-white/15 hover:bg-white/[.16] text-slate-100";
          if (revealed && isCorrect) cls = "bg-emerald-500/25 border-emerald-400/70 text-emerald-100 glow-ok";
          else if (revealed && isPicked) cls = "bg-rose-600/25 border-rose-400/70 text-rose-100 glow-bad";
          else if (revealed) cls = "bg-white/[.03] border-white/10 text-slate-500";
          else if (bad) cls = "bg-rose-900/30 border-rose-500/40 text-rose-300/60 line-through";
          return (
            <button key={i} disabled={revealed || bad} onClick={() => onPickItem(label2)}
              className={cx("text-left px-4 py-3.5 rounded-2xl border font-semibold transition-all active:scale-[.98] disabled:cursor-default", cls)}>
              <span className="inline-grid place-items-center w-6 h-6 mr-2.5 rounded-lg bg-black/40 text-xs font-black text-slate-300">
                {"ABCDEFGHIJKL"[i] || (i + 1)}
              </span>
              {label2}
              {revealed && isCorrect && <span className="float-right">✅</span>}
              {revealed && isPicked && !isCorrect && <span className="float-right">❌</span>}
              {!revealed && bad && <span className="float-right">❌</span>}
            </button>
          );
        })}
      </div>
      {st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
    </div>
  );
}

/* ========================================================================
   11. 第一～三關題目畫面
   ====================================================================== */
function Level1Stage({ q, revealed, flashSec }) {
  const [visible, setVisible] = useState(false);
  const [countdown, setCountdown] = useState(0);
  const timerRef = useRef(null);
  useEffect(() => { setVisible(false); setCountdown(0); return () => clearTimeout(timerRef.current); }, [q.id]);

  const flash = () => {
    setCountdown(3); let n = 3;
    const iv = setInterval(() => {
      n -= 1; setCountdown(n); SFX.tick();
      if (n <= 0) { clearInterval(iv); setVisible(true); timerRef.current = setTimeout(() => setVisible(false), flashSec * 1000); }
    }, 700);
  };

  return (
    <div className="flex flex-col items-center gap-4">
      {/* 照片容器：固定高度 + flex 置中，圖片只給最大寬高、寬高都 auto，
          所以永遠是原圖比例完整顯示，絕對不會被裁切 */}
      <div className="relative w-full max-w-lg h-[34vh] sm:h-[42vh] rounded-3xl overflow-hidden bg-black/60 border border-white/10 flex items-center justify-center p-2">
        {(revealed || visible)
          ? <img src={assetUrl(q.image)} alt=""
                 className="max-w-full max-h-full w-auto h-auto object-contain rounded-2xl pop"
                 onError={onImgError} />
          : (<div className="text-center px-6">
              {countdown > 0
                ? <div className="text-8xl font-black text-pink-400 pop">{countdown}</div>
                : (<><div className="text-7xl mb-3">🫥</div>
                     <div className="text-slate-400 text-sm">照片只會出現 {flashSec.toFixed(1)} 秒</div></>)}
            </div>)}
      </div>
      {!revealed && (
        <Btn tone="cyan" onClick={flash} disabled={countdown > 0 || visible}>
          {visible ? "看！" : countdown > 0 ? "準備…" : "閃現照片 ⚡"}
        </Btn>
      )}
      {revealed && (
        <div className="text-center pop">
          <div className="text-sm text-cyan-300 font-semibold">{q.group}</div>
          <div className="text-4xl font-black text-white mt-1">{q.name}</div>
        </div>
      )}
    </div>
  );
}

function Level2Stage({ q, revealed, duck, unduck }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [started, setStarted] = useState(false);   // 播過一次之後「播放前奏」就消失
  const duckedRef = useRef(false);
  const doDuck = () => { if (!duckedRef.current) { duckedRef.current = true; duck(); } };
  const doUnduck = () => { if (duckedRef.current) { duckedRef.current = false; unduck(); } };

  useEffect(() => () => doUnduck(), []);
  useEffect(() => { doUnduck(); setPlaying(false); setStarted(false); }, [q.id]);

  const clipSrc = q.clip || q.answer;
  const clipLimit = q.clip ? null : (q.introSeconds || 12);

  const play = () => {
    const a = audioRef.current; if (!a) return;
    doDuck(); setStarted(true);
    a.currentTime = 0;
    a.play().then(() => setPlaying(true)).catch(() => {});
  };

  useEffect(() => {
    const a = audioRef.current; if (!a || !clipLimit) return;
    const onT = () => { if (a.currentTime >= clipLimit) { a.pause(); setPlaying(false); doUnduck(); } };
    a.addEventListener("timeupdate", onT);
    return () => a.removeEventListener("timeupdate", onT);
  }, [clipLimit, q.id]);

  useEffect(() => {
    if (revealed) { const a = audioRef.current; if (a) a.pause(); setPlaying(false); doDuck(); }
  }, [revealed]);

  return (
    <div className="flex flex-col items-center gap-5 w-full">
      <audio ref={audioRef} src={assetUrl(clipSrc)} preload="auto" className="hidden"
             onEnded={() => { setPlaying(false); doUnduck(); }} />
      {!revealed ? (
        <>
          <div className={cx("w-32 h-32 sm:w-40 sm:h-40 rounded-full grid place-items-center border-4 transition-all duration-300",
            playing ? "border-fuchsia-400 bg-fuchsia-500/20 scale-110 shadow-2xl shadow-fuchsia-500/40" : "border-white/15 bg-white/5")}>
            <span className="text-5xl sm:text-6xl">{playing ? "🔊" : "🎧"}</span>
          </div>
          <div className="h-14 flex items-center">
            {!started
              ? <Btn tone="cyan" size="lg" onClick={play}>▶ 播放前奏</Btn>
              : <Btn tone="ghost" onClick={play} className="pop">🔂 再聽一次</Btn>}
          </div>
          {clipLimit && <p className="text-xs text-slate-500 -mt-3">（無獨立前奏檔，自動播放答案影片前 {clipLimit} 秒的音訊）</p>}
        </>
      ) : (
        <div className="w-full flex flex-col items-center gap-4 pop">
          {q.answer
            ? <video src={assetUrl(q.answer)} controls autoPlay className="w-full max-h-[52vh] rounded-2xl bg-black"
                     onPlay={doDuck} onPause={doUnduck} onEnded={doUnduck} />
            : <div className="w-full max-w-lg h-40 rounded-2xl bg-black/50 border border-white/10 grid place-items-center text-slate-500 text-sm">（這首沒有答案影片）</div>}
          <div className="text-center">
            <div className="text-sm text-fuchsia-300 font-semibold">{q.group}</div>
            <div className="text-3xl sm:text-4xl font-black text-white mt-1">{q.title}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function Level3Stage({ q, revealed, maskMode, maskLevel, duck, unduck }) {
  const [replayKey, setReplayKey] = useState(0);
  const duckedRef = useRef(false);
  const doDuck = () => { if (!duckedRef.current) { duckedRef.current = true; duck(); } };
  const doUnduck = () => { if (duckedRef.current) { duckedRef.current = false; unduck(); } };
  useEffect(() => () => doUnduck(), []);

  return (

          <div className="flex gap-3 flex-wrap justify-center items-center">

            <Pill className="bg-indigo-500/20 text-indigo-200 border border-indigo-400/30">
              {hasPrebuilt ? "已使用預先處理的剪影影片" : "前端即時遮蔽：" + ((MASK_MODES.filter(m => m.id === mode)[0] || {}).label || "")}
            </Pill>

        <div className="w-full flex flex-col items-center gap-4 pop">
          <video src={assetUrl(q.answer || q.question)} controls autoPlay className="w-full max-h-[52vh] rounded-2xl bg-black"
                 onPlay={doDuck} onPause={doUnduck} onEnded={doUnduck} />
          <div className="text-center">
            <div className="text-sm text-indigo-300 font-semibold">{q.group}</div>
            <div className="text-3xl sm:text-4xl font-black text-white mt-1">{q.title}</div>
          </div>
