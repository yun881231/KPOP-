                          format={v => config.sfx ? Math.round(v * 100) + "%" : "已關閉"} />

                  <div className="flex flex-col justify-end gap-3">
                    <Toggle label="答對／答錯音效" checked={config.sfx}
                            onChange={v => { set({ sfx: v }); SFX.setEnabled(v); }} />
                    <Toggle label="打亂關卡順序" checked={config.mixLevels}
                            onChange={v => set({ mixLevels: v })} />
                  </div>
                </div>
                <p className="mt-5 text-xs text-slate-500">
                  💡 進入挑戰時背景音樂會自動停止，避免和題目音訊打架；需要的話可在遊戲中用右上角按鈕手動開啟。<br />
                  🎵 背景音樂的<b className="text-slate-400">音量與換曲</b>、封面<b className="text-slate-400">背景卡片數量</b>，
                  都在右上角的 <b className="text-slate-400">⚙️ 設定</b>（單人／多人共用一份）。
                </p>
              </Card>
            )}
          </div>
        </div>

        {/* 底部：開始挑戰 */}
        <div className="ui-bar bottom sticky bottom-0 z-20">
          <div className="mx-auto max-w-5xl px-4 sm:px-8 py-3 sm:py-4 flex items-center gap-4 justify-between">
            <div className="text-sm text-slate-300 min-w-0">
              本場共 <b key={planned} className="text-2xl text-white mx-1 inline-block pop">{planned}</b> 題
              <span className="ml-1 text-slate-400 hidden sm:inline">
                · {mode === "single" ? "單人挑戰" : config.teams.length + " 隊競賽"}
              </span>
            </div>
            <Btn size="lg" disabled={planned === 0} onClick={onStart} className={cx("shrink-0", planned > 0 && "cta-ring")}>開始挑戰 🚀</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================================
   8. 第三關即時遮蔽
   ====================================================================== */
function maskFilter(mode, level) {
  const b = 0.85 - level * 0.7;
  switch (mode) {
    case "silhouette": return `grayscale(1) contrast(${Math.round(400 + level * 900)}%) brightness(${b.toFixed(2)})`;
    case "shadow": return `blur(${(2 + level * 6).toFixed(1)}px) grayscale(1) contrast(${Math.round(300 + level * 500)}%) brightness(${b.toFixed(2)})`;
    case "dark": return `brightness(${(0.4 - level * 0.32).toFixed(2)}) contrast(${Math.round(200 + level * 300)}%) saturate(.2)`;
    case "mosaic": return `saturate(.35) brightness(${(1.0 - level * 0.45).toFixed(2)}) contrast(140%)`;
    default: return "none";
  }
}

function MaskedVideo({ src, mode, level, playKey, fill }) {
  const videoRef = useRef(null), canvasRef = useRef(null), rafRef = useRef(null);
  const isMosaic = mode === "mosaic";

  useEffect(() => {
    const v = videoRef.current; if (!v) return;
    v.currentTime = 0;
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    return () => { try { v.pause(); } catch (e) {} };
  }, [playKey, src]);

  useEffect(() => {
    if (!isMosaic) { if (rafRef.current) cancelAnimationFrame(rafRef.current); return; }
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !c) return;
    const ctx = c.getContext("2d");
    const draw = () => {
      if (v.videoWidth) {
        const w = Math.max(16, Math.round(120 - level * 88));
        const h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
        if (c.width !== w) { c.width = w; c.height = h; }
        ctx.drawImage(v, 0, 0, w, h);
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [isMosaic, src, playKey, level]);

  // fill：直接鋪滿外層的 .lv-frame（單螢幕版面用），影片完整顯示不裁切
  if (fill) {
    return (
      <>
        <video ref={videoRef} src={assetUrl(src)} muted loop playsInline
          className={cx("lv-fill", isMosaic && "invisible pointer-events-none")}
          style={{ filter: isMosaic ? "none" : maskFilter(mode, level) }} />
        {isMosaic && (
          <canvas ref={canvasRef} className="lv-fill pixelated" style={{ filter: maskFilter("mosaic", level) }} />
        )}
      </>
    );
  }

  return (
    <div className="relative w-full overflow-hidden rounded-2xl bg-black">
      <video ref={videoRef} src={assetUrl(src)} muted loop playsInline
        className={cx("w-full max-h-[52vh] object-contain", isMosaic && "invisible absolute inset-0 pointer-events-none")}
        style={{ filter: isMosaic ? "none" : maskFilter(mode, level) }} />
      {isMosaic && (
        <canvas ref={canvasRef} className="pixelated w-full max-h-[52vh] object-contain"
                style={{ filter: maskFilter("mosaic", level) }} />
      )}
    </div>
  );
}

/* ========================================================================
   9. 出題邏輯：兩段式作答（先選團體 → 再選成員／歌曲）
   ====================================================================== */
/* 名冊 rosters：
     members[團名] = [成員…]  ← 第一關照片、第四關眼睛／嘴巴 通通併進來，
                                所以就算某團在第一關只有 1 張照片，
                                展開時仍然看得到那一團完整的成員清單
     songs[團名]   = [歌名…]  ← 第二關 + 第三關的歌併在一起當候選 */
function buildRosters(pools, l4groups) {
  const mem = {}, song = {};
  const add = (m, g, v) => { if (!g || !v) return; if (!m[g]) m[g] = {}; m[g][v] = 1; };
  pools.level1.forEach(q => add(mem, q.group, q.name));
  pools.level2.forEach(q => add(song, q.group, q.title));
  pools.level3.forEach(q => add(song, q.group, q.title));
  pools.level5.forEach(q => add(song, q.group, q.title));
  (l4groups || []).forEach(g => {
    (g.eyes || []).forEach(n => add(mem, g.name, n));
    (g.mouths || []).forEach(n => add(mem, g.name, n));
  });
  pools.level4.forEach(q => {
    add(mem, q.group, q.eyes && q.eyes.name);
    add(mem, q.group, q.mouth && q.mouth.name);
  });
  const flat = m => { const o = {}; Object.keys(m).forEach(k => { o[k] = Object.keys(m[k]).sort(); }); return o; };
  return { members: flat(mem), songs: flat(song) };
}

// 第一步的團體選項：正解團體 + (n-1) 個其他團體，洗牌
function buildGroupChoices(correct, all, n) {
  const others = shuffle(all.filter(g => g && g !== correct)).slice(0, Math.max(1, n - 1));
  return shuffle([correct].concat(others));
}

/* 出題當下就把兩段式的選項全部算好放進 q.__two，
   之後不管重繪幾次、回上一題再回來，選項都不會變 */
function attachTwo(q, cfg, rosters, l4groups) {
  const n = Math.max(2, cfg.optionCount || 4);

  if (q.__level === "level1") {
    const groups = buildGroupChoices(q.group, Object.keys(rosters.members), n);
    const items = {};
    groups.forEach(g => { items[g] = shuffle((rosters.members[g] || []).slice()); });
    if (!items[q.group]) items[q.group] = [];
    if (items[q.group].indexOf(q.name) < 0) items[q.group] = shuffle(items[q.group].concat([q.name]));
    return { ...q, __two: { kind: "member", step2: "選成員", groups, items,
                            correctGroup: q.group, correctItem: q.name } };
  }

  if (q.__level === "level2" || q.__level === "level3" || q.__level === "level5") {
    const groups = buildGroupChoices(q.group, Object.keys(rosters.songs), n);
    const items = {};
    groups.forEach(g => {
      const all = (rosters.songs[g] || []).slice();
      // 正解團體：一定要含正解，其餘隨機補到 4 首
      // 其他團體：就顯示那一團的歌（裡面自然沒有正解）
      const list = (g === q.group)
        ? uniq([q.title].concat(shuffle(all.filter(t => t !== q.title)))).slice(0, 4)
        : shuffle(all).slice(0, 4);
      items[g] = shuffle(list);
    });
    return { ...q, __two: { kind: "song", step2: "選歌曲", groups, items,
                            correctGroup: q.group, correctItem: q.title } };
  }

  if (q.__level === "level4") {
    const names = (l4groups || []).map(g => g.name);
    const groups = buildGroupChoices(q.group, names, n);
    const items = {};
    groups.forEach(g => {
      const rec = (l4groups || []).filter(x => x.name === g)[0] || {};
      items[g] = shuffle(uniq([].concat(rec.eyes || [], rec.mouths || [])));
    });
    const eN = q.eyes ? q.eyes.name : "", mN = q.mouth ? q.mouth.name : "";
    let own = items[q.group] || [];
    if (own.indexOf(eN) < 0) own = own.concat([eN]);
    if (own.indexOf(mN) < 0) own = own.concat([mN]);
    items[q.group] = shuffle(uniq(own));
    return { ...q, __two: { kind: "face", step2: "拖成員", groups, items,
                            correctGroup: q.group, correctEyes: eN, correctMouth: mN } };
  }
  return q;
}

// 沒有 groups 名冊的舊題庫 → 從題目本身推回來，維持相容
function deriveL4Groups(qs) {
  const m = {}, order = [];
  qs.forEach(q => {
    const g = q.group || (q.eyes && q.eyes.group) || (q.mouth && q.mouth.group) || "";
    if (!g) return;
    if (!m[g]) { m[g] = { name: g, lightstick: lsOf(q), eyes: [], mouths: [] }; order.push(g); }
    if (q.eyes && q.eyes.name && m[g].eyes.indexOf(q.eyes.name) < 0) m[g].eyes.push(q.eyes.name);
    if (q.mouth && q.mouth.name && m[g].mouths.indexOf(q.mouth.name) < 0) m[g].mouths.push(q.mouth.name);
  });
  return order.map(k => m[k]);
}
// 手燈欄位新舊格式都吃：字串路徑，或 { image: "..." }
function lsOf(q) {
  const v = q && q.lightstick;
  if (!v) return "";
  return typeof v === "string" ? v : (v.image || "");
}

/* ========================================================================
   10. 兩段式作答元件（第一～三關共用）
   ====================================================================== */
function StepBadge({ n, text, done, compact }) {
  return (
    <div className={cx("flex items-center gap-2", compact ? "shrink-0" : "mb-2.5")}>
      <span className={cx("inline-grid place-items-center rounded-full font-black shrink-0",
        compact ? "w-5 h-5 text-[10px]" : "w-6 h-6 text-[11px]",
        done ? "bg-emerald-500 text-white" : "bg-pink-500 text-white")}>{done ? "✓" : n}</span>
      <span className={cx("font-bold text-slate-200", compact ? "lv-step-txt text-xs sm:text-sm" : "text-sm")}>{text}</span>
    </div>
  );
}

function GroupGrid({ groups, correctGroup, revealed, badGroups, onPick, compact }) {
  return (
    <div className={compact
                      ? cx("w-full lv-ggrid", groups.length > 12 && "many")

      {groups.map((g, i) => {

            {g}

/* 已選團體列。mark = true/false/null：
   多人模式送出過一次之後，這裡會直接告訴你團體選對了沒，
   但畫面不會被重設，玩家想留在原本的清單裡繼續換答案都可以。 */
function SelectedGroupBar({ group, onBack, locked, tone, mark, compact }) {
  const auto = mark === true ? "bg-emerald-500/20 border-emerald-400/50 text-emerald-100"
             : mark === false ? "bg-rose-600/20 border-rose-400/50 text-rose-100"

    <div className={cx("flex items-center gap-2", compact ? "shrink-0" : "w-full flex-wrap max-w-3xl mx-auto mb-4")}>
      <span className={cx("font-black border", compact ? "lv-selgrp px-3 py-1 rounded-xl text-sm" : "px-4 py-2 rounded-2xl", tone || auto)}>
        🏷️ {group}{mark === true ? " ✅" : mark === false ? " ❌" : ""}
      </span>
      {!locked && (
        <button onClick={onBack}
          className={cx("rounded-xl border text-xs transition", compact ? "px-2.5 py-1" : "px-3 py-2",
            mark === false ? "bg-pink-500/25 border-pink-400/50 text-pink-100 hover:bg-pink-500/40 font-bold"
                           : "bg-white/10 hover:bg-white/20 border-white/15 text-slate-300")}>
          ↩ 重選<span className={compact ? "lv-hide-short" : ""}>團體</span>
        </button>
      )}
    </div>
  );
}

/* compact = 第五關單螢幕版：步驟、已選團體、提示、嘗試次數（extra）壓成同一行 */
function TwoStage({ two, st, revealed, onSelectGroup, onBackGroup, onPickItem, compact, extra }) {
  if (!two) return null;
  const sel = st.sel || null;
  const badGroups = st.badGroups || [];
  const badItems = st.badItems || [];
  const items = sel ? (two.items[sel] || []) : [];

  // 第一步：選團體
  if (!sel) {
    if (compact) {
      return (
        <div className="w-full">
          <div className="lv-ahead">
            <StepBadge n="1" text="第一步：選團體" compact />
            {st.hint && <span className="lv-ahint pop" title={st.hint}>{st.hint}</span>}
            {extra}
          </div>
          <GroupGrid groups={two.groups} correctGroup={two.correctGroup} compact
                     revealed={revealed} badGroups={badGroups} onPick={onSelectGroup} />
        </div>
      );
    }
    return (
      <div className="w-full">
        <StepBadge n="1" text="第一步：選團體" />
        <GroupGrid groups={two.groups} correctGroup={two.correctGroup}
                   revealed={revealed} badGroups={badGroups} onPick={onSelectGroup} />
        {st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
      </div>
    );
  }

  // 第二步：選成員 / 選歌曲
  const label = two.kind === "song" ? "第二步：選歌曲" : "第二步：選成員";
  const mark = revealed ? (sel === two.correctGroup) : (st.groupMark == null ? null : st.groupMark);
  return (
    <div className="w-full">
      {compact ? (
        <div className="lv-ahead">
          <StepBadge n="2" text={two.kind === "song" ? "選歌曲" : "選成員"} compact />
          <SelectedGroupBar group={sel} onBack={onBackGroup} locked={revealed} compact mark={mark} />
          {st.hint && <span className="lv-ahint pop" title={st.hint}>{st.hint}</span>}
          {extra}
        </div>
      ) : (
        <>
          <StepBadge n="2" text={label} done={false} />
          <SelectedGroupBar group={sel} onBack={onBackGroup} locked={revealed} mark={mark} />
        </>
      )}
      {items.length === 0 && <p className="text-center text-slate-500 text-sm">（題庫裡這一團還沒有可選的項目）</p>}
      <div className={compact ? cx("w-full lv-igrid", items.length > 8 && "many", items.length > 15 && "lots")
                              : "w-full max-w-3xl mx-auto grid gap-2.5 sm:grid-cols-2"}>
        {items.map((label2, i) => {
          const isCorrect = sel === two.correctGroup && label2 === two.correctItem;
          const isPicked = label2 === st.picked;
          const bad = badItems.indexOf(label2) >= 0;
          let cls = "bg-white/[.07] border-white/15 hover:bg-white/[.16] text-slate-100";
          if (revealed && isCorrect) cls = "bg-emerald-500/25 border-emerald-400/70 text-emerald-100 glow-ok";
          else if (revealed && isPicked) cls = "bg-rose-600/25 border-rose-400/70 text-rose-100 glow-bad";
          else if (revealed) cls = "bg-white/[.03] border-white/10 text-slate-500";
          else if (bad) cls = "bg-rose-900/30 border-rose-500/40 text-rose-300/60 line-through";
          return (
            <button key={i} disabled={revealed || bad} onClick={() => onPickItem(label2)}
              className={cx("text-left border font-semibold transition-all active:scale-[.98] disabled:cursor-default",
                            compact ? "lv-ibtn" : "px-4 py-3.5 rounded-2xl", cls)}>
              <span className={cx("lv-ikey inline-grid place-items-center rounded-lg bg-black/40 font-black text-slate-300",
                                  compact ? "w-5 h-5 mr-2 text-[10px]" : "w-6 h-6 mr-2.5 text-xs")}>
                {"ABCDEFGHIJKL"[i] || (i + 1)}
              </span>
              {label2}
              {revealed && isCorrect && <span className="float-right">✅</span>}
              {revealed && isPicked && !isCorrect && <span className="float-right">❌</span>}
              {!revealed && bad && <span className="float-right">❌</span>}
            </button>
          );
        })}
      </div>
      {!compact && st.hint && <p className="text-center text-sm text-rose-300 mt-3 pop">{st.hint}</p>}
    </div>
  );
}

/* ========================================================================
   11. 關卡共用：單螢幕版面、送出 → 公布答案的轉場、答案卡
   ------------------------------------------------------------------------
   每一關都是同一套骨架：
     作答中   .lv-root ─┬─ .lv-qcard（出題卡：照片／唱片／影片／截圖…）
                        └─ .lv-answer（作答區：兩段式）
     公布答案 .lv-root ── .lv-media（尺寸容器）── .lv-comp（剛好包住內容的答案卡）
   轉場（useRevealFlow）：
     送出 → 作答區與出題卡的毛玻璃底淡出（約 0.44 秒）→ 切換成答案卡；
     兩邊都有 data-flip="xxx" 的元素會從「原本的位置」平滑飛到「新位置」（FLIP 動畫）。
   ====================================================================== */
function prefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { return false; }
}

function useRevealFlow(revealed) {
  const reduce = useMemo(prefersReducedMotion, []);
  const rootRef = useRef(null);
  const [phase, setPhase] = useState(revealed ? "reveal" : "question");
  const [flip, setFlip] = useState(false);
  const fromRef = useRef(null);
  const timerRef = useRef(null);
  const wasRef = useRef(revealed);

  const measure = () => {
    const root = rootRef.current; if (!root) return null;
    const out = {}; let n = 0;
    root.querySelectorAll("[data-flip]").forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width && r.height) { out[el.getAttribute("data-flip")] = r; n++; }
    });
    return n ? out : null;
  };

  useEffect(() => {
    if (revealed && !wasRef.current) {
      clearTimeout(timerRef.current);
      if (reduce) { setFlip(false); setPhase("reveal"); }
      else {
        setPhase("out");
        timerRef.current = setTimeout(() => {
          fromRef.current = measure();
          setFlip(!!fromRef.current);
          setPhase("reveal");
        }, 440);
      }
    } else if (!revealed && wasRef.current) {
      clearTimeout(timerRef.current); setFlip(false); setPhase("question");
    }
    wasRef.current = revealed;
  }, [revealed]);
  useEffect(() => () => clearTimeout(timerRef.current), []);

  // FLIP：元素從「作答時的位置與大小」平滑移動到「答案卡裡的新位置」
  useLayoutEffect(() => {
    if (phase !== "reveal") return;
    const from = fromRef.current; fromRef.current = null;
    const root = rootRef.current;
    if (!from || !root) return;
    let k = 0;
    root.querySelectorAll("[data-flip]").forEach(el => {
      const a = from[el.getAttribute("data-flip")];
      if (!a || !el.animate) return;
      const b = el.getBoundingClientRect();
      if (!b.width || !b.height) return;
      el.animate([
        { transformOrigin: "0 0", transform: "translate(" + (a.left - b.left) + "px," + (a.top - b.top) + "px) scale(" + (a.width / b.width) + "," + (a.height / b.height) + ")" },
        { transformOrigin: "0 0", transform: "none" },
      ], { duration: 720, delay: (k++) * 45, easing: "cubic-bezier(.22,.9,.24,1)", fill: "backwards" });
    });
  }, [phase]);

  return { rootRef, phase, flip, reduce, animate: !reduce, leaving: phase === "out", reveal: phase === "reveal" };
}

// BGM 壓低／恢復：只呼叫一次、卸載時一定恢復
function useDuck(duck, unduck) {
  const fns = useRef({ duck, unduck });
  fns.current = { duck, unduck };
  const on = useRef(false);
  const api = useMemo(() => ({
    duck: () => { if (!on.current) { on.current = true; fns.current.duck(); } },
    unduck: () => { if (on.current) { on.current = false; fns.current.unduck(); } },
  }), []);
  useEffect(() => () => api.unduck(), []);
  return api;
}

// 讀出圖片原始長寬比（照片框就照原比例畫，完全不留黑邊、也不裁切）
function useImgAspect(src, fallback) {
  const [ar, setAr] = useState(fallback);
  useEffect(() => {
    if (!src) return;
    let alive = true;
    const im = new Image();
    im.onload = () => { if (alive && im.naturalWidth && im.naturalHeight) setAr(Math.max(.35, Math.min(2.5, im.naturalWidth / im.naturalHeight))); };
    im.src = assetUrl(src);
    return () => { alive = false; };
  }, [src]);
  return ar;
}

// 判定文字：答對 / 答錯（＋你選了什麼）/ 放棄或主持人公布
function verdictOf(st, single, wrongSub) {
  if (st.ok === true) return { tone: "ok", verdict: "✅ 答對了！", sub: (!single && st.attempts) ? "第 " + (st.attempts + 1) + " 次答對" : null };
  if (st.ok === false) return { tone: "bad", verdict: "❌ 答錯了",
    sub: wrongSub !== undefined ? wrongSub : ("你選：" + (st.sel || "—") + (st.picked ? " · " + st.picked : "")) };
  return { tone: "info", verdict: single ? "🏳️ 放棄作答 · 公布答案" : "📢 主持人公布答案", sub: null };
}

function RevealTitle({ group, title, v, stat, statTitle, animate, vertical }) {
  return (
    <header className={cx("lv-title", vertical && "vert", animate && "lv-rise-1")}>
      <div className="lv-title-main">
        <div className="lv-group">{group}</div>
        <div className="lv-song" title={title}>{title}</div>
      </div>
      <div className="lv-badges">
        <span className={cx("lv-verdict", v.tone)}>{v.verdict}</span>
        {v.sub && <span className="lv-chip" title={v.sub}>{v.sub}</span>}
        {stat && <span className="lv-chip lv-chip-stat" title={statTitle || ""}>{stat}</span>}

}

function QHead({ kicker, children }) {
  return (
    <div className="lv-qhead lv-fadeable">
      <span className="lv-kicker">{kicker}</span>
      {children}
    </div>
  );
}

function AnswerPanel({ children }) {
  if (!children) return null;
  return <section className="lv-glass lv-answer lv-fadeable">{children}</section>;
}

const onKeyActivate = (fn) => (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };

/* 放大檢視（Esc 關閉、← → 切換）。用 portal 掛在 body，
   避免被毛玻璃（backdrop-filter）或動畫中的父層影響 fixed 定位。 */
function Lightbox({ items, pos, onClose, onMove }) {
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      else if (e.key === "ArrowRight") onMove(1);
      else if (e.key === "ArrowLeft") onMove(-1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose, onMove]);
  const cur = items[pos];
  if (!cur) return null;
  const stop = (e) => e.stopPropagation();
  return ReactDOM.createPortal(
    <div className="lv-lightbox" onClick={onClose} role="dialog" aria-label="放大檢視">
      <figure className="lv-lb-fig" onClick={stop}>
        <img key={pos + ":" + cur.src} src={assetUrl(cur.src)} alt={cur.label || ""} onError={onImgError} />
        <figcaption>{cur.label}{items.length > 1 ? "（" + (pos + 1) + " / " + items.length + "）" : ""}</figcaption>
      </figure>
      {items.length > 1 && (
        <>
          <button className="lv-lb-btn prev" aria-label="上一張" onClick={(e) => { stop(e); onMove(-1); }}>‹</button>
          <button className="lv-lb-btn next" aria-label="下一張" onClick={(e) => { stop(e); onMove(1); }}>›</button>
        </>
      )}
      <button className="lv-lb-btn close" aria-label="關閉" onClick={(e) => { stop(e); onClose(); }}>✕</button>
    </div>,
    document.body
  );
}
function useLightbox() {
  const [zoom, setZoom] = useState(null);
  const close = useCallback(() => setZoom(null), []);
  const move = useCallback((d) => setZoom(z => z ? { items: z.items, pos: (z.pos + d + z.items.length) % z.items.length } : z), []);
  const open = (items, pos) => { const list = items.filter(x => x && x.src); if (list.length) setZoom({ items: list, pos: Math.max(0, Math.min(pos || 0, list.length - 1)) }); };
  const el = zoom && <Lightbox items={zoom.items} pos={zoom.pos} onClose={close} onMove={move} />;
  return { open, close, el };
}

/* ========================================================================
   11.1 第一關：偶像快看快答（照片只閃 N 秒）
   ====================================================================== */
function Level1Stage({ q, revealed, st, mode, flashSec, answerPanel }) {
  st = st || {};
  const single = mode === "single";
  const flow = useRevealFlow(revealed);
  const ar = useImgAspect(q.image, .8);
  const lb = useLightbox();
  const [visible, setVisible] = useState(false);
  const [countdown, setCountdown] = useState(0);
  const [flashes, setFlashes] = useState(0);
  const timerRef = useRef(null), ivRef = useRef(null);
  const stopAll = () => { clearTimeout(timerRef.current); clearInterval(ivRef.current); };
  useEffect(() => stopAll, []);
  useEffect(() => { if (revealed) { stopAll(); setCountdown(0); } }, [revealed]);

  const flash = () => {
    if (countdown > 0 || visible || revealed) return;
    setCountdown(3); let n = 3;
    clearInterval(ivRef.current);
    ivRef.current = setInterval(() => {
      n -= 1; setCountdown(n); SFX.tick();
      if (n <= 0) {
        clearInterval(ivRef.current);
        setVisible(true); setFlashes(f => f + 1);
        timerRef.current = setTimeout(() => setVisible(false), flashSec * 1000);
      }
    }, 700);
  };

  if (!flow.reveal) {
    return (
      <div ref={flow.rootRef} className={cx("lv-root", flow.leaving && "lv-leaving")}>
        <section className="lv-qcard">
          <QHead kicker="⚡ 偶像快看快答">
            <span className="lv-qhint">照片只出現 {flashSec.toFixed(1)} 秒 · 看清楚是誰！</span>
            {flashes > 0 && <span className="lv-chip">已閃現 {flashes} 次</span>}
          </QHead>
          <div className="lv-stage">
            <div className={cx("lv-frame l1-photo", visible && "is-flash")} data-flip="photo" style={{ "--ar": ar }}>
              {(visible || flow.leaving)
                ? <img className="l1-in" src={assetUrl(q.image)} alt="" draggable="false" onError={onImgError} />
                : countdown > 0
                  ? <div className="l1-count" key={countdown}>{countdown}</div>
                  : (
                    <div className="l1-wait">
                      <div className="l1-wait-ico">🫥</div>
                      <div>{flashes ? "再看一次？按下面的按鈕" : "準備好就按「閃現照片」"}</div>
                    </div>
                  )}
            </div>
          </div>
          <div className="lv-qfoot lv-fadeable">
            <Btn tone="cyan" onClick={flash} disabled={countdown > 0 || visible} className="font-bold">
              {visible ? "看！👀" : countdown > 0 ? "準備…" : flashes ? "再閃一次 ⚡" : "閃現照片 ⚡"}
            </Btn>
          </div>
        </section>
        <AnswerPanel>{answerPanel}</AnswerPanel>
      </div>
    );
  }

  const v = verdictOf(st, single);
  const zoomIt = () => lb.open([{ src: q.image, label: q.group + " · " + q.name }], 0);
  return (
    <div ref={flow.rootRef} className="lv-root">
      <div className="lv-media">
        <div className={cx("lv-comp rv-photo", "lv-tone-" + v.tone)} style={{ "--ar": ar }}>
          <div className={cx("lv-glass lv-card-bg", flow.animate && "lv-bg-in")} />
          <RevealTitle vertical group={q.group} title={q.name} v={v} animate={flow.animate} />
          <div className={cx("lv-frame rv-main is-open", flow.animate && !flow.flip && "lv-zoom")} data-flip="photo"
               role="button" tabIndex={0} aria-label="放大照片" onClick={zoomIt} onKeyDown={onKeyActivate(zoomIt)}>
            <img src={assetUrl(q.image)} alt={q.name} draggable="false" onError={onImgError} />
            <span className="lv-tag mv">📸 正解</span>
          </div>
        </div>
      </div>
      {lb.el}
    </div>
  );
}

/* ========================================================================
   11.2 第二關：聽前奏猜歌（黑膠唱片＋等化器）
   ====================================================================== */
function Level2Stage({ q, revealed, st, mode, duck, unduck, answerPanel }) {
  st = st || {};
  const single = mode === "single";
  const flow = useRevealFlow(revealed);
  const bgm = useDuck(duck, unduck);
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [started, setStarted] = useState(false);

  const clipSrc = q.clip || q.answer;
  const clipLimit = q.clip ? null : (q.introSeconds || 12);

  const play = () => {
    const a = audioRef.current; if (!a) return;
    bgm.duck(); setStarted(true);
    a.currentTime = 0;
    a.play().then(() => setPlaying(true)).catch(() => {});
  };
  useEffect(() => {
    const a = audioRef.current; if (!a || !clipLimit) return;
    const onT = () => { if (a.currentTime >= clipLimit) { a.pause(); setPlaying(false); bgm.unduck(); } };
    a.addEventListener("timeupdate", onT);
    return () => a.removeEventListener("timeupdate", onT);
  }, [clipLimit, q.id]);
  useEffect(() => {
    if (revealed) { const a = audioRef.current; if (a) a.pause(); setPlaying(false); bgm.duck(); }
  }, [revealed]);

  const audio = (
    <audio ref={audioRef} src={assetUrl(clipSrc)} preload="auto" className="hidden"
           onEnded={() => { setPlaying(false); bgm.unduck(); }} />
  );

  if (!flow.reveal) {
    return (
      <div ref={flow.rootRef} className={cx("lv-root", flow.leaving && "lv-leaving")}>
        {audio}
        <section className="lv-qcard">
          <QHead kicker="🎧 聽前奏猜歌">
            <span className="lv-qhint">{clipLimit ? "播放答案影片前 " + clipLimit + " 秒的音訊" : "聽前奏，猜猜是哪一首"}</span>
            {playing && <span className="lv-chip">🔊 播放中</span>}
          </QHead>
          <div className="lv-stage">
            <div className={cx("l2-disc", playing && "is-playing")} data-flip="disc">
              <span className="l2-ring" /><span className="l2-ring" />
              <div className="l2-vinyl" />
              <div className="l2-ico">{playing ? "🔊" : "🎧"}</div>
              <div className="l2-eq" aria-hidden="true">
                {[0, 1, 2, 3, 4, 5, 6].map(i => <i key={i} style={{ animationDelay: (i * 0.11) + "s", animationDuration: (0.7 + (i % 3) * 0.18) + "s" }} />)}
              </div>
            </div>
          </div>
          <div className="lv-qfoot lv-fadeable">
            {!started
              ? <Btn tone="cyan" onClick={play} className="font-bold">▶ 播放前奏</Btn>
              : <Btn tone="ghost" onClick={play} className="font-bold pop">🔂 再聽一次</Btn>}
          </div>
        </section>
        <AnswerPanel>{answerPanel}</AnswerPanel>
      </div>
    );
  }

  const v = verdictOf(st, single);
  return (
    <div ref={flow.rootRef} className="lv-root">
      {audio}
      <div className="lv-media">
        <div className={cx("lv-comp rv-solo", "lv-tone-" + v.tone)}>
          <div className={cx("lv-glass lv-card-bg", flow.animate && "lv-bg-in")} />
          <RevealTitle group={q.group} title={q.title} v={v} animate={flow.animate} />
          <div className={cx("lv-frame rv-main", flow.animate && "lv-zoom")}>
            {q.answer
              ? <video src={assetUrl(q.answer)} controls autoPlay playsInline preload="auto"
                       onPlay={bgm.duck} onPause={bgm.unduck} onEnded={bgm.unduck} />
              : <span className="lv-empty">（這首沒有答案影片）</span>}
            <span className="lv-tag mv">▶ 正解 MV</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================================
   11.3 第三關：看舞蹈猜歌（黑影舞蹈 → 答案影片）
   ====================================================================== */
function Level3Stage({ q, revealed, st, mode, maskMode, maskLevel, duck, unduck, answerPanel }) {
  st = st || {};
  const single = mode === "single";
  const flow = useRevealFlow(revealed);
  const bgm = useDuck(duck, unduck);
  const [replayKey, setReplayKey] = useState(0);

  const hasPrebuilt = !!q.question;
  const src = hasPrebuilt ? q.question : q.answer;
  const mm = hasPrebuilt ? "none" : maskMode;
  const maskLabel = hasPrebuilt ? "預先處理的剪影影片" : ((MASK_MODES.filter(m => m.id === mm)[0] || {}).label || "");

  if (!flow.reveal) {
    return (
      <div ref={flow.rootRef} className={cx("lv-root", flow.leaving && "lv-leaving")}>
        <section className="lv-qcard">
          <QHead kicker="🕺 看舞蹈猜歌">
            <span className="lv-qhint">看黑影的舞步，猜猜是哪一首</span>
            <span className="lv-chip">🔇 靜音 · {maskLabel}</span>
          </QHead>
          <div className="lv-stage">
            <div className="lv-frame l3-video" data-flip="media">
              <MaskedVideo fill src={src} mode={mm} level={maskLevel} playKey={replayKey} />
            </div>
          </div>
          <div className="lv-qfoot lv-fadeable">
            <Btn tone="cyan" onClick={() => setReplayKey(k => k + 1)} className="font-bold">🔁 重播舞蹈</Btn>
          </div>
        </section>
        <AnswerPanel>{answerPanel}</AnswerPanel>
      </div>
    );
  }

  const v = verdictOf(st, single);
  return (
    <div ref={flow.rootRef} className="lv-root">
      <div className="lv-media">
        <div className={cx("lv-comp rv-solo", "lv-tone-" + v.tone)}>
          <div className={cx("lv-glass lv-card-bg", flow.animate && "lv-bg-in")} />
          <RevealTitle group={q.group} title={q.title} v={v} animate={flow.animate} />
          <div className={cx("lv-frame rv-main", flow.animate && !flow.flip && "lv-zoom")} data-flip="media">
            <video src={assetUrl(q.answer || q.question)} controls autoPlay playsInline preload="auto"
                   onPlay={bgm.duck} onPause={bgm.unduck} onEnded={bgm.unduck} />
            <span className="lv-tag mv">▶ 正解 MV</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================================
   11.5 第五關：看MV片段猜歌（三張截圖逐步解鎖，已解鎖的不收回）
   ====================================================================== */
const L5_RANK_OK = ["", "🔥 神準！只看一張就猜中", "👍 看兩張就猜到了", "🎯 三張看完終於猜到"];

function Level5Stage({ q, revealed, st, mode, patch, answerPanel, duck, unduck }) {
  st = st || {};
  const single = mode === "single";
  const shots = (q.shots && q.shots.length) ? q.shots.slice(0, 3) : [];
  const open = Math.min(3, Math.max(1, st.shotsOpen || 1));     // 已解鎖到第幾張（只增不減）
  const flow = useRevealFlow(revealed);
  const bgm = useDuck(duck, unduck);
  const lb = useLightbox();
  const [mainShot, setMainShot] = useState(null);                // 沒有答案影片時，主畫面顯示哪一張
  useEffect(() => { if (revealed) lb.close(); }, [revealed]);

  const unlock = (i) => {
    if (revealed || flow.phase !== "question") return;
    SFX.click();
    patch({ shotsOpen: Math.max(open, i + 1) });   // 直接點第 3 張 → 前面的一起打開
  };
  const zoomShots = (indices, i) => {
    const list = indices.filter(k => shots[k]);
    lb.open(list.map(k => ({ src: shots[k], label: "片段 " + (k + 1) })), Math.max(0, list.indexOf(i)));
  };

  if (!flow.reveal) {
    const openIdx = [0, 1, 2].filter(k => k < open);
    return (
      <div ref={flow.rootRef} className={cx("lv-root", flow.leaving && "lv-leaving")}>
        <section className="lv-qcard">
          <QHead kicker="🎬 MV 片段">
            <span className="lv-dots" aria-hidden="true">{[0, 1, 2].map(k => <i key={k} className={k < open ? "on" : ""} />)}</span>
            <span className="text-xs font-bold whitespace-nowrap" style={{ color: "rgb(var(--acc1))" }}>已解鎖 {open} / 3</span>
            <span className="lv-qhint">· 看不出來就解鎖下一張，已解鎖的不會收回 · 點截圖可放大</span>
          </QHead>
          <div className="l5-shots">
            <div className="l5-strip">
              {[0, 1, 2].map(i => {
                const src = shots[i];
                if (i < open) {
                  return (
                    <div key={i} data-flip={"shot" + i} role="button" tabIndex={0} aria-label={"放大片段 " + (i + 1)}
                         className={cx("lv-frame", src && "is-open lv-unlock")}
                         onClick={() => src && zoomShots(openIdx, i)} onKeyDown={onKeyActivate(() => src && zoomShots(openIdx, i))}>
                      {src ? <img src={assetUrl(src)} alt="" draggable="false" onError={onImgError} />
                           : <span className="lv-empty">（沒有這張片段）</span>}
                      <span className="lv-tag">片段 {i + 1}</span>
                    </div>
                  );
                }
                const isNext = i === open;
                return (
                  <div key={i} data-flip={"shot" + i} role="button" tabIndex={0}
                       aria-label={"解鎖片段 " + (i + 1)}
                       className={cx("lv-frame is-locked", isNext && "is-next")}
                       onClick={() => unlock(i)} onKeyDown={onKeyActivate(() => unlock(i))}>
                    <span className="lv-tag">片段 {i + 1}</span>
                    <span className="l5-lock">
                      <span className="l5-lock-ico">{isNext ? "🔓" : "🔒"}</span>
                      <span className="l5-lock-txt">{isNext ? "解鎖片段 " + (i + 1) : "直接解鎖到第 " + (i + 1) + " 張"}</span>
                      <span className="l5-lock-sub">已解鎖的片段會留著</span>
                    </span>
                  </div>
                );
              })}
              <div className="lv-tile lv-fadeable" aria-hidden="true">
                <div className="lv-tile-big">{open}<small> / 3</small></div>
                <div className="lv-tile-txt">已解鎖片段</div>
                <div className="lv-tile-sub">{open < 3 ? "看得越少，猜中越厲害" : "全部公開了，加油！"}</div>
              </div>
            </div>
          </div>
        </section>
        <AnswerPanel>{answerPanel}</AnswerPanel>
        {lb.el}
      </div>
    );
  }

  /* ────────────── 公布答案：影片 + 三張截圖 ────────────── */
  const seen = open;
  const v = verdictOf(st, single);
  const rank = st.ok === true ? L5_RANK_OK[seen] : "對照三張截圖，記住這支 MV！";
  const animate = flow.animate, flip = flow.flip;
  const allIdx = [0, 1, 2];
  const hasVideo = !!q.answer;
  const mainIdx = (mainShot != null && shots[mainShot]) ? mainShot : (shots[2] ? 2 : shots[1] ? 1 : 0);

  const shotFrames = allIdx.map(i => {
    const src = shots[i];
    const picked = !hasVideo && i === mainIdx;
    const act = () => {
      if (!src) return;
      if (hasVideo) zoomShots(allIdx, i); else { SFX.click(); setMainShot(i); }
    };
    return (
      <div key={i} data-flip={"shot" + i} role="button" tabIndex={src ? 0 : -1}
           aria-label={(hasVideo ? "放大片段 " : "切換到片段 ") + (i + 1)}
           className={cx("lv-frame l5-s", src && "is-open", picked && "is-picked", animate && !flip && "lv-rise")}
           style={animate && !flip ? { animationDelay: (0.22 + i * 0.09) + "s" } : undefined}
           onClick={act} onKeyDown={onKeyActivate(act)}>
        {src ? <img src={assetUrl(src)} alt="" draggable="false" onError={onImgError}
                    className={i >= seen && animate ? "lv-fresh" : ""} />
             : <span className="lv-empty">（沒有這張片段）</span>}
        <span className="lv-tag">片段 {i + 1}</span>
        {src && i >= seen && <span className="lv-tag r">未解鎖</span>}
      </div>
    );
  });

  const main = hasVideo ? (
    <div className={cx("lv-frame l5-v", animate && "lv-zoom")}>
      <video src={assetUrl(q.answer)} controls autoPlay playsInline preload="auto"
             onPlay={bgm.duck} onPause={bgm.unduck} onEnded={bgm.unduck} />
      <span className="lv-tag mv">▶ 正解 MV</span>
    </div>
  ) : (
    <div className={cx("lv-frame l5-v", shots[mainIdx] && "is-main", animate && "lv-zoom")}
         role="button" tabIndex={0} aria-label="放大這張片段"
         onClick={() => shots[mainIdx] && zoomShots(allIdx, mainIdx)}
         onKeyDown={onKeyActivate(() => shots[mainIdx] && zoomShots(allIdx, mainIdx))}>
      {shots[mainIdx]
        ? <img key={mainIdx} className="pop" src={assetUrl(shots[mainIdx])} alt="" draggable="false" onError={onImgError} />
        : <span className="lv-empty">（這一題沒有答案影片，也沒有截圖）</span>}
      <span className="lv-tag mv">🖼️ 片段 {mainIdx + 1} · 這首沒有答案影片</span>
    </div>
  );

  return (
    <div ref={flow.rootRef} className="lv-root">
      <div className="lv-media">
        <div className={cx("lv-comp l5-comp", "lv-tone-" + v.tone)}>
          <div className={cx("lv-glass lv-card-bg", animate && "lv-bg-in")} />
          <RevealTitle group={q.group} title={q.title} v={v} animate={animate}
                       stat={"🎬 看了 " + seen + "/3 張"} statTitle={rank} />
          {main}
          {shotFrames}
          <div className={cx("lv-tile", animate && "lv-rise")} style={animate ? { animationDelay: ".5s" } : undefined}>
            <div className="lv-tile-big">{seen}<small> / 3</small></div>
            <div className="lv-tile-txt">你看了幾張片段</div>
            <div className="lv-tile-sub">{rank}</div>
          </div>
        </div>
      </div>
      {lb.el}
    </div>
  );
}

/* ========================================================================
   12. 第四關：手燈選團體 → 把成員拖到「眼睛」「嘴巴」
   ------------------------------------------------------------------------
   拖曳的名牌（ghost）用 portal 掛在 <body>，
   位置 = 指標的 clientX / clientY − 名牌自身寬高的一半 → 永遠正中對齊游標／手指，
   不受任何父層的 transform / 毛玻璃 / 動畫影響。移動時只改 transform（GPU），不重繪 React。
   ====================================================================== */
const ZONES = [
  { key: "eyes",  label: "眼睛", emoji: "👁️" },
  { key: "mouth", label: "嘴巴", emoji: "👄" },
];

/* 成員名牌永遠可以重複使用、也永遠拖得動：
   1. 放錯在「眼睛」的人，很可能正是「嘴巴」的正解 → 不能有「答錯就永久劃掉」
   2. 已經放進某一格的名牌仍然可以再拖到另一格（會自動和那一格的人對調）→ 只是變淡 */
function Chip({ value, used, selected, dragging, onPointerDown, onPointerMove, onPointerUp, onPointerCancel, onKeySelect }) {
  return (
    <button type="button" title={used ? "已放入，可再拖到另一格對調" : "拖到眼睛／嘴巴，或點一下再點格子"}
      className={cx("chip", used && "is-used", selected && "is-sel", dragging && "is-dragging")}
      onPointerDown={onPointerDown} onPointerMove={onPointerMove}
      onPointerUp={onPointerUp} onPointerCancel={onPointerCancel}
      onClick={e => { e.preventDefault(); onKeySelect(); }}
      onContextMenu={e => e.preventDefault()}>
      {value}
    </button>
  );
}

function DragGhost({ ghostRef, value }) {
  return ReactDOM.createPortal(
    <div ref={ghostRef} className="chip-ghost" aria-hidden="true"><div className="chip-ghost-in">{value}</div></div>,
    document.body
  );
}

function Level4Stage({ q, two, mode, revealed, st, onJudge, onSelectGroup, onBackGroup }) {
  st = st || {};
  const single = mode === "single";
  const flow = useRevealFlow(revealed);
  const lb = useLightbox();
  const [slots, setSlots] = useState({ eyes: null, mouth: null });
  const [marks, setMarks] = useState(null);
  const [shakeOn, setShakeOn] = useState(false);
  const [selected, setSelected] = useState(null);
  const [dragVal, setDragVal] = useState(null);      // 拖曳中的名牌（移動超過 4px 才算拖曳）
  const [hotZone, setHotZone] = useState(null);

  const dragRef = useRef(null);
  const ghostRef = useRef(null);
  const hotRef = useRef(null);
  const justDroppedRef = useRef(0);
  const lastUpRef = useRef(0);                         // 剛處理過指標放開 → 緊接著的 click 不要再處理一次
  const zoneRefs = { eyes: useRef(null), mouth: useRef(null) };

  const sel = st.sel || null;
  const attempts = st.attempts || 0;

  useEffect(() => { setSlots({ eyes: null, mouth: null }); setMarks(null); setSelected(null); }, [sel]);
  useEffect(() => () => { const d = dragRef.current; if (d && d.raf) cancelAnimationFrame(d.raf); }, []);

  const filled = !!(slots.eyes && slots.mouth);
  const lsSrc = lsOf(q);

  /* 放置規則：
     - 目標格空的 → 直接放進去
     - 目標格已有人，而且拖過來的人本來在另一格 → 兩格「對調」
     - 目標格已有人，拖過來的是還沒用過的人 → 覆蓋
     只清掉被動到的那幾格的對錯標記 */
  const place = (zone, value) => {
    const from = Object.keys(slots).filter(k => slots[k] === value)[0];
    const displaced = slots[zone];
    setSlots(s => {
      const n = { ...s };
      n[zone] = value;
      if (from && from !== zone) n[from] = displaced || null;
      return n;
    });
    setMarks(mk => {
      if (!mk) return null;
      const o = { ...mk };
      o[zone] = null;
      if (from && from !== zone) o[from] = null;
      return o;
    });
    SFX.drop();
  };
  const clearZone = (zone) => {
    setSlots(s => ({ ...s, [zone]: null }));
    setMarks(mk => (mk ? { ...mk, [zone]: null } : null));
  };
  const clearAll = () => { setSlots({ eyes: null, mouth: null }); setMarks(null); setSelected(null); };

  const zoneAt = (x, y) => {
    for (const z of ZONES) {
      const el = zoneRefs[z.key].current;
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return z.key;
    }
    return null;
  };

  // 把名牌的「中心點」放在指標位置：clientX − 寬/2、clientY − 高/2
  const positionGhost = () => {
    const d = dragRef.current, el = ghostRef.current;
    if (!d) return;
    d.raf = 0;
    if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.transform = "translate3d(" + (d.x - w / 2) + "px," + (d.y - h / 2) + "px,0)";
  };
  // 名牌第一次出現時（還沒畫到畫面上之前）就先定好位置 → 不會閃一下跑到左上角
  useLayoutEffect(() => { if (dragVal) positionGhost(); }, [dragVal]);

  const startDrag = (e, value) => {
    if (revealed || flow.phase !== "question") return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    dragRef.current = { value, id: e.pointerId, moved: false, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, raf: 0 };
  };
  const moveDrag = (e) => {
    const d = dragRef.current;
    if (!d || d.id !== e.pointerId) return;
    d.x = e.clientX; d.y = e.clientY;
    if (!d.moved) {
      if (Math.abs(d.x - d.sx) + Math.abs(d.y - d.sy) < 5) return;
      d.moved = true;
      setDragVal(d.value);            // 開始拖曳 → 名牌出現（useLayoutEffect 會先定位）
    } else if (!d.raf) {
      d.raf = requestAnimationFrame(positionGhost);
    }
    const z = zoneAt(d.x, d.y);
    if (z !== hotRef.current) { hotRef.current = z; setHotZone(z); }
  };
  const endDrag = (e) => {
    const d = dragRef.current;
    if (!d || d.id !== e.pointerId) return;
    if (d.raf) cancelAnimationFrame(d.raf);
    dragRef.current = null;
    lastUpRef.current = Date.now();
    const cancelled = e.type === "pointercancel";
    const z = (!cancelled && d.moved) ? zoneAt(e.clientX, e.clientY) : null;
    setDragVal(null); hotRef.current = null; setHotZone(null);
    if (z) { justDroppedRef.current = Date.now(); place(z, d.value); setSelected(null); }
    else if (!d.moved && !cancelled) { SFX.click(); setSelected(s => (s === d.value ? null : d.value)); }
  };
  const tapZone = (zone) => {
    if (revealed || flow.phase !== "question" || !sel) return;
    if (Date.now() - justDroppedRef.current < 400) return;
    if (selected) { place(zone, selected); setSelected(null); }
    else if (slots[zone]) clearZone(zone);
  };

  // ── 判定：團名 + 眼睛 + 嘴巴 三個都對才算全對 ─────────────────
  const submit = () => {
    if (!filled || revealed || !sel) return;
    const m = {
      group: sel === two.correctGroup,
      eyes:  slots.eyes  === two.correctEyes,
      mouth: slots.mouth === two.correctMouth,
    };
    const allRight = m.group && m.eyes && m.mouth;
    setMarks(m);
    if (allRight) { SFX.correct(); onJudge(true, { slots }); return; }
    SFX.wrong();
    if (single) { onJudge(false, { slots, marks: m }); return; }
    // 多人：只抖一下提示，不清空任何格子、也不換團體
    setShakeOn(true);
    setTimeout(() => setShakeOn(false), 480);
    onJudge(false, { slots, marks: m, groupOk: m.group });
  };

  /* ────────────── 公布答案：手燈 / 眼睛 / 嘴巴 三張 ────────────── */
  if (flow.reveal) {
    const mine = st.slots || slots;
    const cells = [
      { key: "ls",    label: "團名", emoji: "🏷️", src: lsSrc, name: two.correctGroup, my: st.sel || null },
      { key: "eyes",  label: "眼睛", emoji: "👁️", src: (q.eyes && (q.eyes.a || q.eyes.q)),   name: two.correctEyes,  my: mine.eyes },
      { key: "mouth", label: "嘴巴", emoji: "👄", src: (q.mouth && (q.mouth.a || q.mouth.q)), name: two.correctMouth, my: mine.mouth },
    ];
    const rightN = cells.filter(c => c.my != null && c.my === c.name).length;
    const v = verdictOf(st, single, "答對 " + rightN + " / 3 項");
    const zoomList = cells.map(c => ({ src: c.src, label: c.emoji + " " + c.label + " · " + (c.name || "") }));
    return (
      <div ref={flow.rootRef} className="lv-root">
        <div className="lv-media">
          <div className={cx("lv-comp rv-trio", "lv-tone-" + v.tone)}>
            <div className={cx("lv-glass lv-card-bg", flow.animate && "lv-bg-in")} />
            <RevealTitle group="手燈 ＋ 眼睛 ＋ 嘴巴" title={two.correctGroup} v={v} animate={flow.animate} />
            {cells.map((c, i) => {
              const ok = c.my === c.name;
              const zoomIt = () => lb.open(zoomList, i);
              return (
                <div key={c.key} className="rv-cell">
                  <div data-flip={c.key} role="button" tabIndex={0} aria-label={"放大" + c.label}
                       className={cx("lv-frame is-open", flow.animate && !flow.flip && "lv-rise")}
                       style={flow.animate && !flow.flip ? { animationDelay: (0.2 + i * 0.09) + "s" } : undefined}
                       onClick={zoomIt} onKeyDown={onKeyActivate(zoomIt)}>
                    {c.src ? <img src={assetUrl(c.src)} alt="" draggable="false" onError={onImgError}
                                  className={c.key !== "ls" && flow.animate ? "lv-fresh" : ""} />
                           : <span className="lv-empty">（無素材）</span>}
                    <span className="lv-tag">{c.emoji} {c.label}</span>
                  </div>
                  <div className={cx("rv-cap", flow.animate && "lv-rise")} style={flow.animate ? { animationDelay: (0.45 + i * 0.09) + "s" } : undefined}>
                    <b title={c.name}>{c.name || "—"}</b>
                    {c.my != null && <small className={ok ? "ok" : "bad"}>{ok ? "✅ 你選對了" : "❌ 你選「" + c.my + "」"}</small>}
                  </div>
                </div>
              );
            })}
            <div className={cx("lv-tile", flow.animate && "lv-rise")} style={flow.animate ? { animationDelay: ".55s" } : undefined}>
              <div className="lv-tile-big">{rightN}<small> / 3</small></div>
              <div className="lv-tile-txt">答對幾項</div>
              <div className="lv-tile-sub">眼睛與嘴巴來自 {two.correctGroup} 的不同兩位成員</div>
            </div>
          </div>
        </div>
        {lb.el}
      </div>
    );
  }

  /* ────────────── 作答中 ────────────── */
  const markG = st.groupMark == null ? null : st.groupMark;
  const board = (
    <div className="lv-stage">
      <div className={cx("l4-board", shakeOn && "shake")}>
        <div className="lv-frame l4-ls" data-flip="ls">
          {lsSrc ? <img src={assetUrl(lsSrc)} alt="" draggable="false" onError={onImgError} />
                 : <span className="lv-empty">（無手燈）</span>}
          <span className="lv-tag">🔦 手燈</span>
          {sel && <span className={cx("l4-slot grp pop", markG === true && "ok", markG === false && "bad")}>🏷️ {sel}{markG === true ? " ✅" : markG === false ? " ❌" : ""}</span>}
        </div>
        {ZONES.map(z => {
          const src = z.key === "eyes" ? (q.eyes && q.eyes.q) : (q.mouth && q.mouth.q);
          const val = slots[z.key];
          const mark = marks ? marks[z.key] : null;
          const isZone = !!sel;
          return (
            <div key={z.key} ref={zoneRefs[z.key]} data-flip={z.key}
                 role={isZone ? "button" : undefined} tabIndex={isZone ? 0 : undefined}
                 aria-label={isZone ? "放到" + z.label : undefined}
                 className={cx("lv-frame l4-feat", isZone && "l4-zone", val && "is-filled",
                               isZone && selected && !val && "is-armed",
                               hotZone === z.key && "zone-hot", mark === true && "glow-ok", mark === false && "glow-bad")}
                 onClick={() => tapZone(z.key)} onKeyDown={onKeyActivate(() => tapZone(z.key))}>
              {src ? <img src={assetUrl(src)} alt="" draggable="false" onError={onImgError} />
                   : <span className="lv-empty">（無素材）</span>}
              <span className="lv-tag">{z.emoji} {z.label}</span>
              {isZone && (val
                ? <span key={val} className={cx("l4-slot pop", mark === true && "ok", mark === false && "bad")}>
                    {val}{mark === true ? " ✅" : mark === false ? " ❌" : ""}
                  </span>
                : <span className="l4-drop-hint">{selected ? "點這裡放入「" + selected + "」" : <>拖成員到這裡<small> ⤵</small></>}</span>)}
            </div>
          );
        })}
      </div>
    </div>
  );

  const attemptsChip = !single && attempts > 0
    ? <span className="lv-attempts pop">已嘗試 {attempts} 次</span> : null;

  let panel;
  if (!sel) {
    panel = (
      <div className="w-full">
        <div className="lv-ahead">
          <StepBadge n="1" text="第一步：看手燈選出團體" compact />
          {st.hint && <span className="lv-ahint pop" title={st.hint}>{st.hint}</span>}
          {attemptsChip}
        </div>
        <GroupGrid groups={two.groups} correctGroup={two.correctGroup} compact
                   revealed={false} badGroups={st.badGroups || []} onPick={onSelectGroup} />
      </div>
    );
  } else {
    const members = two.items[sel] || [];
    const used = [slots.eyes, slots.mouth].filter(Boolean);
    panel = (
      <div className="w-full">
        <div className="lv-ahead">
          <StepBadge n="2" text="把成員拖到眼睛／嘴巴" compact />
          <SelectedGroupBar group={sel} onBack={onBackGroup} compact mark={markG} />
          {st.hint && <span className="lv-ahint pop" title={st.hint}>{st.hint}</span>}
          {attemptsChip}
        </div>
        <div className="l4-flow">
        <div className={cx("l4-chips", members.length > 10 && "many")}>
          {members.length === 0 && <span className="text-slate-500 text-sm">（題庫裡這一團還沒有成員資料）</span>}
          {members.map(v => (
            <Chip key={v} value={v}
              used={used.indexOf(v) >= 0}
              selected={selected === v}
              dragging={dragVal === v}
              onPointerDown={e => startDrag(e, v)}
              onPointerMove={moveDrag} onPointerUp={endDrag} onPointerCancel={endDrag}
              onKeySelect={() => { if (Date.now() - lastUpRef.current > 600) setSelected(s => (s === v ? null : v)); }} />
          ))}
        </div>
        <div className="l4-actions">
          <Btn tone="good" disabled={!filled} onClick={submit} className="font-bold fit-btn">確認作答 ✅</Btn>
          <Btn tone="ghost" size="sm" onClick={clearAll} className="fit-btn">清空重放</Btn>
          <span className="l4-tip">眼睛與嘴巴是這一團的<b className="text-slate-300">不同兩位成員</b> · 可以拖曳，也可以「點成員 → 點格子」</span>
        </div>
        </div>
      </div>
    );
  }

  return (
    <div ref={flow.rootRef} className={cx("lv-root", flow.leaving && "lv-leaving")}>
      <section className="lv-qcard">
        <QHead kicker="👀 看五官猜偶像">
          <span className="lv-qhint">{sel ? "把「" + sel + "」的成員拖到眼睛、嘴巴（可以點選後再點格子）" : "先從手燈認出是哪一團"}</span>
        </QHead>
        {board}
      </section>
      <AnswerPanel>{panel}</AnswerPanel>
      {dragVal && <DragGhost ghostRef={ghostRef} value={dragVal} />}
    </div>
  );
}

/* ========================================================================
   13. 挑戰畫面
   ====================================================================== */
function QuizScreen({ mode, deck, config, scores, setScores, states, patchState, onMenu, onFinish, bgm }) {
  const [idx, setIdx] = useState(0);
  const [left, setLeft] = useState(config.timer);
  const [running, setRunning] = useState(config.timer > 0);
  const [nav, setNav] = useState({ dir: 1, leaving: false });   // 換題轉場：方向＋是否正在滑出
  const navTimer = useRef(null);
  const reduceMotion = useMemo(prefersReducedMotion, []);
  const q = deck[idx];
  const st = states[idx] || {};
  const revealed = !!st.revealed;
  const single = mode === "single";

  useEffect(() => {
    setLeft(config.timer);
    setRunning(config.timer > 0 && !revealed);
    bgm.resetDuck();
  }, [idx]);

  useEffect(() => {
    if (!running || config.timer === 0 || revealed) return;
    if (left <= 0) { setRunning(false); SFX.timeup(); return; }
    const t = setTimeout(() => { setLeft(l => l - 1); if (left <= 4) SFX.tick(); }, 1000);
    return () => clearTimeout(t);
  }, [left, running, revealed, config.timer]);

  /* 整個挑戰畫面鎖在一個螢幕高度（100dvh）：頂列、題目、按鈕、計分列全部用 flex 分配，絕不出現捲軸 */
  useEffect(() => {
    document.body.classList.add("no-scroll");
    try { window.scrollTo(0, 0); } catch (e) {}
    return () => { document.body.classList.remove("no-scroll"); clearTimeout(navTimer.current); };
  }, []);

  // 換題：目前這題先往旁邊滑出（0.2 秒），下一題再從另一邊滑進來
  const goTo = (n) => {
    if (n < 0 || n >= deck.length || n === idx || nav.leaving) return;
    const dir = n > idx ? 1 : -1;
    if (reduceMotion) { setNav({ dir, leaving: false }); setIdx(n); return; }
    setNav({ dir, leaving: true });
    clearTimeout(navTimer.current);
    navTimer.current = setTimeout(() => { setIdx(n); setNav({ dir, leaving: false }); }, 200);
  };
  const next = () => {
    if (nav.leaving) return;
    if (idx + 1 >= deck.length) { SFX.finish(); onFinish(); } else goTo(idx + 1);
  };
  const prev = () => goTo(idx - 1);

  // 主持人手動公布（卡關時的逃生門）
  const revealNow = () => { patchState(idx, { revealed: true }); setRunning(false); SFX.reveal(); };

  const two = q.__two;
  /* 答對之後一律「停在原地」等人按「下一題 →」，不做任何自動跳轉。 */

  // ── 兩段式：第一步 選團體 ──────────────────────────────────
  const selectGroup = (g) => { if (revealed) return; SFX.click(); patchState(idx, { sel: g, hint: null }); };
  const backGroup   = () => { if (revealed) return; SFX.click(); patchState(idx, { sel: null, picked: null, hint: null }); };

  // ── 兩段式：第二步 選成員／選歌曲（第一～三、五關）──────────
  const pickItem = (label) => {
    if (revealed || !two) return;
    const sel = st.sel;
    const groupOk = sel === two.correctGroup;
    const ok = groupOk && label === two.correctItem;

    if (ok) {
      SFX.correct();
      patchState(idx, { revealed: true, picked: label, ok: true, hint: null });
      setRunning(false);
      return;
    }
    SFX.wrong();
    if (single) {
      patchState(idx, { revealed: true, picked: label, ok: false, hint: null });
      setRunning(false);
      return;
    }
    /* 多人：答對才能過關。刻意「不動 sel」，只把按錯的劃掉，可以立刻換一個再試。 */
    const attempts = (st.attempts || 0) + 1;
    patchState(idx, {
      attempts,
      picked: label,
      groupMark: groupOk,
      badItems: uniq((st.badItems || []).concat([label])),
      badGroups: groupOk ? (st.badGroups || []) : uniq((st.badGroups || []).concat([sel])),
      hint: groupOk
        ? "「" + label + "」不對，同一團裡再挑一個" + (two.kind === "song" ? "歌" : "人")
        : "這一團不對 —— 按「↩ 重選團體」換一團試試",
    });
  };

  // ── 第四關拖拉判定回呼 ─────────────────────────────────────
  const judgeL4 = (ok, info) => {
    if (ok) {
      patchState(idx, { revealed: true, ok: true, slots: info.slots, hint: null });
      setRunning(false);
      return;
    }
    if (single) {
      patchState(idx, { revealed: true, ok: false, slots: info.slots, hint: null });
      setRunning(false);
      return;
    }
    /* 多人：不公布答案，也「不清空任何東西」，只在格子上標 ✅ / ❌ */
    const attempts = (st.attempts || 0) + 1;
    patchState(idx, {
      attempts,
      slots: info.slots,
      groupMark: info.groupOk,
      badGroups: info.groupOk ? (st.badGroups || []) : uniq((st.badGroups || []).concat([st.sel])),
      hint: info.groupOk
        ? "打 ❌ 的那一格放錯人了，換掉再送出一次"
        : "這一團不對 —— 按「↩ 重選團體」換一團試試",
    });
  };

  const addScore = (ti, d) => {
    setScores(s => { const n = s.slice(); n[ti] = (n[ti] || 0) + d; return n; });
    if (d > 0) SFX.correct(); else SFX.wrong();
  };

  const meta = LEVEL_META.filter(m => m.id === q.__level)[0];
  const timePct = config.timer ? Math.max(0, left) / config.timer * 100 : 0;
  const answered = states.filter(s => s && s.ok != null);
  const rightN = answered.filter(s => s.ok).length;
  const wrongN = answered.length - rightN;

  // 第一～三、五關共用的作答區（兩段式，精簡版）
  const answerPanel = (two && q.__level !== "level4") ? (
    <TwoStage compact two={two} st={st} revealed={revealed}
              onSelectGroup={selectGroup} onBackGroup={backGroup} onPickItem={pickItem}
              extra={!single && !revealed && (st.attempts || 0) > 0
                ? <span className="lv-attempts pop">已嘗試 {st.attempts} 次</span> : null} />
  ) : null;

  const stageCls = nav.leaving ? (nav.dir > 0 ? "q-out-l" : "q-out-r") : (nav.dir > 0 ? "q-in-r" : "q-in-l");

  return (

// 數字從 0 跑到目標值（結算畫面用）
function useCountUp(target, ms) {
  const [v, setV] = useState(prefersReducedMotion() ? target : 0);
  useEffect(() => {
    if (prefersReducedMotion()) { setV(target); return; }
    let raf = 0; const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      setV(Math.round(target * (1 - Math.pow(1 - k, 3))));
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}

// 彩帶（只在成績好、或多人模式頒獎時出現一次）
function Confetti({ n }) {
  const pieces = useMemo(() => {
    const colors = ["#f472b6", "#a78bfa", "#22d3ee", "#fbbf24", "#34d399", "#fb7185"];
    return Array.from({ length: n || 70 }, (_, i) => ({
      left: Math.random() * 100, delay: Math.random() * 0.9, dur: 2.6 + Math.random() * 2,
      dx: (Math.random() - 0.5) * 220, rot: (Math.random() * 900 - 450), w: 6 + Math.random() * 6, color: colors[i % colors.length],
    }));
  }, []);
  return (
    <div className="confetti" aria-hidden="true">
      {pieces.map((p, i) => (
        <i key={i} style={{ left: p.left + "%", width: p.w + "px", height: (p.w * 1.6) + "px", background: p.color,
                            animationDelay: p.delay + "s", animationDuration: p.dur + "s", "--dx": p.dx + "px", "--rot": p.rot + "deg" }} />
      ))}
    </div>
  );
}

const BASE_LEVELS = {
  level1: { on: true, count: 5 }, level2: { on: true, count: 5 },
  level3: { on: true, count: 5 }, level4: { on: true, count: 5 },
  level5: { on: true, count: 5 },
};
const DEFAULT_CFG = {
  single: {
    levels: JSON.parse(JSON.stringify(BASE_LEVELS)),
    teams: ["我"],
    timer: 0,             // 單人預設也不計時
    flashSec: 1.0,
    optionCount: 12,      // 第一步要出現幾個團體
    maskMode: "silhouette", maskLevel: 0.7,
    sfx: true, sfxVol: 0.85, mixLevels: false,
  },
  multi: {
    levels: JSON.parse(JSON.stringify(BASE_LEVELS)),
    teams: ["隊伍 1", "隊伍 2"],
    timer: 0,             // 多人預設不計時（主持人自己控節奏）
    flashSec: 1.0,
    optionCount: 12,
    maskMode: "silhouette", maskLevel: 0.7,
    sfx: true, sfxVol: 0.85, mixLevels: false,
  },
};

function App() {
  const [screen, setScreen] = useState("cover");
  const [mode, setMode] = useState("single");
  const [cfgAll, setCfgAll] = useState(DEFAULT_CFG);
  const [deck, setDeck] = useState([]);
  const [states, setStates] = useState([]);     // 每題作答狀態
  const [scores, setScores] = useState([0, 0]);
  const [showSettings, setShowSettings] = useState(false);

  // 全域設定（不分模式）：BGM 音量／曲目、封面背景卡片數量
  const TRACKS = useMemo(() => (DATA && DATA.bgm ? DATA.bgm : []), []);
  const [gcfg, setGcfg] = useState(() => ({
    bgmVol: 0.42,
    photoCount: 12,
    bgmTrack: (DATA && DATA.bgm && DATA.bgm[0]) || "",
    trackName: trackLabel((DATA && DATA.bgm && DATA.bgm[0]) || ""),
    custom: false,
  }));

  const config = cfgAll[mode];
  const setConfig = useCallback((updater) => {
    setCfgAll(all => {
      const cur = all[mode];
      const nextCfg = typeof updater === "function" ? updater(cur) : updater;
      return { ...all, [mode]: nextCfg };
    });
  }, [mode]);

  const pools = useMemo(() => {
    const out = {};
    LEVEL_KEYS.forEach(k => { out[k] = []; });
    if (!DATA || !DATA.levels) return out;
    LEVEL_KEYS.forEach(k => {
      const lv = DATA.levels[k];
      out[k] = (lv && lv.questions ? lv.questions : []).map(q => ({ ...q, __level: k }));
    });
    return out;
  }, []);

  // 第四關名冊：優先用掃描器產生的 groups，沒有就從題目推回來
  const l4groups = useMemo(() => {
    const lv = DATA && DATA.levels && DATA.levels.level4;
    if (lv && lv.groups && lv.groups.length) return lv.groups;
    return deriveL4Groups(pools.level4);
  }, [pools]);

  // 兩段式作答用的名冊：團體 → 成員 / 團體 → 歌曲
  const rosters = useMemo(() => buildRosters(pools, l4groups), [pools, l4groups]);

  const cover = (DATA && DATA.cover) ? DATA.cover : null;
  const totals = LEVEL_META.map(m => ({ label: m.title, emoji: m.emoji, n: pools[m.id].length }));

  const dataError = useMemo(() => {
    if (!DATA) return "找不到題庫檔 quiz-data.js。請先執行資料夾中的「更新題庫.bat」重新掃描素材。";
    const total = Object.keys(pools).reduce((s, k) => s + pools[k].length, 0);
    if (total === 0) return "題庫是空的。請確認 D:\\kpop 各關資料夾內有素材，並執行「更新題庫.bat」。";
    return null;
  }, [pools]);

  // 四關「第一步」可選的團體總數，設定畫面拿來顯示上限
  const groupTotal = useMemo(() => {
    const s2 = {};
    Object.keys(rosters.members).forEach(k => { s2[k] = 1; });
    Object.keys(rosters.songs).forEach(k => { s2[k] = 1; });
    (l4groups || []).forEach(g => { s2[g.name] = 1; });
    return Object.keys(s2).length;
  }, [rosters, l4groups]);

  const bgm = useBgm(gcfg.bgmTrack);
  useEffect(() => { bgm.setBaseVolume(gcfg.bgmVol); }, [gcfg.bgmVol]);
  useEffect(() => { SFX.setEnabled(config.sfx); }, [config.sfx]);
  useEffect(() => { SFX.setVolume(config.sfxVol); }, [config.sfxVol]);

  const patchState = useCallback((i, patch) => {
    setStates(s => { const n = s.slice(); n[i] = { ...(n[i] || {}), ...patch }; return n; });
  }, []);

  const buildDeck = () => {
    let d = [];
    LEVEL_KEYS.forEach(k => {
      const lv = config.levels[k];
      if (!lv.on) return;
      d = d.concat(pickN(pools[k], lv.count));
    });
    if (config.mixLevels) d = shuffle(d);
    // 出題當下就把兩段式選項算好，之後上一題下一題都不會變
    return d.map(q => attachTwo(q, config, rosters, l4groups));
  };

  const startChallenge = () => {
    const d = buildDeck();
    if (!d.length) return;
    setDeck(d);
    setStates(d.map(() => ({})));
    setScores(config.teams.map(() => 0));
    bgm.resetDuck();
    bgm.suspend();              // 進入挑戰 → 自動停止背景音樂
    setScreen("quiz");
  };

  const pickMode = (m) => { setMode(m); setScreen("menu"); };
  const goMenu  = () => { bgm.resetDuck(); bgm.wake(); setScreen("menu"); };
  const goCover = () => { bgm.resetDuck(); bgm.wake(); setScreen("cover"); };
  const finish  = () => { bgm.resetDuck(); bgm.wake(); setScreen("result"); };

  const settings = showSettings && (
    <GlobalSettingsModal g={gcfg} setG={setGcfg} tracks={TRACKS} maxPhotos={MAX_PHOTOS}
                         onClose={() => setShowSettings(false)} />
  );
  const openSettings = () => setShowSettings(true);

  /* 畫面切換：舊畫面留在原地淡出（約 0.42 秒），新畫面同時淡入。
     兩層都用 screen 名稱當 key，React 會保留舊畫面原本的元件實例（狀態、影片不會重來）。 */
  const lastScreenRef = useRef({ key: screen, el: null });
  const exitRef = useRef(null);
  const [, setTick] = useState(0);

  let screenEl;
  if (screen === "cover")
    screenEl = <CoverScreen cover={cover} totals={totals} bgm={bgm} photoCount={gcfg.photoCount}
                            onPickMode={pickMode} onOpenSettings={openSettings} />;
  else if (screen === "menu")
    screenEl = <MenuScreen mode={mode} config={config} setConfig={setConfig} pools={pools}
                           groupTotal={groupTotal} dataError={dataError} bgm={bgm}
                           onBack={goCover} onStart={startChallenge} onOpenSettings={openSettings} />;
  else if (screen === "quiz")
    screenEl = <QuizScreen mode={mode} deck={deck} config={config} scores={scores} setScores={setScores}
                           states={states} patchState={patchState}
                           bgm={bgm} onMenu={goMenu} onFinish={finish} />;
  else
    screenEl = <ResultScreen mode={mode} config={config} deck={deck} states={states} scores={scores} bgm={bgm}
                             onMenu={goMenu} onCover={goCover} onAgain={startChallenge} />;

  if (lastScreenRef.current.key !== screen) {
    // 這一次 render 就要把舊畫面放進去，React 才會沿用它原本的元件實例（不會重新掛載）
    const prev = lastScreenRef.current;
    // 記下舊畫面當時捲到哪裡，淡出時維持在同一個位置，不會跳回頂端
    exitRef.current = (prev.el && !prefersReducedMotion()) ? { key: prev.key, el: prev.el, y: window.scrollY || 0 } : null;
  }
  lastScreenRef.current = { key: screen, el: screenEl };

  useEffect(() => {
    try { window.scrollTo(0, 0); } catch (e) {}
    if (!exitRef.current) return;
    const t = setTimeout(() => { exitRef.current = null; setTick(x => x + 1); }, 430);
    return () => clearTimeout(t);
  }, [screen]);

  const exiting = exitRef.current && exitRef.current.key !== screen ? exitRef.current : null;
  const layers = [];
  if (exiting) {
    layers.push(
      <div key={"screen-" + exiting.key} className="screen-layer screen-out" aria-hidden="true">
        <div style={{ marginTop: -exiting.y + "px" }}>{exiting.el}</div>
      </div>
    );
  }
  // 兩種狀態的結構必須一模一樣（div > div > 畫面），React 才會沿用同一個元件實例
  layers.push(
    <div key={"screen-" + screen} className="screen-layer screen-in">
      <div>{screenEl}</div>
    </div>
  );

  return <>{layers}{settings}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
