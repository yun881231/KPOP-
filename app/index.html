<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPOP之王巔峰賽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0a0616" />
<meta name="description" content="KPOP之王巔峰賽 — 五大關卡 K-POP 互動測驗" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #07040f;
    overflow-x: hidden;
  }

  /* ---------- 動態背景：極光光暈 ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1){ width:56vw; height:56vw; left:-14vw; top:-18vw; background:#ec4899; animation-duration:24s; }
  .aurora i:nth-child(2){ width:48vw; height:48vw; right:-12vw; top:-10vw; background:#6366f1; animation-duration:31s; animation-delay:-6s; }
  .aurora i:nth-child(3){ width:44vw; height:44vw; left:22vw; bottom:-20vw; background:#22d3ee; animation-duration:28s; animation-delay:-12s; opacity:.4; }
  .aurora i:nth-child(4){ width:34vw; height:34vw; right:8vw; bottom:-14vw; background:#a855f7; animation-duration:35s; animation-delay:-3s; }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    33%  { transform: translate3d(6vw,4vh,0) scale(1.15); }
    66%  { transform: translate3d(-5vw,7vh,0) scale(.92); }
    100% { transform: translate3d(3vw,-5vh,0) scale(1.08); }
  }

  /* ---------- 掃過畫面的光帶 ---------- */
  .sheen { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .sheen::after {
    content:""; position:absolute; top:-50%; left:-60%; width:35%; height:200%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.055), transparent);
    transform: rotate(12deg); animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep { 0%,72% { left:-60%; } 100% { left:130%; } }

  /* ---------- 封面照片牆 ---------- */
  /* 封面照片卡 —— 不使用任何固定比例容器
     .pw-slot  絕對定位 + 滑鼠視差（inline transform）+ 淡入（只動 opacity）
     .pw-float 上下浮動 + drop-shadow 柔邊光暈（會沿著圖片實際形狀，不是方框）
     img       width:100% / height:auto → 完全依原圖比例自適應，永不裁切
               border-radius 20px + mask 羽化 → 柔邊矩形 */
  .pw-slot { position: absolute; pointer-events: auto; will-change: transform;
             animation: pwFade .8s ease both; }
  @keyframes pwFade { from { opacity: 0 } to { opacity: 1 } }

  .pw-float {
    display: block;
    animation: floaty 9s ease-in-out infinite alternate;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.55));
    transition: filter .3s ease;
    will-change: transform, filter;
  }
  @keyframes floaty { from { transform: translateY(0) } to { transform: translateY(-16px) } }

  .pw-main {
    display: block; margin: 0 auto;
    /* 只給最大值、寬高都 auto → 瀏覽器等比縮到剛好，元素本身就是原圖比例 */
    max-width: 100%;
    max-height: min(22vh, 200px);
    width: auto; height: auto;
    object-fit: contain;              /* 完整顯示，絕不裁切 */
    border-radius: 20px;
    transition: transform .3s ease, filter .3s ease;
    will-change: transform;
    /* 柔邊羽化：邊緣淡出一點點，不會像貼紙硬邊 */
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
  }
  .pw-float:hover .pw-main { transform: scale(1.05); filter: brightness(1.12) saturate(1.06); }
  .pw-float:hover { filter: drop-shadow(0 14px 40px rgba(236,72,153,.55)); }

  /* 中央主視覺大圖：同樣不鎖比例，只給最大高寬 */
  .hero-wrap {
    display: block;
    filter: drop-shadow(0 16px 44px rgba(0,0,0,.65));
    transition: filter .3s ease;
  }
  .hero-wrap:hover { filter: drop-shadow(0 20px 56px rgba(236,72,153,.5)); }
  .hero-img {
    display: block;
    max-width: min(90vw, 640px);
    max-height: 26vh;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 24px;
    transition: transform .3s ease;
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
  }
  .hero-wrap:hover .hero-img { transform: scale(1.05); }

  /* ---------- 封面：鎖死單一螢幕，絕不出現捲軸 ---------- */
  body.no-scroll { overflow: hidden !important; height: 100%; }
  .cover-root {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  .cover-stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(6px, 1.4vh, 18px);
    padding: clamp(8px, 2vh, 28px) 4vw;
    text-align: center;
    pointer-events: none;
  }
  .cover-title {
    font-size: clamp(26px, min(8.2vh, 9vw), 84px);
    line-height: 1.04;
    font-weight: 900;
    margin: 0;
  }
  .cover-sub  { font-size: clamp(10px, 1.7vh, 16px); }
  .cover-hint { font-size: clamp(9px, 1.3vh, 12px); }
  .cover-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  @media (max-height: 560px) { .cover-stats, .cover-hint { display: none; } }
  @media (max-height: 440px) { .cover-sub { display: none; } }

  .fade-in { animation: fadeIn .45s ease backwards; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .fade-up-1 { animation: fadeIn .7s ease .10s backwards; }
  .fade-up-2 { animation: fadeIn .7s ease .28s backwards; }
  .fade-up-3 { animation: fadeIn .7s ease .46s backwards; }
  .pop{ animation: pop .3s cubic-bezier(.2,1.4,.4,1) backwards; }
  @keyframes pop { from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)} }

  .pixelated { image-rendering: pixelated; image-rendering: -moz-crisp-edges; }
  input[type=range]{ accent-color:#ec4899; }
  input[type=range].ui-range { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, #f472b6, #c026d3 var(--p, 50%), rgba(255,255,255,.12) var(--p, 50%)); }
  input[type=range].ui-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 4px rgba(236,72,153,.35), 0 2px 8px rgba(0,0,0,.5); transition: transform .15s; }
  input[type=range].ui-range::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range].ui-range::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 4px rgba(236,72,153,.35), 0 2px 8px rgba(0,0,0,.5); }
  .flash-ring{ box-shadow:0 0 0 2px rgba(236,72,153,.55), 0 0 44px rgba(236,72,153,.28); }
  .scroll-thin::-webkit-scrollbar{ width:8px; height:8px }
  .scroll-thin::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:8px }

  /* 柔邊矩形圖片：只給最大寬高、寬高都 auto → 原比例完整顯示，永不裁切 */
  .soft-img {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 16px;
    -webkit-mask-image: radial-gradient(122% 122% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(122% 122% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
  }

  /* ---------- 標題／光環／背景推鏡 ----------
     這幾個是自訂類別，不是 Tailwind 產生的，所以直接寫在這裡，
     重新編譯 styles.css 也不會被洗掉。 */
  .title-glow {
    background: linear-gradient(100deg,#ffffff 0%,#fbcfe8 26%,#f0abfc 48%,#a5f3fc 74%,#ffffff 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(236,72,153,.45));
    animation: titleSheen 7s ease-in-out infinite;
  }
  @keyframes titleSheen { 0%,100%{ background-position: 0% 50% } 50%{ background-position: 100% 50% } }

  /* 主要按鈕的呼吸光暈（用 box-shadow，不會被按鈕的 overflow:hidden 切掉）*/
  .cta-ring { animation: ctaGlow 2.4s ease-in-out infinite; }
  @keyframes ctaGlow {
    0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,0), 0 10px 30px -10px rgba(236,72,153,.6); }
    50%     { box-shadow: 0 0 0 7px rgba(236,72,153,.16), 0 12px 44px -6px rgba(236,72,153,.85); }
  }

  .kenburns { animation: kenburnsMove 28s ease-in-out infinite alternate; transform-origin: 50% 45%; }
  @keyframes kenburnsMove { from{ transform:scale(1) } to{ transform:scale(1.14) translate3d(-1.5%,-1%,0) } }

  /* ======================================================================
     設計系統：毛玻璃、漸層細邊框、陰影、圓角、按鈕、轉場
     ----------------------------------------------------------------------
     所有畫面共用同一套「設計語彙」，顏色只靠 --acc1 / --acc2 兩個強調色切換
     （每一關一組顏色），其餘的圓角、陰影、玻璃質感、動畫節奏全部一致。
     ====================================================================== */
  :root {
    --acc1: 244 114 182;          /* 強調色 1（RGB，給 rgb(var(--acc1) / .5) 用）*/
    --acc2: 103 232 249;          /* 強調色 2 */
    --ease-out: cubic-bezier(.2,.8,.2,1);
    --ease-spring: cubic-bezier(.2,.9,.3,1.15);
    --glass-bg: linear-gradient(155deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.035) 45%, rgba(255,255,255,.02) 100%);
    --glass-blur: blur(18px) saturate(140%);
    --glass-shadow: 0 22px 50px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.10);
  }
  /* 每一關自己的強調色 */
  [data-lv="level1"] { --acc1: 244 114 182; --acc2: 251 146 60; }
  [data-lv="level2"] { --acc1: 232 121 249; --acc2: 167 139 250; }
  [data-lv="level3"] { --acc1: 129 140 248; --acc2: 56 189 248; }
  [data-lv="level4"] { --acc1: 34 211 238;  --acc2: 45 212 191; }
  [data-lv="level5"] { --acc1: 110 231 183; --acc2: 103 232 249; }

  /* 毛玻璃卡片（主選單、結算、彈窗、題目卡共用）*/
  .ui-card, .lv-glass {
    position: relative; border-radius: 24px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
  }
  .lv-glass { border-radius: 22px; }
  /* 漸層細邊框：用 mask 挖空中間，只留 1px 的光邊 */
  .ui-card::before, .lv-glass::before, .lv-qcard::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(140deg, rgb(var(--acc1) / .55), rgba(255,255,255,.07) 38%, rgba(255,255,255,.05) 62%, rgb(var(--acc2) / .45));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    transition: opacity .4s ease;
  }
  .ui-card.is-on::before { background: linear-gradient(140deg, rgb(var(--acc1) / .95), rgba(255,255,255,.12) 40%, rgb(var(--acc2) / .8)); }
  .ui-card.is-on { box-shadow: var(--glass-shadow), 0 0 40px -14px rgb(var(--acc1) / .55); }

  /* 頂列／底列：深色毛玻璃 */
  .ui-bar {
    background: linear-gradient(180deg, rgba(12,7,26,.78), rgba(12,7,26,.55));
    -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 12px 30px -20px rgba(0,0,0,.9);
  }
  .ui-bar.top    { border-bottom: 1px solid rgba(255,255,255,.08); }
  .ui-bar.bottom { border-top: 1px solid rgba(255,255,255,.08); box-shadow: 0 -12px 30px -20px rgba(0,0,0,.9); }

  /* 按鈕：滑過時有一道光掃過、輕微浮起；按下回彈 */
  .ui-btn { position: relative; overflow: hidden; isolation: isolate;
            transition: transform .18s var(--ease-out), box-shadow .25s ease, filter .25s ease, background-color .2s ease, opacity .2s ease; }
  .ui-btn::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; z-index: -1; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
    transform: skewX(-18deg); opacity: 0;
  }
  .ui-btn:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.07) saturate(1.05); }
  .ui-btn:not(:disabled):hover::after { animation: btnSheen .75s ease forwards; }
  .ui-btn:not(:disabled):active { transform: translateY(0) scale(.965); transition-duration: .08s; }
  .ui-btn:focus-visible { outline: 2px solid rgb(var(--acc2) / .9); outline-offset: 2px; }
  @keyframes btnSheen { from { left: -60%; opacity: 1; } to { left: 130%; opacity: 1; } }

  /* 進度條：有光暈 */
  .ui-progress { position: relative; height: 6px; border-radius: 999px; background: rgba(255,255,255,.09); overflow: hidden; }
  .ui-progress > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit;
    background: linear-gradient(90deg, rgb(var(--acc1)), rgb(var(--acc2)));
    box-shadow: 0 0 14px rgb(var(--acc1) / .7); transition: width .6s var(--ease-out); }

  /* ---------- 畫面切換（封面 ⇄ 主選單 ⇄ 挑戰 ⇄ 結算）：交叉淡入淡出 ----------
     注意：進場動畫只用 fill-mode: backwards —— 動畫結束後元素身上「不殘留」transform，
     否則 position:fixed 的子元素（背景、拖曳中的名牌）會被錯誤地以這一層為定位基準。 */
  .screen-layer { position: relative; }
  .screen-in  { animation: screenIn .55s var(--ease-out) backwards; }
  .screen-out { position: fixed; inset: 0; z-index: 60; overflow: hidden; pointer-events: none;
                animation: screenOut .42s ease forwards; }
  @keyframes screenIn  { from { opacity: 0; transform: scale(.985); filter: blur(6px); } }
  @keyframes screenOut { to   { opacity: 0; transform: scale(1.02); filter: blur(8px); } }

  /* ---------- 題目切換：往前滑出、從另一邊滑入 ---------- */
  .q-stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .q-in-r  { animation: qInR .42s var(--ease-out) backwards; }
  .q-in-l  { animation: qInL .42s var(--ease-out) backwards; }
  .q-out-l { animation: qOutL .2s ease-in forwards; pointer-events: none; }
  .q-out-r { animation: qOutR .2s ease-in forwards; pointer-events: none; }
  @keyframes qInR  { from { opacity: 0; transform: translateX(40px) scale(.985); } }
  @keyframes qInL  { from { opacity: 0; transform: translateX(-40px) scale(.985); } }
  @keyframes qOutL { to { opacity: 0; transform: translateX(-30px) scale(.985); } }
  @keyframes qOutR { to { opacity: 0; transform: translateX(30px) scale(.985); } }

  /* ======================================================================
     所有關卡：單一螢幕、絕不捲動的版面
     ----------------------------------------------------------------------
     整個題目頁鎖在 100dvh：頂列 / 題目區 / 按鈕 / 計分列 由 flex 分配高度，
     題目區裡的 .lv-stage、.l5-shots、.lv-media 都是 container-type:size 的「尺寸容器」，
     裡面的照片、影片、截圖用 cqw / cqh 算出「剛好塞得下、又盡量大」的尺寸：
       · 先依容器長寬比挑版型
       · 再用 min(寬度限制, 高度限制) 算出尺寸
     所以不論手機直式、橫式、平板或大螢幕，都不會出現捲軸。
     ====================================================================== */
  .fit-screen { position: relative; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  .lv-root {
    flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column;
    gap: clamp(6px, 1.2vh, 12px);
    --g: clamp(6px, 1.1vmin, 12px);           /* 格子間距 */
  }

  /* ---------- 出題卡 ----------
     毛玻璃底畫在 ::after，送出答案時可以單獨淡出，上面的照片／影片留著接著「飛」到答案卡 */
  .lv-qcard {
    position: relative; isolation: isolate; border-radius: 22px;
    flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column;
    gap: clamp(4px, .9vh, 10px);
    padding: clamp(6px, 1.2vh, 12px) clamp(8px, 1.2vw, 14px);
  }
  .lv-qcard::after {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
    transition: opacity .4s ease;
  }
  .lv-qhead { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; }
  .lv-kicker { font-weight: 900; letter-spacing: .14em; color: rgb(var(--acc1)); font-size: 11px; white-space: nowrap; }
  .lv-dots { display: inline-flex; gap: 5px; flex: none; }
  .lv-dots i { display: block; width: 18px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.14); transition: background .4s, box-shadow .4s; }
  .lv-dots i.on { background: linear-gradient(90deg, rgb(var(--acc1)), rgb(var(--acc2))); box-shadow: 0 0 10px rgb(var(--acc1) / .6); }
  .lv-qhint { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .lv-qhead .lv-chip { margin-left: auto; flex: none; }
  .lv-qfoot { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .lv-pill {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    color: #cbd5e1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  }

  /* 出題卡中間的舞台：尺寸容器 */
  .lv-stage {
    flex: 1 1 0; min-height: 0; width: 100%;
    container-type: size; container-name: lvstage;
    display: grid; place-items: center;
  }

  /* 單張照片／影片外框：內容 object-fit:contain → 永不裁切 */
  .lv-frame {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    border-radius: clamp(10px, 1.4vmin, 16px);
    background: radial-gradient(120% 120% at 50% 0%, #1a1030 0%, #08050f 70%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 14px 32px -14px rgba(0,0,0,.85);
    container-type: inline-size;
    padding: 0; border: 0; color: inherit; font: inherit; text-align: center;
  }
  .lv-frame > img, .lv-frame > video, .lv-frame > canvas, .lv-frame > .lv-fill {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  .lv-frame > img { transition: transform .5s var(--ease-out), filter .5s; -webkit-user-drag: none; user-select: none; }
  .lv-frame > video { background: #000; }
  .lv-frame.is-open { cursor: zoom-in; }
  .lv-frame.is-open:hover > img { transform: scale(1.035); filter: brightness(1.08); }
  .lv-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #64748b; font-size: 11px; padding: 6px; }

  .lv-tag {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .06em; line-height: 1.5;
    color: #ecfeff; background: rgba(8,5,15,.62); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    pointer-events: none; white-space: nowrap;
  }
  .lv-tag.r { left: auto; right: 8px; color: #fde68a; border-color: rgba(251,191,36,.38); }
  .lv-tag.mv { color: rgb(var(--acc1)); border-color: rgb(var(--acc1) / .45); }
  @container (max-width: 160px) {
    .lv-tag { font-size: 9px; padding: 0 6px; left: 5px; top: 5px; }
    .lv-tag.r { left: auto; right: 5px; }
    .l5-lock-sub, .l4-drop-hint small { display: none; }
  }

  /* 2×2 版型第四格的小卡 */
  .lv-tile { display: none; }
  .lv-tile {
    position: relative; min-width: 0; min-height: 0;
    border-radius: clamp(10px, 1.4vmin, 16px);
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: 2px; padding: 6px; container-type: inline-size;
    background: linear-gradient(145deg, rgb(var(--acc1) / .16), rgb(var(--acc2) / .08) 55%, rgba(168,85,247,.10));
    box-shadow: inset 0 0 0 1px rgb(var(--acc1) / .25);
  }
  .lv-tile-big {
    font-size: clamp(18px, 20cqw, 56px); font-weight: 900; line-height: 1;
    background: linear-gradient(90deg, rgb(var(--acc1)), rgb(var(--acc2)));
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  }
  .lv-tile-big small { font-size: .5em; opacity: .75; }
  .lv-tile-txt { font-size: clamp(10px, 7cqw, 15px); font-weight: 800; color: #e2e8f0; }
  .lv-tile-sub { font-size: clamp(9px, 5.6cqw, 12px); color: #94a3b8; }

  /* ---------- 作答區（兩段式）---------- */
  .lv-answer {
    flex: none; max-height: 62%;
    overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;
    padding: clamp(6px, 1.2vh, 12px) clamp(8px, 1.4vw, 16px);
  }
  .lv-attempts {
    flex: none; margin-left: auto;
    padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap;
    color: #fecdd3; background: rgba(244,63,94,.16); border: 1px solid rgba(251,113,133,.4);
  }
  .lv-ahead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-width: 0; margin-bottom: clamp(4px, .8vh, 8px); }
  .lv-ahint { flex: 1 1 140px; min-width: 0; font-size: 12px; font-weight: 700; color: #fda4af;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv-igrid { display: grid; gap: clamp(4px, .8vh, 8px); grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 1024px) { .lv-igrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* 成員很多的團（例如 tripleS 二十幾位）：自動多欄、按鈕縮小，一樣塞得進一個畫面 */
  .lv-igrid.many { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(3px, .6vh, 6px); }
  @media (min-width: 768px)  { .lv-igrid.many { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .lv-igrid.many { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .lv-igrid.lots { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .lv-igrid.many .lv-ibtn { padding: clamp(3px, .7vh, 7px) 6px; font-size: clamp(11px, 1.5vh, 13px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv-igrid.many .lv-ikey { display: none; }
  /* 名單很長時，作答區可以多佔一點高度（題目圖會自動縮小），還是不會出現捲軸 */
  .lv-answer:has(.lv-igrid.lots), .lv-answer:has(.l4-chips.many) { max-height: 74%; }
  @media (max-height: 700px) {
    .lv-igrid.lots .lv-ibtn { padding-top: 3px; padding-bottom: 3px; }
    .l4-chips.many .chip { padding-top: 3px; padding-bottom: 3px; }
  }
  .lv-ggrid { display: grid; gap: clamp(4px, .8vh, 8px); grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (min-width: 560px) { .lv-ggrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 768px), (min-width: 560px) and (max-height: 560px) {
    .lv-ggrid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (min-width: 1100px) { .lv-ggrid.many { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .lv-gbtn, .lv-ibtn { transition: transform .15s var(--ease-out), background-color .2s, border-color .2s, box-shadow .25s, color .2s; }
  .lv-gbtn { padding: clamp(5px, 1.1vh, 10px) 6px; font-size: clamp(12px, 1.7vh, 15px); border-radius: 12px; line-height: 1.2;
             overflow-wrap: normal; word-break: normal; }
  /* 手機直放：團名縮小一點，避免「BABYMONSTER」「Hearts2Hearts」從字中間斷行 */
  @media (max-width: 559px) { .lv-gbtn { font-size: min(13px, 2.95vw); letter-spacing: -.015em; padding-left: 3px; padding-right: 3px; } }
  @media (min-width: 768px) { .lv-gbtn { font-size: clamp(11px, min(1.7vh, 1.45vw), 15px); } }
  .lv-ibtn { padding: clamp(6px, 1.2vh, 11px) 10px; font-size: clamp(12px, 1.8vh, 15px); border-radius: 12px; line-height: 1.25; }
  .lv-gbtn:not(:disabled):hover, .lv-ibtn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgb(var(--acc1) / .6); border-color: rgb(var(--acc1) / .45); }

  /* 手機橫放／矮螢幕：題目在左、作答區在右，左右並排 */
  @media (max-height: 560px) and (min-aspect-ratio: 3/2) {
    .lv-root { flex-direction: row; }
    .lv-qcard { min-width: 0; }
    .lv-answer { flex: 0 0 auto; width: min(50%, 460px); max-height: 100% !important; align-self: center; }
    .lv-ggrid, .lv-ggrid.many { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .lv-gbtn { font-size: 11px; padding-left: 2px; padding-right: 2px; letter-spacing: -.02em; }
    .lv-igrid.lots .lv-ibtn { padding: 2px 3px; line-height: 1.15; font-size: 10.5px; letter-spacing: -.02em; }
    .l4-chips.many .chip { padding: 1px 6px; font-size: 10.5px; line-height: 1.35; border-radius: 8px; }
    .l4-chips.many { gap: 3px; }
    .lv-answer .lv-step-txt { display: none; }          /* 只留步驟數字，讓標題列維持一行 */
    /* 第四關：名牌和「確認作答」接在同一串，省下一整列的高度 */
    .l4-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
    .l4-flow > .l4-chips, .l4-flow > .l4-actions { display: contents; }
    .l4-actions { margin-top: 5px; }
    .lv-igrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lv-igrid.many { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .lv-igrid.lots { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .lv-hide-short { display: none; }
    .lv-answer .lv-selgrp { padding: 2px 9px !important; font-size: 12px !important; }
    .lv-answer .lv-attempts { padding: 1px 7px; font-size: 10px; }
    .l4-actions .fit-btn { padding: 3px 10px !important; font-size: 12.5px !important; }
  }
  /* 矮螢幕：頂列按鈕、計分列再縮小一點，把高度留給圖片 */
  @media (max-height: 560px) {
    .fit-btn { padding: 5px 14px !important; font-size: 14px !important; border-radius: 10px !important; }
    .fit-team { padding: 2px 6px !important; }
    .fit-team-info { display: flex; align-items: baseline; gap: 6px; }
    .lv-qfoot .ui-btn { padding-top: 6px !important; padding-bottom: 6px !important; font-size: 14px !important; }
  }

  /* ======================================================================
     第一關：照片閃現
     ====================================================================== */
  .l1-photo { width: min(100cqw, calc(100cqh * var(--ar, .8))); aspect-ratio: var(--ar, .8); }
  .l1-photo.is-flash { box-shadow: 0 0 0 2px rgb(var(--acc1) / .8), 0 0 50px -6px rgb(var(--acc1) / .6); }
  .l1-photo > img.l1-in { animation: l1Flash .35s ease-out backwards; }
  @keyframes l1Flash { from { opacity: 0; filter: brightness(2.2) blur(6px); transform: scale(1.04); } }
  .l1-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
             color: #94a3b8; font-size: clamp(11px, 4.4cqw, 14px); padding: 10px; }
  .l1-wait-ico { font-size: clamp(36px, 26cqw, 84px); line-height: 1; animation: l1Breathe 2.6s ease-in-out infinite; }
  @keyframes l1Breathe { 0%,100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
  .l1-count { position: absolute; inset: 0; display: grid; place-items: center;
              font-size: clamp(48px, 42cqw, 160px); font-weight: 900; line-height: 1;
              background: linear-gradient(180deg, #fff, rgb(var(--acc1))); -webkit-background-clip: text; background-clip: text;
              color: transparent; -webkit-text-fill-color: transparent;
              animation: l1Count .7s var(--ease-spring) backwards; }
  @keyframes l1Count { from { opacity: 0; transform: scale(1.6); filter: blur(8px); } }

  /* ======================================================================
     第二關：黑膠唱片 + 跳動的等化器
     ====================================================================== */
  .l2-disc { position: relative; width: min(74cqmin, 300px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
  .l2-vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgb(var(--acc1) / .9) 0 15%, #0b0714 15.5% 17%, transparent 17.5%),
      repeating-radial-gradient(circle at 50% 50%, #120a22 0 2px, #1b1131 2px 4px),
      #120a22;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 60px -20px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.7);
    transition: box-shadow .5s ease;
  }
  .l2-vinyl::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.10) 25%, transparent 32% 70%, rgba(255,255,255,.08) 75%, transparent 82%); }
  .l2-disc.is-playing .l2-vinyl { animation: l2Spin 3.2s linear infinite; box-shadow: 0 0 0 1px rgb(var(--acc1) / .5), 0 0 60px -6px rgb(var(--acc1) / .55), inset 0 0 40px rgba(0,0,0,.7); }
  @keyframes l2Spin { to { transform: rotate(360deg); } }
  .l2-ico { position: relative; z-index: 2; font-size: clamp(20px, 10cqmin, 40px); filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  .l2-eq { position: absolute; left: 50%; bottom: -2%; transform: translateX(-50%); z-index: 3;
           display: flex; align-items: flex-end; gap: 4px; height: 18%; opacity: 0; transition: opacity .3s; }
  .l2-eq i { display: block; width: 6px; height: 100%; border-radius: 4px; transform-origin: bottom;
             background: linear-gradient(180deg, rgb(var(--acc2)), rgb(var(--acc1))); box-shadow: 0 0 10px rgb(var(--acc1) / .6);
             transform: scaleY(.25); }
  .l2-disc.is-playing .l2-eq { opacity: 1; }
  .l2-disc.is-playing .l2-eq i { animation: l2Eq .9s ease-in-out infinite alternate; }
  @keyframes l2Eq { 0% { transform: scaleY(.2); } 50% { transform: scaleY(1); } 100% { transform: scaleY(.45); } }
  .l2-ring { position: absolute; inset: -6%; border-radius: 50%; border: 2px solid rgb(var(--acc1) / .5); opacity: 0; pointer-events: none; }
  .l2-disc.is-playing .l2-ring { animation: l2Ring 1.8s ease-out infinite; }
  .l2-disc.is-playing .l2-ring + .l2-ring { animation-delay: .9s; }
  @keyframes l2Ring { from { opacity: .7; transform: scale(.92); } to { opacity: 0; transform: scale(1.18); } }

  /* ======================================================================
     第三關：舞蹈影片
     ====================================================================== */
  .l3-video { width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  .l3-video .lv-fill { image-rendering: auto; }

  /* ======================================================================
     第四關：手燈＋眼睛＋嘴巴
     版型：手燈在左（直的，跨兩列）、眼睛和嘴巴疊在右邊（橫的 2:1）
       --e  = 眼睛／嘴巴格子的寬度
       手燈格子寬 = (--e + 間距) × 0.6
     ====================================================================== */
  .l4-board {
    --e: min(calc((100cqw - 1.6 * var(--g)) / 1.6), calc(100cqh - var(--g)));
    display: grid; gap: var(--g);
    grid-template-columns: calc((var(--e) + var(--g)) * .6) var(--e);
    grid-template-rows: repeat(2, calc(var(--e) / 2));
  }
  .l4-board > .l4-ls { grid-row: 1 / span 2; }
  .l4-feat > img { padding: 4px; }
  .l4-ls > img { padding: 6px; }
  /* 第二步：眼睛／嘴巴格子就是放置區 */
  .l4-zone { cursor: pointer; transition: transform .18s var(--ease-out), box-shadow .2s ease; }
  .l4-zone::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                    border: 2px dashed rgba(255,255,255,.22); transition: border-color .2s, opacity .2s; }
  .l4-zone.is-filled::after { border-style: solid; border-color: rgb(var(--acc1) / .5); }
  .l4-zone.is-armed::after { border-color: rgb(var(--acc2) / .8); animation: l4Armed 1.2s ease-in-out infinite; }
  @keyframes l4Armed { 50% { opacity: .45; } }
  .l4-zone.zone-hot { transform: scale(1.03); box-shadow: 0 0 0 3px rgb(var(--acc1) / .75), 0 0 34px rgb(var(--acc1) / .45); }
  .l4-zone.zone-hot::after { border-color: transparent; }
  .l4-zone.glow-ok::after  { border: 2px solid rgba(52,211,153,.85); }
  .l4-zone.glow-bad::after { border: 2px solid rgba(244,63,94,.85); }
  .l4-slot {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 3;
    max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 3px 12px; border-radius: 999px; font-weight: 900; font-size: clamp(11px, 6.5cqw, 16px);
    color: #fff; background: linear-gradient(90deg, rgb(var(--acc1) / .85), rgb(var(--acc2) / .75));
    box-shadow: 0 8px 22px -8px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.25);
    pointer-events: none;
  }
  .l4-slot.ok  { background: linear-gradient(90deg, rgba(16,185,129,.9), rgba(20,184,166,.8)); }
  .l4-slot.bad { background: linear-gradient(90deg, rgba(225,29,72,.9), rgba(244,63,94,.8)); }
  .l4-slot.grp { background: rgba(8,5,15,.72); border: 1px solid rgba(251,191,36,.55); color: #fde68a; box-shadow: 0 8px 22px -8px rgba(0,0,0,.8); }
  .l4-drop-hint {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 3; white-space: nowrap;
    padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    color: #e2e8f0; background: rgba(8,5,15,.62); border: 1px dashed rgba(255,255,255,.3); pointer-events: none;
  }
  .l4-chips { display: flex; flex-wrap: wrap; gap: clamp(5px, .8vh, 8px); }
  .chip {
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    cursor: grab; padding: clamp(5px, 1vh, 8px) 13px; border-radius: 12px;
    font-size: clamp(12px, 1.7vh, 14px); font-weight: 800; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.09); color: #f1f5f9;
    box-shadow: 0 6px 16px -10px rgba(0,0,0,.8);
    transition: transform .16s var(--ease-out), box-shadow .2s ease, opacity .16s ease, background-color .2s;
  }
  .chip:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); box-shadow: 0 10px 22px -10px rgb(var(--acc1) / .7); }
  .chip:active { cursor: grabbing; }
  .chip.is-used { opacity: .45; border-style: dashed; background: rgba(255,255,255,.04); color: #94a3b8; }
  .chip.is-sel { color: #fff; border-color: rgb(var(--acc1) / .9); transform: translateY(-2px) scale(1.05);
                 background: linear-gradient(90deg, rgb(var(--acc1) / .9), rgb(var(--acc2) / .8));
                 box-shadow: 0 10px 26px -8px rgb(var(--acc1) / .8); }
  .chip.is-dragging { opacity: .35; transform: scale(.96); }
  .l4-chips.many { gap: 4px; }
  .l4-chips.many .chip { padding: clamp(3px, .6vh, 6px) 8px; font-size: clamp(11px, 1.5vh, 13px); border-radius: 10px; }
  .l4-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: clamp(6px, 1vh, 10px); }
  .l4-tip { font-size: 11px; color: #94a3b8; min-width: 0; flex: 1 1 200px; }
  @media (max-height: 560px) { .l4-tip { display: none; } }

  /* 拖曳中的名牌：用 portal 掛在 <body>，位置 = 指標座標 − 自身寬高的一半，永遠正中對齊游標／手指 */
  .chip-ghost { position: fixed; left: 0; top: 0; z-index: 95; pointer-events: none; will-change: transform; }
  .chip-ghost-in {
    padding: 8px 16px; border-radius: 14px; white-space: nowrap;
    font-size: 15px; font-weight: 900; color: #fff;
    background: linear-gradient(90deg, rgb(var(--acc1)), rgb(var(--acc2)));
    border: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 18px 40px -8px rgba(0,0,0,.75), 0 0 30px -4px rgb(var(--acc1) / .7);
    transform: scale(1.08) rotate(-2deg);      /* 以自身中心縮放旋轉 → 中心點不會跑掉 */
    animation: ghostIn .16s var(--ease-spring) backwards;
  }
  @keyframes ghostIn { from { transform: scale(.7) rotate(0); opacity: .4; } }

  .drop-zone { transition: transform .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .shake { animation: shakeX .42s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeX {
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
  }
  .glow-ok  { box-shadow: 0 0 0 2px rgba(52,211,153,.65), 0 0 30px rgba(52,211,153,.28); }
  .glow-bad { box-shadow: 0 0 0 2px rgba(244,63,94,.65),  0 0 30px rgba(244,63,94,.28); }

  /* ======================================================================
     第五關：三張截圖逐步解鎖
     ====================================================================== */
  .l5-shots {
    flex: 1 1 0; min-height: 0; width: 100%;
    container-type: size; container-name: l5shots;
    display: grid; place-items: center;
  }
  .l5-strip { display: grid; gap: var(--g); width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .l5-strip > .lv-frame { aspect-ratio: 16 / 9; }
  @container l5shots (aspect-ratio >= 8/3) {
    .l5-strip { --s: min(calc((100cqw - 2 * var(--g)) / 3), calc(100cqh * 16 / 9));
                width: auto; grid-template-columns: repeat(3, var(--s)); grid-template-rows: calc(var(--s) * 9 / 16); }
    .l5-strip > .lv-frame { aspect-ratio: auto; }
  }
  @container l5shots (aspect-ratio < 8/3) and (aspect-ratio >= 32/27) {
    .l5-strip { --s: min(calc((100cqw - var(--g)) / 2), calc((100cqh - var(--g)) * 8 / 9));
                width: auto; grid-template-columns: repeat(2, var(--s)); grid-template-rows: repeat(2, calc(var(--s) * 9 / 16)); }
    .l5-strip > .lv-frame { aspect-ratio: auto; }
    .l5-strip > .lv-tile { display: flex; }
  }
  @container l5shots (aspect-ratio < 32/27) {
    .l5-strip { --s: min(100cqw, calc((100cqh - 2 * var(--g)) * 16 / 27));
                width: auto; grid-template-columns: var(--s); grid-template-rows: repeat(3, calc(var(--s) * 9 / 16)); }
    .l5-strip > .lv-frame { aspect-ratio: auto; }
  }
  .lv-frame.is-locked {
    cursor: pointer;
    background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.13);
    transition: box-shadow .3s ease, transform .3s ease;
  }
  .lv-frame.is-locked::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.08) 50%, transparent 70%);
    background-size: 250% 100%;
    animation: lvShimmer 2.8s linear infinite;
  }
  .lv-frame.is-locked.is-next { box-shadow: inset 0 0 0 1.5px rgb(var(--acc1) / .5), 0 0 26px -8px rgb(var(--acc1) / .6); }
  .lv-frame.is-locked:hover { box-shadow: inset 0 0 0 1.5px rgb(var(--acc1) / .8), 0 0 30px -6px rgb(var(--acc1) / .65); transform: translateY(-1px); }
  .l5-lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; }
  .l5-lock-ico { font-size: clamp(16px, 12cqw, 40px); line-height: 1.1; transition: transform .3s; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  .lv-frame.is-locked:hover .l5-lock-ico { transform: translateY(-2px) scale(1.08) rotate(-6deg); }
  .l5-lock-txt { font-size: clamp(10px, 6.4cqw, 15px); font-weight: 800; color: #e2e8f0; }
  .l5-lock-sub { font-size: clamp(9px, 4.6cqw, 11px); color: #94a3b8; }
  .lv-unlock > img { animation: lvUnlock .7s var(--ease-out) backwards; }
  @keyframes lvUnlock { from { opacity: 0; transform: scale(1.08); filter: blur(14px) brightness(1.5); } to { opacity: 1; transform: none; filter: none; } }
  .lv-frame > img.lv-fresh { animation: lvUnlock .9s var(--ease-out) .5s backwards; }

  /* ======================================================================
     公布答案：答案卡（所有關卡共用的骨架）
     ----------------------------------------------------------------------
     .lv-media 是填滿題目區的尺寸容器；裡面的 .lv-comp 就是那張毛玻璃答案卡，
     卡片本身的大小 = 內容剛好需要的大小，然後置中 → 卡片裡不會有大塊空白，也絕不會超出螢幕。
       --pad 卡片內距　--g 格子間距　--th 標題列高度　--tw 側欄標題寬度
       --W / --H 扣掉內距之後可用的寬高
     ====================================================================== */
  .lv-media {
    flex: 1 1 0; min-height: 0; width: 100%;
    container-type: size; container-name: lvmedia;
    display: grid; place-items: center;
  }
  .lv-comp {
    --pad: clamp(8px, 1.4vmin, 16px);
    --th: clamp(52px, 9cqh, 76px);
    --tw: clamp(140px, 22cqw, 260px);
    --W: calc(100cqw - 2 * var(--pad));
    --H: calc(100cqh - 2 * var(--pad));
    position: relative; isolation: isolate;
    display: grid; gap: var(--g); padding: var(--pad);
    border-radius: 24px; width: 100%;
  }
  .lv-comp > .lv-title { grid-column: 1 / -1; }
  @container lvmedia (width < 600px) { .lv-comp { --th: 80px; } }

  .lv-card-bg { position: absolute; inset: 0; z-index: -1; border-radius: inherit; }
  .lv-tone-ok   > .lv-card-bg { box-shadow: 0 30px 70px -24px rgba(0,0,0,.75), 0 0 70px -18px rgba(52,211,153,.55),  inset 0 1px 0 rgba(255,255,255,.12); }
  .lv-tone-bad  > .lv-card-bg { box-shadow: 0 30px 70px -24px rgba(0,0,0,.75), 0 0 70px -18px rgba(244,63,94,.45),  inset 0 1px 0 rgba(255,255,255,.12); }
  .lv-tone-info > .lv-card-bg { box-shadow: 0 30px 70px -24px rgba(0,0,0,.75), 0 0 70px -18px rgba(34,211,238,.45), inset 0 1px 0 rgba(255,255,255,.12); }

  /* ① 第二／三關：標題 + 一支 16:9 答案影片 */
  .rv-solo { --vw: min(var(--W), calc((var(--H) - var(--th) - var(--g)) * 16 / 9));
             width: auto; grid-template-columns: var(--vw); grid-template-rows: var(--th) calc(var(--vw) * 9 / 16); }
  @container lvmedia (aspect-ratio >= 2.6) {
    .rv-solo { --vw: min(calc(var(--W) - var(--tw) - var(--g)), calc(var(--H) * 16 / 9));
               grid-template-columns: var(--tw) var(--vw); grid-template-rows: calc(var(--vw) * 9 / 16); }
    .rv-solo > .lv-title { grid-column: 1; grid-row: 1; }
  }

  /* ② 第一關：照片（依原圖比例 --ar）+ 名字 */
  .rv-photo { --ih: 96px;
              --pw: min(var(--W), calc((var(--H) - var(--ih) - var(--g)) * var(--ar, .8)));
              width: auto; grid-template-columns: var(--pw); grid-template-rows: var(--ih) calc(var(--pw) / var(--ar, .8)); }
  @container lvmedia (aspect-ratio >= 1) {
    .rv-photo { --iw: clamp(170px, 28cqw, 360px);
                --pw: min(calc(var(--H) * var(--ar, .8)), calc(var(--W) - var(--iw) - var(--g)));
                grid-template-columns: var(--iw) var(--pw); grid-template-rows: max(calc(var(--pw) / var(--ar, .8)), min(170px, var(--H))); }
    .rv-photo > .lv-title { grid-column: 1; grid-row: 1; }
    .rv-photo > .rv-main { align-self: center; height: calc(var(--pw) / var(--ar, .8)); }
  }

  /* ③ 第四關：手燈 / 眼睛 / 嘴巴 三張（4:5）+ 底下名字 */
  .rv-trio { --cap: 44px;
             --s: min(calc((var(--W) - 2 * var(--g)) / 3), calc((var(--H) - var(--th) - var(--g) - var(--cap)) * .8));
             width: auto; grid-template-columns: repeat(3, var(--s)); grid-template-rows: var(--th) calc(var(--s) * 1.25 + var(--cap)); }
  @container lvmedia (aspect-ratio >= 2.6) {
    .rv-trio { --s: min(calc((var(--W) - var(--tw) - 3 * var(--g)) / 3), calc((var(--H) - var(--cap)) * .8));
               grid-template-columns: var(--tw) repeat(3, var(--s)); grid-template-rows: calc(var(--s) * 1.25 + var(--cap)); }
    .rv-trio > .lv-title { grid-column: 1; grid-row: 1; }
  }
  @container lvmedia (aspect-ratio < 1.15) {
    .rv-trio { --cap: 40px;
               --s: min(calc((var(--W) - var(--g)) / 2), calc(((var(--H) - var(--th) - 2 * var(--g)) / 2 - var(--cap)) * .8));
               grid-template-columns: repeat(2, var(--s)); grid-template-rows: var(--th) repeat(2, calc(var(--s) * 1.25 + var(--cap))); }
    .rv-trio > .lv-tile { display: flex; }
  }
  .rv-cell { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) var(--cap); }
  .rv-cell > .lv-frame { min-height: 0; }
  .rv-cap { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-width: 0; line-height: 1.2; }
  .rv-cap b { font-size: clamp(13px, 2.2vh, 20px); font-weight: 900; color: #fff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-cap small { font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-cap small.ok { color: #6ee7b7; } .rv-cap small.bad { color: #fda4af; }

  /* ④ 第五關：影片 + 三張截圖 */
  .l5-comp { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .l5-comp > .l5-v { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
  .l5-comp > .l5-s { aspect-ratio: 16 / 9; }
  @container lvmedia (aspect-ratio >= 2.6) {
    .l5-comp {
      --s: min(calc((var(--H) - 2 * var(--g)) * 16 / 27), calc((var(--W) - var(--tw) - var(--g) * 50 / 9) / 4));
      width: auto;
      grid-template-columns: var(--tw) calc(var(--s) * 3 + var(--g) * 32 / 9) var(--s);
      grid-template-rows: repeat(3, calc(var(--s) * 9 / 16));
    }
    .l5-comp > .lv-title { grid-column: 1; grid-row: 1 / span 3; }
    .l5-comp > .l5-v { grid-column: 2; grid-row: 1 / span 3; aspect-ratio: auto; }
    .l5-comp > .l5-s { grid-column: 3; aspect-ratio: auto; }
  }
  @container lvmedia (aspect-ratio >= 1.5) and (aspect-ratio < 2.6) {
    .l5-comp {
      --s: min(calc((var(--H) - var(--th) - 3 * var(--g)) * 16 / 27), calc((var(--W) - var(--g) * 41 / 9) / 4));
      width: auto;
      grid-template-columns: calc(var(--s) * 3 + var(--g) * 32 / 9) var(--s);
      grid-template-rows: var(--th) repeat(3, calc(var(--s) * 9 / 16));
    }
    .l5-comp > .lv-title { grid-column: 1 / -1; grid-row: 1; }
    .l5-comp > .l5-v { grid-column: 1; grid-row: 2 / span 3; aspect-ratio: auto; }
    .l5-comp > .l5-s { grid-column: 2; aspect-ratio: auto; }
  }
  @container lvmedia (aspect-ratio >= 0.8) and (aspect-ratio < 1.5) {
    .l5-comp {
      --s: min(calc((var(--W) - 2 * var(--g)) / 3), calc((var(--H) - var(--th) - var(--g) * 25 / 8) * 4 / 9));
      width: auto;
      grid-template-columns: repeat(3, var(--s));
      grid-template-rows: var(--th) calc((var(--s) * 3 + var(--g) * 2) * 9 / 16) calc(var(--s) * 9 / 16);
    }
    .l5-comp > .lv-title { grid-row: 1; }
    .l5-comp > .l5-v { grid-row: 2; aspect-ratio: auto; }
    .l5-comp > .l5-s { grid-row: 3; aspect-ratio: auto; }
  }
  @container lvmedia (aspect-ratio < 0.8) {
    .l5-comp {
      --s: min(calc((var(--W) - var(--g)) / 2), calc((var(--H) - var(--th) - var(--g) * 57 / 16) * 4 / 9));
      width: auto;
      grid-template-columns: repeat(2, var(--s));
      grid-template-rows: var(--th) calc((var(--s) * 2 + var(--g)) * 9 / 16) repeat(2, calc(var(--s) * 9 / 16));
    }
    .l5-comp > .lv-title { grid-row: 1; }
    .l5-comp > .l5-v { grid-row: 2; aspect-ratio: auto; }
    .l5-comp > .l5-s { aspect-ratio: auto; }
    .l5-comp > .lv-tile { display: flex; }
    .l5-comp .lv-chip-stat { display: none; }
  }
  .lv-frame.is-main { cursor: zoom-in; }
  .lv-frame.is-picked { box-shadow: 0 0 0 2px rgb(var(--acc1) / .85), 0 14px 32px -14px rgba(0,0,0,.85); }

  /* ---------- 答案卡的標題列：團名、歌名／人名、判定 ---------- */
  .lv-title {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px 16px; padding: 0 4px;
  }
  .lv-title-main { min-width: 0; flex: 1 1 auto; }
  .lv-group {
    font-size: 12px; font-weight: 800; letter-spacing: .18em; line-height: 1.3;
    color: rgb(var(--acc1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lv-song {
    font-size: min(46px, calc(var(--th) * .55)); font-weight: 900; line-height: 1.14;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 2px;
    background: linear-gradient(92deg, #ffffff 0%, rgb(var(--acc1) / .85) 55%, rgb(var(--acc2)) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  }
  .lv-badges { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; max-width: 62%; }
  .lv-verdict { flex: none; padding: 4px 12px; border-radius: 999px; font-weight: 900; font-size: 14px; line-height: 1.4; white-space: nowrap;
                animation: verdictPop .5s var(--ease-spring) .35s backwards; }
  @keyframes verdictPop { from { opacity: 0; transform: scale(.6); } }
  .lv-verdict.ok   { color: #ecfdf5; background: linear-gradient(90deg, rgba(16,185,129,.55), rgba(20,184,166,.45)); box-shadow: 0 0 0 1px rgba(110,231,183,.55), 0 0 24px -4px rgba(52,211,153,.7); }
  .lv-verdict.bad  { color: #fff1f2; background: linear-gradient(90deg, rgba(225,29,72,.55), rgba(244,63,94,.4));   box-shadow: 0 0 0 1px rgba(253,164,175,.5), 0 0 24px -4px rgba(244,63,94,.6); }
  .lv-verdict.info { color: #ecfeff; background: linear-gradient(90deg, rgba(8,145,178,.55), rgba(99,102,241,.45));  box-shadow: 0 0 0 1px rgba(103,232,249,.5), 0 0 24px -4px rgba(34,211,238,.55); }
  .lv-chip {
    min-width: 0; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.4;
    color: #cbd5e1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lv-chip-stat { flex: none; }
  .lv-shine { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 14px; }
  .lv-shine::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 18%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.12), transparent);
    transform: translateX(-150%) skewX(-18deg);
    animation: lvShine 1.3s ease .8s 1 forwards;
  }
  /* 窄卡片（手機）：名字一行、判定一行 */
  @container lvmedia (width < 600px) {
    .lv-title { flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; }
    .lv-song { font-size: min(26px, 7cqw); }
    .lv-group { font-size: 11px; }
    .lv-badges { max-width: none; }
    .lv-verdict { font-size: 12.5px; padding: 3px 10px; }
    .lv-chip { font-size: 11px; padding: 3px 8px; }
  }
  /* 直向標題（側欄、第一關資訊欄）：上下排、名字可換行 */
  .lv-title.vert { flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; padding: 4px 2px; }
  @container lvmedia (aspect-ratio >= 2.6) {
    .lv-title { flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; padding: 4px 2px; }
  }
  @container lvmedia (aspect-ratio >= 2.6) {
    .lv-title-main { flex: none; width: 100%; }
    .lv-song { font-size: clamp(16px, calc(var(--tw) * .13), 30px); white-space: normal; word-break: break-word;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .lv-badges { flex-direction: column; align-items: flex-start; max-width: 100%; }
    .lv-verdict { font-size: 12.5px; padding: 3px 10px; }
    .lv-chip { font-size: 11px; padding: 3px 8px; max-width: 100%; }
  }
  .lv-title.vert .lv-title-main { flex: none; width: 100%; }
  .lv-title.vert .lv-song { font-size: clamp(22px, 4.2vmin, 46px); white-space: normal; word-break: break-word;
                            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lv-title.vert .lv-badges { flex-direction: column; align-items: flex-start; max-width: 100%; }
  .lv-title.vert .lv-chip { max-width: 100%; }
  @container lvmedia (aspect-ratio < 1) {
    .rv-photo > .lv-title.vert { align-items: stretch; gap: 4px; }
    .rv-photo > .lv-title.vert .lv-song { font-size: min(26px, 7cqw); -webkit-line-clamp: 1; }
    .rv-photo > .lv-title.vert .lv-badges { flex-direction: row; flex-wrap: wrap; }
  }

  /* ---------- 轉場動畫 ---------- */
  .lv-leaving { pointer-events: none; }
  .lv-leaving .lv-qcard::after, .lv-leaving .lv-qcard::before { opacity: 0; }
  .lv-leaving .lv-fadeable { animation: lvOut .32s cubic-bezier(.4,0,.2,1) .14s forwards; }
  .lv-leaving .l5-lock, .lv-leaving .l4-drop-hint { animation: lvOut .28s ease forwards; }
  @keyframes lvOut { to { opacity: 0; transform: translateY(12px) scale(.97); filter: blur(8px); } }
  .lv-bg-in { animation: lvBgIn .55s var(--ease-out) backwards; }
  @keyframes lvBgIn { from { opacity: 0; transform: scale(.965); } to { opacity: 1; transform: none; } }
  .lv-rise   { animation: lvRise .6s var(--ease-out) backwards; }
  .lv-rise-1 { animation: lvRise .6s var(--ease-out) .18s backwards; }
  @keyframes lvRise { from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .lv-zoom { animation: lvZoom .75s var(--ease-out) .08s backwards; }
  @keyframes lvZoom { from { opacity: 0; transform: scale(.9); filter: blur(12px) brightness(1.5); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes lvShimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  @keyframes lvShine { to { transform: translateX(450%) skewX(-18deg); } }

  /* ---------- 放大檢視 ---------- */
  .lv-lightbox {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center; padding: 3vmin;
    background: rgba(5,3,12,.8);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    animation: lvFade .25s ease backwards; cursor: zoom-out; overflow: hidden;
  }
  .lv-lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: default; animation: lvPop .35s var(--ease-spring) backwards; }
  .lv-lb-fig img {
    display: block; width: auto; height: auto; object-fit: contain;
    max-width: 92vw; max-height: calc(100vh - 96px); max-height: calc(100dvh - 96px);
    border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.14);
  }
  .lv-lb-fig figcaption { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #e2e8f0; }
  .lv-lb-btn {
    position: fixed; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 999px;
    color: #fff; font-size: 22px; line-height: 1;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .2s;
  }
  .lv-lb-btn:hover { background: rgba(255,255,255,.22); }
  .lv-lb-btn.prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lv-lb-btn.next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lv-lb-btn.close { right: 12px; top: 12px; width: 40px; height: 40px; font-size: 18px; }
  @keyframes lvFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lvPop  { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

  /* ======================================================================
     主選單／結算／彈窗
     ====================================================================== */
  /* 分頁切換：滑動的指示塊 */
  .ui-tabs { position: relative; display: grid; gap: 0; padding: 5px; border-radius: 18px;
             background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.09);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .ui-tabs > .ui-tab-ind { position: absolute; top: 5px; bottom: 5px; left: 5px; border-radius: 13px; z-index: 0;
                           background: linear-gradient(90deg, rgb(244 114 182), rgb(192 38 211));
                           box-shadow: 0 8px 24px -8px rgba(236,72,153,.7);
                           transition: transform .45s var(--ease-spring); }
  .ui-tabs > button { position: relative; z-index: 1; padding: 10px 6px; border-radius: 13px; font-size: 14px; font-weight: 800;
                      color: #cbd5e1; transition: color .25s ease; white-space: nowrap; }
  .ui-tabs > button.on { color: #fff; }
  .ui-tabs > button:not(.on):hover { color: #fff; }
  .tab-panel { animation: tabIn .45s var(--ease-out) backwards; }
  @keyframes tabIn { from { opacity: 0; transform: translateY(10px); } }
  .stagger > * { animation: lvRise .55s var(--ease-out) backwards; }
  .stagger > *:nth-child(1) { animation-delay: .03s; } .stagger > *:nth-child(2) { animation-delay: .08s; }
  .stagger > *:nth-child(3) { animation-delay: .13s; } .stagger > *:nth-child(4) { animation-delay: .18s; }
  .stagger > *:nth-child(5) { animation-delay: .23s; } .stagger > *:nth-child(6) { animation-delay: .28s; }
  .stagger > *:nth-child(n+7) { animation-delay: .32s; }

  /* 開關 */
  .ui-switch { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; cursor: pointer;
               background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); transition: background .3s ease, box-shadow .3s; }
  .ui-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
                      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); transition: transform .35s var(--ease-spring); }
  .ui-switch.on { background: linear-gradient(90deg, rgb(244 114 182), rgb(192 38 211)); box-shadow: 0 0 16px -2px rgba(236,72,153,.6); }
  .ui-switch.on::after { transform: translateX(18px); }
  .ui-switch:disabled { opacity: .4; cursor: not-allowed; }

  /* 小選項按鈕（題數、隊伍數）*/
  .ui-seg { padding: 4px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.05); color: #cbd5e1; transition: all .2s ease; }
  .ui-seg:hover:not(:disabled) { background: rgba(255,255,255,.12); color: #fff; }
  .ui-seg.on { color: #fff; border-color: rgba(244,114,182,.8); background: linear-gradient(90deg, rgba(236,72,153,.85), rgba(192,38,211,.8));
               box-shadow: 0 6px 18px -8px rgba(236,72,153,.8); }
  .ui-input { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; color: #f1f5f9;
              transition: border-color .2s, box-shadow .2s; }
  .ui-input:focus { outline: none; border-color: rgba(244,114,182,.7); box-shadow: 0 0 0 3px rgba(236,72,153,.2); }

  /* 彈窗 */
  .ui-modal-bg { animation: lvFade .3s ease backwards; }
  .ui-modal { animation: modalIn .45s var(--ease-spring) backwards; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.95); filter: blur(4px); } }

  /* 結算：彩帶 */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: .9;
                animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0%   { transform: translate3d(0, 0, 0) rotate(0); opacity: 1; }
    100% { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(var(--rot, 540deg)); opacity: .9; }
  }
  .count-pop { animation: countPop .7s var(--ease-spring) .2s backwards; }
  @keyframes countPop { from { opacity: 0; transform: scale(.4); filter: blur(8px); } }

  /* 螢幕很矮（手機橫放）：再壓縮一點留白 */
  @media (max-height: 520px) {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useMemo, useCallback } = React;

/* ========================================================================
   0. 工具
   ====================================================================== */
const DATA = (typeof window !== "undefined" && window.QUIZ_DATA) ? window.QUIZ_DATA : null;

// 本機直接開檔時素材在上一層（".."）；打包成網頁版時改成 "assets"
const ASSET_BASE = (DATA && DATA.assetBase ? String(DATA.assetBase) : "..").replace(/\/+$/, "");
const _warned = {};

/* 把題庫裡的路徑轉成瀏覽器可以讀的網址。三種情況都支援：
   1. http(s):// 或 // 開頭 → 圖床／外連圖片，原樣使用
   2. data: 開頭            → 內嵌圖片，原樣使用
   3. 其餘                  → 一律當成專案內的相對路徑，接在 ASSET_BASE 後面
   另外會擋掉誤填的本機絕對路徑（D:\kpop\... 或 file:///D:/...），
   自動改回相對路徑並在 console 提醒，避免分享出去後別人看不到圖。 */
function assetUrl(p) {
  if (!p) return "";
  let s = String(p).trim();
  if (/^(https?:)?\/\//i.test(s) || /^data:/i.test(s) || /^blob:/i.test(s)) return s;
  s = s.replace(/\\/g, "/");
  const abs = s.match(/^(?:file:\/\/\/)?[A-Za-z]:\/(.*)$/i);
  if (abs) {
    const segs = abs[1].split("/");
    const i = segs.findIndex(g => /^(封面|cover|assets|第[一二三四]關|level[1-4]|介面音樂|bgm)/.test(g));
    const fixed = (i >= 0 ? segs.slice(i) : segs.slice(-2)).join("/");
    if (!_warned[p]) {
      _warned[p] = 1;
      console.warn("[KPOP] 題庫裡有本機絕對路徑，別人的電腦讀不到，已自動改成相對路徑：\n  " + p + "\n→ " + fixed);
    }
    s = fixed;
  }
  s = s.replace(/^\/+/, "");
  return ASSET_BASE + "/" + s.split("/").map(encodeURIComponent).join("/");
}

/* 圖片載不到時顯示可見的佔位圖並在 console 印出實際網址，
   這樣分享給朋友出問題時，一眼就知道是哪一個檔案缺了 */
const MISSING_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">' +
  '<rect width="100%" height="100%" rx="20" fill="#1c1030"/>' +
  '<rect x="6" y="6" width="308" height="228" rx="16" fill="none" stroke="#5b4a7a" stroke-dasharray="8 6"/>' +
  '<g fill="#8d86a8" font-family="sans-serif" text-anchor="middle">' +
  '<text x="160" y="120" font-size="46">?</text>' +
  '<text x="160" y="160" font-size="15">找不到圖片</text></g></svg>');

function onImgError(e) {
  const el = e.currentTarget;
  if (el.dataset.failed) return;
  el.dataset.failed = "1";
  console.warn("[KPOP] 圖片載入失敗：", el.getAttribute("src"),
               "\n檢查 docs/assets 底下是否真的有這個檔案，以及大小寫是否完全一致。");
  el.src = MISSING_IMG;
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function pickN(arr, n) { return (!n || n >= arr.length) ? shuffle(arr) : shuffle(arr).slice(0, n); }
function cx(...a) { return a.filter(Boolean).join(" "); }
function uniq(a) { const s = {}, o = []; a.forEach(v => { if (v && !s[v]) { s[v] = 1; o.push(v); } }); return o; }
const CN = ["一", "二", "三", "四", "五"];
const LEVEL_KEYS = ["level1", "level2", "level3", "level4", "level5"];

/* ========================================================================
   1. 音效（Web Audio 合成）— 可調音量
   ====================================================================== */
const SFX = (() => {
  let ctx = null, enabled = true, master = 1;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type, vol) {
    if (!enabled) return;
    const v = (vol || 0.22) * master;
    if (v <= 0.0005) return;                 // 音量 0 時直接不發聲（指數斜坡不能收到 0）
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(v, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  return {
    setEnabled(v) { enabled = !!v; },
    setVolume(v) { master = Math.max(0, Math.min(1.2, Number(v) || 0)); },
    unlock() { ac(); },
    correct() { tone(784,0,.18,"triangle",.25); tone(1046,.12,.28,"triangle",.25); tone(1318,.24,.40,"triangle",.2); },
    wrong()   { tone(220,0,.22,"sawtooth",.18); tone(160,.16,.34,"sawtooth",.16); },
    reveal()  { tone(523,0,.12,"sine",.18); tone(659,.08,.14,"sine",.18); tone(880,.16,.3,"sine",.18); },
    tick()    { tone(1200,0,.05,"square",.06); },
    timeup()  { tone(440,0,.18,"square",.2); tone(330,.18,.18,"square",.2); tone(220,.36,.5,"square",.2); },
    click()   { tone(900,0,.04,"sine",.08); },
    drop()    { tone(620,0,.06,"sine",.10); tone(880,.05,.08,"sine",.08); },
    enter()   { tone(392,0,.12,"triangle",.16); tone(587,.09,.16,"triangle",.16); tone(784,.19,.32,"triangle",.16); },
    finish()  { [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.5,"triangle",.22)); }
  };
})();

/* ========================================================================
   2. 背景音樂：loop / ducking / 進入挑戰自動停止
   ====================================================================== */
function useBgm(src) {
  const audioRef = useRef(null);
  const baseVolRef = useRef(0.42);
  const fadeRef = useRef(null);
  const duckRef = useRef(0);
  const [muted, setMuted] = useState(false);
  const [suspended, setSuspended] = useState(false);
  const [unlocked, setUnlocked] = useState(false);

  useEffect(() => {
    if (!src) { audioRef.current = null; return; }
    const a = new Audio(assetUrl(src));
    a.loop = true; a.volume = 0; a.preload = "auto";
    audioRef.current = a;
    return () => { try { a.pause(); } catch (e) {} audioRef.current = null; };
  }, [src]);

  const fadeTo = useCallback((target, ms, thenPause) => {
    const a = audioRef.current; if (!a) return;
    if (fadeRef.current) clearInterval(fadeRef.current);
    const steps = Math.max(1, Math.round(ms / 40));
    const from = a.volume; let i = 0;
    fadeRef.current = setInterval(() => {
      i++;
      try { a.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps))); } catch (e) {}
      if (i >= steps) {
        clearInterval(fadeRef.current); fadeRef.current = null;
        if (thenPause) { try { a.pause(); } catch (e) {} }
      }
    }, 40);
  }, []);

  // 第一次互動解鎖播放
  useEffect(() => {
    const unlock = () => { SFX.unlock(); setUnlocked(true); };
    window.addEventListener("pointerdown", unlock);
    window.addEventListener("keydown", unlock);
    return () => { window.removeEventListener("pointerdown", unlock); window.removeEventListener("keydown", unlock); };
  }, []);

  const shouldPlay = unlocked && !muted && !suspended;
  useEffect(() => {
    const a = audioRef.current; if (!a) return;
    if (shouldPlay) {
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      fadeTo(duckRef.current > 0 ? 0.05 : baseVolRef.current, 650);
    } else {
      fadeTo(0, 380, true);
    }
  }, [shouldPlay, fadeTo, src]);        // 換曲之後要重新淡入

  const duck = useCallback(() => {
    duckRef.current += 1;
    if (duckRef.current === 1 && shouldPlay) fadeTo(0.05, 420);
  }, [fadeTo, shouldPlay]);
  const unduck = useCallback(() => {
    duckRef.current = Math.max(0, duckRef.current - 1);
    if (duckRef.current === 0 && shouldPlay) fadeTo(baseVolRef.current, 650);
  }, [fadeTo, shouldPlay]);
  const resetDuck = useCallback(() => {
    duckRef.current = 0;
    if (shouldPlay) fadeTo(baseVolRef.current, 450);
  }, [fadeTo, shouldPlay]);

  const toggle = useCallback(() => {
    SFX.unlock(); setUnlocked(true);
    if (muted || suspended) { setMuted(false); setSuspended(false); }
    else setMuted(true);
  }, [muted, suspended]);

  const setBaseVolume = useCallback((v) => {
    baseVolRef.current = v;
    if (shouldPlay && duckRef.current === 0) fadeTo(v, 200);
  }, [fadeTo, shouldPlay]);

  return {
    on: !muted && !suspended,
    playing: shouldPlay,
    hasTrack: !!src,
    toggle,
    suspend: () => setSuspended(true),
    wake: () => setSuspended(false),
    duck, unduck, resetDuck, setBaseVolume,
  };
}

/* ========================================================================
   3.5 全域設定彈窗（封面 / 主選單共用）

// 從路徑取出好讀的曲名（data:/blob: 這種沒有檔名的就顯示「自訂音樂」）

}

/* ========================================================================
   4. 動態背景（極光 + Canvas 粒子 + 可選背景影片/圖片）
   ====================================================================== */
function ParticleField() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let raf = 0, w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
    const N = 70;
    const ps = [];
    const reset = (p, first) => {
      p.x = Math.random() * w;
      p.y = first ? Math.random() * h : h + 20;
      p.r = 0.6 + Math.random() * 2.2;
      p.vy = -(0.12 + Math.random() * 0.45);
      p.vx = (Math.random() - 0.5) * 0.22;
      p.a = 0.15 + Math.random() * 0.5;
      p.hue = [330, 275, 190][Math.floor(Math.random() * 3)];
      p.tw = Math.random() * Math.PI * 2;
    };
    const size = () => {
      w = c.clientWidth; h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size();
    for (let i = 0; i < N; i++) { const p = {}; reset(p, true); ps.push(p); }
    const draw = () => {
      // 畫布大小跟著實際顯示大小走（畫面切換動畫期間尺寸可能暫時不同）
      if (c.clientWidth !== w || c.clientHeight !== h) size();
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy; p.tw += 0.03;
        if (p.y < -20 || p.x < -20 || p.x > w + 20) reset(p, false);
        const a = p.a * (0.65 + 0.35 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},95%,78%,${a})`;
        ctx.shadowBlur = 12; ctx.shadowColor = `hsla(${p.hue},95%,70%,${a})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    window.addEventListener("resize", size);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 w-full h-full z-[2] pointer-events-none" />;
}

function AnimatedBackdrop({ cover }) {
  const bg = cover && cover.background;
  const isVideo = cover && cover.backgroundIsVideo;
  return (
    <>
      <div className="fixed inset-0 z-0 bg-[#07040f]" />
      {bg && (
        <div className="fixed inset-0 z-0 overflow-hidden">
          {isVideo ? (
            <video src={assetUrl(bg)} autoPlay muted loop playsInline
                   className="w-full h-full object-cover opacity-45" />
          ) : (
            <img src={assetUrl(bg)} alt="" className="kenburns w-full h-full object-cover opacity-45" />

          <div className="absolute inset-0 bg-gradient-to-b from-[#07040f]/75 via-[#0a0616]/60 to-[#07040f]/92" />
        </div>

      <div className="aurora"><i /><i /><i /><i /></div>
      <ParticleField />
      <div className="sheen" />
    </>

}

   5. 封面照片牆
   ====================================================================== */
/* 照片牆版位。每一組是左右對稱的一對，所以不管取前幾張，畫面都是平衡的。
   t 是距離畫面頂端的百分比 —— 卡片還會上下浮動 16px，
   所以最上面那一排刻意留了 4% 以上的空隙，不會被螢幕上緣切到。 */
const SLOTS = [
  { l: 1.5, t: 10, w: 17, d: 1.0, r: -5, sm: true },
  { l: 81,  t: 11, w: 17, d: 1.0, r: 5,  sm: true },
  { l: -1,  t: 38, w: 16, d: 1.4, r: 3,  sm: true },
  { l: 84,  t: 40, w: 16, d: 1.4, r: -3, sm: true },
  { l: 0.5, t: 68, w: 19, d: 1.1, r: -3, sm: true },
  { l: 80,  t: 70, w: 19, d: 1.1, r: 4,  sm: true },
  { l: 21,  t: 6,  w: 12, d: 0.7, r: 4 },
  { l: 66,  t: 7,  w: 12, d: 0.7, r: -4 },
  { l: 19,  t: 76, w: 11, d: 0.6, r: 6 },
  { l: 69,  t: 78, w: 11, d: 0.6, r: -6 },
  { l: 35,  t: 4,  w: 10, d: 0.5, r: 2 },
  { l: 54,  t: 4.5,w: 10, d: 0.5, r: -2 },
  { l: 11,  t: 52, w: 11, d: 1.2, r: -6 },
  { l: 78,  t: 54, w: 11, d: 1.2, r: 6 },
  { l: 31,  t: 87, w: 10, d: 0.8, r: 3 },
  { l: 59,  t: 88, w: 10, d: 0.8, r: -3 },
];
const MAX_PHOTOS = SLOTS.length;

function PhotoWall({ photos, count }) {
  const [mouse, setMouse] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      setMouse({
        x: (e.clientX / window.innerWidth - 0.5) * 2,
        y: (e.clientY / window.innerHeight - 0.5) * 2,
      });
    };
    window.addEventListener("pointermove", onMove);
    return () => window.removeEventListener("pointermove", onMove);
  }, []);

  const want = Math.max(0, Math.min(MAX_PHOTOS, count == null ? 12 : count));
  if (!photos || !photos.length || want === 0) return null;
  const list = SLOTS.slice(0, want).map((s, i) => ({ slot: s, src: photos[i % photos.length], i }));

  return (
    <div className="fixed inset-0 z-[3] pointer-events-none overflow-hidden">
      {list.map(({ slot, src, i }) => (
        <div key={i}
          className={cx("pw-slot", !slot.sm && "hidden lg:block")}
          style={{
            left: slot.l + "%", top: slot.t + "%",
            width: "clamp(104px, " + slot.w + "vw, 240px)",
            transform: `translate3d(${(-mouse.x * 14 * slot.d).toFixed(1)}px, ${(-mouse.y * 12 * slot.d).toFixed(1)}px, 0) rotate(${slot.r}deg)`,
            animationDelay: (i * 0.09).toFixed(2) + "s",
          }}>
          <div className="pw-float"
               style={{
                 animationDuration: (7.5 + (i % 5) * 1.1).toFixed(1) + "s",
                 animationDelay: "-" + (i * 0.9).toFixed(1) + "s",
               }}>
            <img className="pw-main" src={assetUrl(src)} alt="" loading="lazy" onError={onImgError} />
          </div>
        </div>
      ))}
      <div className="absolute inset-0"
           style={{ background: "radial-gradient(closest-side at 50% 46%, rgba(7,4,15,.93) 24%, rgba(7,4,15,.46) 52%, rgba(7,4,15,0) 80%)" }} />
    </div>
  );
}
