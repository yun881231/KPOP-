<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPOP之王巔峰賽</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0a0616" />
<meta name="description" content="KPOP之王巔峰賽 — 四大關卡 K-POP 互動測驗" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #07040f;
    overflow-x: hidden;
  }

  /* ---------- 動態背景：極光光暈 ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1){ width:56vw; height:56vw; left:-14vw; top:-18vw; background:#ec4899; animation-duration:24s; }
  .aurora i:nth-child(2){ width:48vw; height:48vw; right:-12vw; top:-10vw; background:#6366f1; animation-duration:31s; animation-delay:-6s; }
  .aurora i:nth-child(3){ width:44vw; height:44vw; left:22vw; bottom:-20vw; background:#22d3ee; animation-duration:28s; animation-delay:-12s; opacity:.4; }
  .aurora i:nth-child(4){ width:34vw; height:34vw; right:8vw; bottom:-14vw; background:#a855f7; animation-duration:35s; animation-delay:-3s; }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    33%  { transform: translate3d(6vw,4vh,0) scale(1.15); }
    66%  { transform: translate3d(-5vw,7vh,0) scale(.92); }
    100% { transform: translate3d(3vw,-5vh,0) scale(1.08); }
  }

  /* ---------- 掃過畫面的光帶 ---------- */
  .sheen { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .sheen::after {
    content:""; position:absolute; top:-50%; left:-60%; width:35%; height:200%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.055), transparent);
    transform: rotate(12deg); animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep { 0%,72% { left:-60%; } 100% { left:130%; } }

  /* ---------- 封面照片牆 ---------- */
  /* 封面照片卡 —— 不使用任何固定比例容器
     .pw-slot  絕對定位 + 滑鼠視差（inline transform）+ 淡入（只動 opacity）
     .pw-float 上下浮動 + drop-shadow 柔邊光暈（會沿著圖片實際形狀，不是方框）
     img       width:100% / height:auto → 完全依原圖比例自適應，永不裁切
               border-radius 20px + mask 羽化 → 柔邊矩形 */
  .pw-slot { position: absolute; pointer-events: auto; will-change: transform;
             animation: pwFade .8s ease both; }
  @keyframes pwFade { from { opacity: 0 } to { opacity: 1 } }

  .pw-float {
    display: block;
    animation: floaty 9s ease-in-out infinite alternate;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.55));
    transition: filter .3s ease;
    will-change: transform, filter;
  }
  @keyframes floaty { from { transform: translateY(0) } to { transform: translateY(-16px) } }

  .pw-main {
    display: block; margin: 0 auto;
    /* 只給最大值、寬高都 auto → 瀏覽器等比縮到剛好，元素本身就是原圖比例 */
    max-width: 100%;
    max-height: min(22vh, 200px);
    width: auto; height: auto;
    object-fit: contain;              /* 完整顯示，絕不裁切 */
    border-radius: 20px;
    transition: transform .3s ease, filter .3s ease;
    will-change: transform;
    /* 柔邊羽化：邊緣淡出一點點，不會像貼紙硬邊 */
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 86%, rgba(0,0,0,0) 100%);
  }
  .pw-float:hover .pw-main { transform: scale(1.05); filter: brightness(1.12) saturate(1.06); }
  .pw-float:hover { filter: drop-shadow(0 14px 40px rgba(236,72,153,.55)); }

  /* 中央主視覺大圖：同樣不鎖比例，只給最大高寬 */
  .hero-wrap {
    display: block;
    filter: drop-shadow(0 16px 44px rgba(0,0,0,.65));
    transition: filter .3s ease;
  }
  .hero-wrap:hover { filter: drop-shadow(0 20px 56px rgba(236,72,153,.5)); }
  .hero-img {
    display: block;
    max-width: min(90vw, 640px);
    max-height: 26vh;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 24px;
    transition: transform .3s ease;
    -webkit-mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(118% 118% at 50% 50%, #000 88%, rgba(0,0,0,0) 100%);
  }
  .hero-wrap:hover .hero-img { transform: scale(1.05); }

  /* ---------- 封面：鎖死單一螢幕，絕不出現捲軸 ---------- */
  body.no-scroll { overflow: hidden !important; height: 100%; }
  .cover-root {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  .cover-stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(6px, 1.4vh, 18px);
    padding: clamp(8px, 2vh, 28px) 4vw;
    text-align: center;
    pointer-events: none;
  }
  .cover-title {
    font-size: clamp(26px, min(8.2vh, 9vw), 84px);
    line-height: 1.04;
    font-weight: 900;
    margin: 0;
  }
  .cover-sub  { font-size: clamp(10px, 1.7vh, 16px); }
  .cover-hint { font-size: clamp(9px, 1.3vh, 12px); }
  .cover-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  @media (max-height: 560px) { .cover-stats, .cover-hint { display: none; } }
  @media (max-height: 440px) { .cover-sub { display: none; } }

  .fade-in { animation: fadeIn .45s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .fade-up-1 { animation: fadeIn .7s ease .10s both; }
  .fade-up-2 { animation: fadeIn .7s ease .28s both; }
  .fade-up-3 { animation: fadeIn .7s ease .46s both; }
  .pop{ animation: pop .3s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)} }

  .pixelated { image-rendering: pixelated; image-rendering: -moz-crisp-edges; }
  input[type=range]{ accent-color:#ec4899; }
  .flash-ring{ box-shadow:0 0 0 2px rgba(236,72,153,.55), 0 0 44px rgba(236,72,153,.28); }
  .scroll-thin::-webkit-scrollbar{ width:8px; height:8px }
  .scroll-thin::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:8px }

  @media (prefers-reduced-motion: reduce) {
    .aurora i, .sheen::after, .pw-slot, .pw-float, .title-glow, .cta-ring::before, .kenburns { animation: none !important; }
    .pw-main, .hero-img, .pw-float, .hero-wrap { transition: none !important; }
  }
</style>
</head>

<div id="root"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>
<script src="./quiz-data.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ========================================================================
   0. 工具
   ====================================================================== */
const DATA = (typeof window !== "undefined" && window.QUIZ_DATA) ? window.QUIZ_DATA : null;

// 本機直接開檔時素材在上一層（".."）；打包成網頁版時改成 "assets"
const ASSET_BASE = (DATA && DATA.assetBase ? String(DATA.assetBase) : "..").replace(/\/+$/, "");
const _warned = {};

/* 把題庫裡的路徑轉成瀏覽器可以讀的網址。三種情況都支援：
   1. http(s):// 或 // 開頭 → 圖床／外連圖片，原樣使用
   2. data: 開頭            → 內嵌圖片，原樣使用
   3. 其餘                  → 一律當成專案內的相對路徑，接在 ASSET_BASE 後面
   另外會擋掉誤填的本機絕對路徑（D:\kpop\... 或 file:///D:/...），
   自動改回相對路徑並在 console 提醒，避免分享出去後別人看不到圖。 */
function assetUrl(p) {
  if (!p) return "";
  let s = String(p).trim();
  if (/^(https?:)?\/\//i.test(s) || /^data:/i.test(s)) return s;
  s = s.replace(/\\/g, "/");
  const abs = s.match(/^(?:file:\/\/\/)?[A-Za-z]:\/(.*)$/i);
  if (abs) {
    const segs = abs[1].split("/");
    const i = segs.findIndex(g => /^(封面|cover|assets|第[一二三四]關|level[1-4]|介面音樂|bgm)/.test(g));
    const fixed = (i >= 0 ? segs.slice(i) : segs.slice(-2)).join("/");
    if (!_warned[p]) {
      _warned[p] = 1;
      console.warn("[KPOP] 題庫裡有本機絕對路徑，別人的電腦讀不到，已自動改成相對路徑：\n  " + p + "\n→ " + fixed);
    }
    s = fixed;
  }
  s = s.replace(/^\/+/, "");
  return ASSET_BASE + "/" + s.split("/").map(encodeURIComponent).join("/");
}

/* 圖片載不到時顯示可見的佔位圖並在 console 印出實際網址，
   這樣分享給朋友出問題時，一眼就知道是哪一個檔案缺了 */
const MISSING_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">' +
  '<rect width="100%" height="100%" rx="20" fill="#1c1030"/>' +
  '<rect x="6" y="6" width="308" height="228" rx="16" fill="none" stroke="#5b4a7a" stroke-dasharray="8 6"/>' +
  '<g fill="#8d86a8" font-family="sans-serif" text-anchor="middle">' +
  '<text x="160" y="120" font-size="46">?</text>' +
  '<text x="160" y="160" font-size="15">找不到圖片</text></g></svg>');

function onImgError(e) {
  const el = e.currentTarget;
  if (el.dataset.failed) return;
  el.dataset.failed = "1";
  console.warn("[KPOP] 圖片載入失敗：", el.getAttribute("src"),
               "\n檢查 docs/assets 底下是否真的有這個檔案，以及大小寫是否完全一致。");
  el.src = MISSING_IMG;
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function pickN(arr, n) { return (!n || n >= arr.length) ? shuffle(arr) : shuffle(arr).slice(0, n); }
function cx(...a) { return a.filter(Boolean).join(" "); }

/* ========================================================================
   1. 音效（Web Audio 合成）
   ====================================================================== */
const SFX = (() => {
  let ctx = null, enabled = true;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  function tone(freq, start, dur, type, vol) {
    const c = ac(); if (!c || !enabled) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.22, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  }
  return {
    setEnabled(v) { enabled = v; },
    unlock() { ac(); },
    correct() { tone(784,0,.18,"triangle",.25); tone(1046,.12,.28,"triangle",.25); tone(1318,.24,.40,"triangle",.2); },
    wrong()   { tone(220,0,.22,"sawtooth",.18); tone(160,.16,.34,"sawtooth",.16); },
    reveal()  { tone(523,0,.12,"sine",.18); tone(659,.08,.14,"sine",.18); tone(880,.16,.3,"sine",.18); },
    tick()    { tone(1200,0,.05,"square",.06); },
    timeup()  { tone(440,0,.18,"square",.2); tone(330,.18,.18,"square",.2); tone(220,.36,.5,"square",.2); },
    click()   { tone(900,0,.04,"sine",.08); },
    enter()   { tone(392,0,.12,"triangle",.16); tone(587,.09,.16,"triangle",.16); tone(784,.19,.32,"triangle",.16); },
    finish()  { [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.5,"triangle",.22)); }
  };
})();

/* ========================================================================
   2. 背景音樂：loop / ducking / 進入挑戰自動停止
   ====================================================================== */
function useBgm(tracks) {
  const audioRef = useRef(null);
  const baseVolRef = useRef(0.42);
  const fadeRef = useRef(null);
  const duckRef = useRef(0);
  const [muted, setMuted] = useState(false);
  const [suspended, setSuspended] = useState(false);
  const [unlocked, setUnlocked] = useState(false);

  useEffect(() => {
    if (!tracks || !tracks.length) return;
    const a = new Audio(assetUrl(tracks[0]));
    a.loop = true; a.volume = 0; a.preload = "auto";
    audioRef.current = a;
    return () => { try { a.pause(); } catch (e) {} audioRef.current = null; };
  }, [tracks && tracks[0]]);

  const fadeTo = useCallback((target, ms, thenPause) => {
    const a = audioRef.current; if (!a) return;
    if (fadeRef.current) clearInterval(fadeRef.current);
    const steps = Math.max(1, Math.round(ms / 40));
    const from = a.volume; let i = 0;
    fadeRef.current = setInterval(() => {
      i++;
      try { a.volume = Math.min(1, Math.max(0, from + (target - from) * (i / steps))); } catch (e) {}
      if (i >= steps) {
        clearInterval(fadeRef.current); fadeRef.current = null;
        if (thenPause) { try { a.pause(); } catch (e) {} }
      }
    }, 40);
  }, []);

  // 第一次互動解鎖播放
  useEffect(() => {
    const unlock = () => { SFX.unlock(); setUnlocked(true); };
    window.addEventListener("pointerdown", unlock);
    window.addEventListener("keydown", unlock);
    return () => { window.removeEventListener("pointerdown", unlock); window.removeEventListener("keydown", unlock); };
  }, []);

  const shouldPlay = unlocked && !muted && !suspended;
  useEffect(() => {
    const a = audioRef.current; if (!a) return;
    if (shouldPlay) {
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      fadeTo(duckRef.current > 0 ? 0.05 : baseVolRef.current, 650);
    } else {
      fadeTo(0, 380, true);
    }
  }, [shouldPlay, fadeTo]);

  const duck = useCallback(() => {
    duckRef.current += 1;
    if (duckRef.current === 1 && shouldPlay) fadeTo(0.05, 420);
  }, [fadeTo, shouldPlay]);
  const unduck = useCallback(() => {
    duckRef.current = Math.max(0, duckRef.current - 1);
    if (duckRef.current === 0 && shouldPlay) fadeTo(baseVolRef.current, 650);
  }, [fadeTo, shouldPlay]);
  const resetDuck = useCallback(() => {
    duckRef.current = 0;
    if (shouldPlay) fadeTo(baseVolRef.current, 450);
  }, [fadeTo, shouldPlay]);

  const toggle = useCallback(() => {
    SFX.unlock(); setUnlocked(true);
    if (muted || suspended) { setMuted(false); setSuspended(false); }
    else setMuted(true);
  }, [muted, suspended]);

  const setBaseVolume = useCallback((v) => {
    baseVolRef.current = v;
    if (shouldPlay && duckRef.current === 0) fadeTo(v, 200);
  }, [fadeTo, shouldPlay]);

  return {
    on: !muted && !suspended,
    playing: shouldPlay,
    hasTrack: !!(tracks && tracks.length),
    toggle,
    suspend: () => setSuspended(true),
    wake: () => setSuspended(false),
    duck, unduck, resetDuck, setBaseVolume,
  };
}

/* ========================================================================
   3. 共用 UI
   ====================================================================== */
function Btn({ children, onClick, tone = "primary", size = "md", disabled, className }) {
  const tones = {
    primary: "bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-400 hover:to-fuchsia-500 text-white shadow-lg shadow-pink-500/25",
    ghost: "bg-white/10 hover:bg-white/20 text-slate-100 border border-white/15",
    good: "bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white shadow-lg shadow-emerald-500/20",
    bad: "bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-lg shadow-rose-500/20",
    cyan: "bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-white shadow-lg shadow-cyan-500/20",
  };
  const sizes = {
    sm: "px-3 py-1.5 text-sm rounded-lg",
    md: "px-5 py-2.5 text-base rounded-xl",
    lg: "px-8 py-4 text-lg rounded-2xl font-bold",
    xl: "px-14 py-5 text-2xl rounded-full font-black tracking-wide",
  };
  return (
    <button onClick={(e) => { SFX.click(); onClick && onClick(e); }} disabled={disabled}
      className={cx("transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed font-semibold", tones[tone], sizes[size], className)}>
      {children}
    </button>
  );
}
function Card({ children, className }) {
  return <div className={cx("rounded-3xl bg-white/[.06] backdrop-blur border border-white/10 shadow-2xl shadow-black/40", className)}>{children}</div>;
}
function Pill({ children, className }) {
  return <span className={cx("inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold", className)}>{children}</span>;
}
function BgmButton({ bgm, className }) {
  if (!bgm.hasTrack) return null;
  return (
    <button onClick={bgm.toggle} title="背景音樂開關"
      className={cx("px-4 py-2.5 rounded-2xl text-sm font-semibold border backdrop-blur transition shadow-lg",
        bgm.on ? "bg-pink-500/25 border-pink-400/40 text-pink-100 shadow-pink-500/20"
               : "bg-black/50 border-white/15 text-slate-400", className)}>
      {bgm.on ? "🎵 BGM 開" : "🔇 BGM 關"}
    </button>
  );
}

/* ========================================================================
   4. 動態背景（極光 + Canvas 粒子 + 可選背景影片/圖片）
   ====================================================================== */
function ParticleField() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    let raf = 0, w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
    const N = 70;
    const ps = [];
    const reset = (p, first) => {
      p.x = Math.random() * w;
      p.y = first ? Math.random() * h : h + 20;
      p.r = 0.6 + Math.random() * 2.2;
      p.vy = -(0.12 + Math.random() * 0.45);
      p.vx = (Math.random() - 0.5) * 0.22;
      p.a = 0.15 + Math.random() * 0.5;
      p.hue = [330, 275, 190][Math.floor(Math.random() * 3)];
      p.tw = Math.random() * Math.PI * 2;
    };
    const size = () => {
      w = c.clientWidth; h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size();
    for (let i = 0; i < N; i++) { const p = {}; reset(p, true); ps.push(p); }
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy; p.tw += 0.03;
        if (p.y < -20 || p.x < -20 || p.x > w + 20) reset(p, false);
        const a = p.a * (0.65 + 0.35 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},95%,78%,${a})`;
        ctx.shadowBlur = 12; ctx.shadowColor = `hsla(${p.hue},95%,70%,${a})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    window.addEventListener("resize", size);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 w-full h-full z-[2] pointer-events-none" />;
}

function AnimatedBackdrop({ cover }) {
  const bg = cover && cover.background;
  const isVideo = cover && cover.backgroundIsVideo;
  return (
    <>
      <div className="fixed inset-0 z-0 bg-[#07040f]" />
      {bg && (
        <div className="fixed inset-0 z-0 overflow-hidden">
          {isVideo ? (
            <video src={assetUrl(bg)} autoPlay muted loop playsInline
                   className="w-full h-full object-cover opacity-45" />
          ) : (
            <img src={assetUrl(bg)} alt="" className="kenburns w-full h-full object-cover opacity-45" />
          )}
          <div className="absolute inset-0 bg-gradient-to-b from-[#07040f]/75 via-[#0a0616]/60 to-[#07040f]/92" />
        </div>
      )}
      <div className="aurora"><i /><i /><i /><i /></div>
      <ParticleField />
      <div className="sheen" />
    </>
  );
}

/* ========================================================================
   5. 封面照片牆
   ====================================================================== */
const SLOTS = [
  { l: 1.5, t: 4,  w: 17, d: 1.0, r: -5, sm: true },
  { l: 21,  t: 0,  w: 12, d: 0.7, r: 4 },
  { l: 66,  t: 1,  w: 12, d: 0.7, r: -4 },
  { l: 81,  t: 5,  w: 17, d: 1.0, r: 5, sm: true },
  { l: -1,  t: 35, w: 16, d: 1.4, r: 3, sm: true },
  { l: 84,  t: 37, w: 16, d: 1.4, r: -3, sm: true },
  { l: 0.5, t: 67, w: 19, d: 1.1, r: -3, sm: true },
  { l: 80,  t: 69, w: 19, d: 1.1, r: 4, sm: true },
  { l: 19,  t: 75, w: 11, d: 0.6, r: 6 },
  { l: 69,  t: 77, w: 11, d: 0.6, r: -6 },
  { l: 35,  t: -6, w: 10, d: 0.5, r: 2 },
  { l: 54,  t: -7, w: 10, d: 0.5, r: -2 },
];

function PhotoWall({ photos }) {
  const [mouse, setMouse] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      setMouse({
        x: (e.clientX / window.innerWidth - 0.5) * 2,
        y: (e.clientY / window.innerHeight - 0.5) * 2,
      });
    };
    window.addEventListener("pointermove", onMove);
    return () => window.removeEventListener("pointermove", onMove);
  }, []);

  if (!photos || !photos.length) return null;
  const list = SLOTS.map((s, i) => ({ slot: s, src: photos[i % photos.length], i }))
                    .slice(0, Math.max(4, Math.min(SLOTS.length, photos.length * 2)));

  return (
    <div className="fixed inset-0 z-[3] pointer-events-none overflow-hidden">
      {list.map(({ slot, src, i }) => (
        <div key={i}
          className={cx("pw-slot", !slot.sm && "hidden lg:block")}
          style={{
            left: slot.l + "%", top: slot.t + "%",
            width: "clamp(104px, " + slot.w + "vw, 240px)",
            transform: `translate3d(${(-mouse.x * 14 * slot.d).toFixed(1)}px, ${(-mouse.y * 12 * slot.d).toFixed(1)}px, 0) rotate(${slot.r}deg)`,
            animationDelay: (i * 0.09).toFixed(2) + "s",
          }}>
          <div className="pw-float"
               style={{
                 animationDuration: (7.5 + (i % 5) * 1.1).toFixed(1) + "s",
                 animationDelay: "-" + (i * 0.9).toFixed(1) + "s",
               }}>
            <img className="pw-main" src={assetUrl(src)} alt="" loading="lazy" onError={onImgError} />
          </div>
        </div>
      ))}
      <div className="absolute inset-0"
           style={{ background: "radial-gradient(closest-side at 50% 46%, rgba(7,4,15,.93) 24%, rgba(7,4,15,.46) 52%, rgba(7,4,15,0) 80%)" }} />
    </div>
  );
}

/* ========================================================================
   8. 第三關即時遮蔽
   ====================================================================== */
function maskFilter(mode, level) {
  const b = 0.85 - level * 0.7;
  switch (mode) {
    case "silhouette": return `grayscale(1) contrast(${Math.round(400 + level * 900)}%) brightness(${b.toFixed(2)})`;
    case "shadow": return `blur(${(2 + level * 6).toFixed(1)}px) grayscale(1) contrast(${Math.round(300 + level * 500)}%) brightness(${b.toFixed(2)})`;
    case "dark": return `brightness(${(0.4 - level * 0.32).toFixed(2)}) contrast(${Math.round(200 + level * 300)}%) saturate(.2)`;
    case "mosaic": return `saturate(.35) brightness(${(1.0 - level * 0.45).toFixed(2)}) contrast(140%)`;
    default: return "none";
  }
}

function MaskedVideo({ src, mode, level, playKey }) {
  const videoRef = useRef(null), canvasRef = useRef(null), rafRef = useRef(null);
  const isMosaic = mode === "mosaic";

  useEffect(() => {
    const v = videoRef.current; if (!v) return;
    v.currentTime = 0;
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    return () => { try { v.pause(); } catch (e) {} };
  }, [playKey, src]);

  useEffect(() => {
    if (!isMosaic) { if (rafRef.current) cancelAnimationFrame(rafRef.current); return; }
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !c) return;
    const ctx = c.getContext("2d");
    const draw = () => {
      if (v.videoWidth) {
        const w = Math.max(16, Math.round(120 - level * 88));
        const h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
        if (c.width !== w) { c.width = w; c.height = h; }
        ctx.drawImage(v, 0, 0, w, h);
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [isMosaic, src, playKey, level]);

  return (
    <div className="relative w-full overflow-hidden rounded-2xl bg-black">
      <video ref={videoRef} src={assetUrl(src)} muted loop playsInline
        className={cx("w-full max-h-[58vh] object-contain", isMosaic && "invisible absolute inset-0 pointer-events-none")}
        style={{ filter: isMosaic ? "none" : maskFilter(mode, level) }} />
      {isMosaic && (
        <canvas ref={canvasRef} className="pixelated w-full max-h-[58vh] object-contain"
                style={{ filter: maskFilter("mosaic", level) }} />
      )}
    </div>
  );
}

   9. 四關題目畫面
   ====================================================================== */
function Level1Stage({ q, revealed, flashSec }) {
  const [visible, setVisible] = useState(false);
  const [countdown, setCountdown] = useState(0);
  const timerRef = useRef(null);
  useEffect(() => { setVisible(false); setCountdown(0); return () => clearTimeout(timerRef.current); }, [q.id]);

  const flash = () => {
    setCountdown(3); let n = 3;
    const iv = setInterval(() => {
      n -= 1; setCountdown(n); SFX.tick();
      if (n <= 0) { clearInterval(iv); setVisible(true); timerRef.current = setTimeout(() => setVisible(false), flashSec * 1000); }
    }, 700);
  };

  return (
    <div className="flex flex-col items-center gap-5">
      <div className="relative w-full max-w-lg h-[44vh] sm:h-[52vh] rounded-3xl overflow-hidden bg-black/60 border border-white/10 grid place-items-center">
        {(revealed || visible)
          ? <img src={assetUrl(q.image)} alt="" className="w-full h-full object-contain pop" onError={onImgError} />
          : (<div className="text-center px-6">
              {countdown > 0
                ? <div className="text-8xl font-black text-pink-400 pop">{countdown}</div>
                : (<><div className="text-7xl mb-3">🫥</div>
                     <div className="text-slate-400 text-sm">照片只會出現 {flashSec.toFixed(1)} 秒</div></>)}
            </div>)}
      </div>
      {!revealed && (
        <Btn tone="cyan" onClick={flash} disabled={countdown > 0 || visible}>
          {visible ? "看！" : countdown > 0 ? "準備…" : "閃現照片 ⚡"}
        </Btn>
      )}
      {revealed && (
        <div className="text-center pop">
          <div className="text-sm text-cyan-300 font-semibold">{q.group}</div>
          <div className="text-4xl font-black text-white mt-1">{q.name}</div>
        </div>
      )}
    </div>
  );
}

function Level2Stage({ q, revealed, duck, unduck }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [started, setStarted] = useState(false);   // 播過一次之後「播放前奏」就消失
  const duckedRef = useRef(false);
  const doDuck = () => { if (!duckedRef.current) { duckedRef.current = true; duck(); } };
  const doUnduck = () => { if (duckedRef.current) { duckedRef.current = false; unduck(); } };

  useEffect(() => () => doUnduck(), []);
  useEffect(() => { doUnduck(); setPlaying(false); setStarted(false); }, [q.id]);

  const clipSrc = q.clip || q.answer;
  const clipLimit = q.clip ? null : (q.introSeconds || 12);

  const play = () => {
    const a = audioRef.current; if (!a) return;
    doDuck(); setStarted(true);
    a.currentTime = 0;
    a.play().then(() => setPlaying(true)).catch(() => {});
  };

  useEffect(() => {
    const a = audioRef.current; if (!a || !clipLimit) return;
    const onT = () => { if (a.currentTime >= clipLimit) { a.pause(); setPlaying(false); doUnduck(); } };
    a.addEventListener("timeupdate", onT);
    return () => a.removeEventListener("timeupdate", onT);
  }, [clipLimit, q.id]);

  useEffect(() => {
    if (revealed) { const a = audioRef.current; if (a) a.pause(); setPlaying(false); doDuck(); }
  }, [revealed]);

  return (
    <div className="flex flex-col items-center gap-6 w-full">
      <audio ref={audioRef} src={assetUrl(clipSrc)} preload="auto" className="hidden"
             onEnded={() => { setPlaying(false); doUnduck(); }} />
      {!revealed ? (
        <>
          <div className={cx("w-40 h-40 rounded-full grid place-items-center border-4 transition-all duration-300",
            playing ? "border-fuchsia-400 bg-fuchsia-500/20 scale-110 shadow-2xl shadow-fuchsia-500/40" : "border-white/15 bg-white/5")}>
            <span className="text-6xl">{playing ? "🔊" : "🎧"}</span>
          </div>
          <div className="h-14 flex items-center">
            {!started
              ? <Btn tone="cyan" size="lg" onClick={play}>▶ 播放前奏</Btn>
              : <Btn tone="ghost" onClick={play} className="pop">🔂 再聽一次</Btn>}
          </div>
          {clipLimit && <p className="text-xs text-slate-500 -mt-3">（無獨立前奏檔，自動播放答案影片前 {clipLimit} 秒的音訊）</p>}
        </>
      ) : (
        <div className="w-full flex flex-col items-center gap-4 pop">
          {q.answer
            ? <video src={assetUrl(q.answer)} controls autoPlay className="w-full max-h-[58vh] rounded-2xl bg-black"
                     onPlay={doDuck} onPause={doUnduck} onEnded={doUnduck} />
            : <div className="w-full max-w-lg h-40 rounded-2xl bg-black/50 border border-white/10 grid place-items-center text-slate-500 text-sm">（這首沒有答案影片）</div>}
          <div className="text-center">
            <div className="text-sm text-fuchsia-300 font-semibold">{q.group}</div>
            <div className="text-3xl sm:text-4xl font-black text-white mt-1">{q.title}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function Level3Stage({ q, revealed, maskMode, maskLevel, duck, unduck }) {
  const [replayKey, setReplayKey] = useState(0);
  const duckedRef = useRef(false);
  const doDuck = () => { if (!duckedRef.current) { duckedRef.current = true; duck(); } };
  const doUnduck = () => { if (duckedRef.current) { duckedRef.current = false; unduck(); } };
  useEffect(() => () => doUnduck(), []);
  useEffect(() => { doUnduck(); setReplayKey(k => k + 1); }, [q.id]);

  const hasPrebuilt = !!q.question;
  const src = hasPrebuilt ? q.question : q.answer;
  const mode = hasPrebuilt ? "none" : maskMode;

  return (
    <div className="w-full flex flex-col items-center gap-5">
      {!revealed ? (
        <>
          <MaskedVideo src={src} mode={mode} level={maskLevel} playKey={replayKey} />
          <div className="flex gap-3 flex-wrap justify-center items-center">
            <Btn tone="cyan" onClick={() => setReplayKey(k => k + 1)}>🔁 重播舞蹈</Btn>
            <Pill className="bg-indigo-500/20 text-indigo-200 border border-indigo-400/30">
              {hasPrebuilt ? "已使用預先處理的剪影影片" : "前端即時遮蔽：" + (MASK_MODES.find(m => m.id === mode) || {}).label}
            </Pill>
            <Pill className="bg-white/10 text-slate-300">🔇 靜音播放</Pill>
          </div>
        </>
      ) : (
        <div className="w-full flex flex-col items-center gap-4 pop">
          <video src={assetUrl(q.answer || q.question)} controls autoPlay className="w-full max-h-[58vh] rounded-2xl bg-black"
                 onPlay={doDuck} onPause={doUnduck} onEnded={doUnduck} />
          <div className="text-center">
            <div className="text-sm text-indigo-300 font-semibold">{q.group}</div>
            <div className="text-3xl sm:text-4xl font-black text-white mt-1">{q.title}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function FeatureBox({ label, emoji, src, tint }) {
  return (
    <div className="flex-1 min-w-[180px]">
      <div className={cx("text-xs font-bold mb-2 flex items-center gap-1", tint)}><span>{emoji}</span>{label}</div>
      <div className="rounded-2xl overflow-hidden bg-black/50 border border-white/10 h-[34vh] grid place-items-center">
        {src ? <img src={assetUrl(src)} alt="" className="w-full h-full object-contain" onError={onImgError} /> : <span className="text-slate-600 text-sm">（無素材）</span>}
      </div>
    </div>
  );
}

function Level4Stage({ q, revealed }) {
  if (!revealed) {
    return (
      <div className="w-full">
        <div className="flex gap-4 flex-wrap">
          <FeatureBox label="眼睛" emoji="👁️" src={q.eyes && q.eyes.q} tint="text-cyan-300" />
          <FeatureBox label="嘴巴" emoji="👄" src={q.mouth && q.mouth.q} tint="text-pink-300" />
          <FeatureBox label="手燈提示（團體）" emoji="🔦" src={q.lightstick && q.lightstick.image} tint="text-amber-300" />
        </div>
        <p className="text-center text-slate-400 text-sm mt-4">眼睛與嘴巴來自<b className="text-slate-200">不同偶像</b>，手燈是所屬團體提示</p>
      </div>
    );
  }
  const cardOf = (part, label, emoji, tint) => (
    <div className="flex-1 min-w-[220px] pop">
      <div className={cx("text-xs font-bold mb-2 flex items-center gap-1", tint)}><span>{emoji}</span>{label}的答案</div>
      <div className="rounded-2xl overflow-hidden bg-black/50 border border-white/10 h-[44vh] grid place-items-center">
        {part && (part.a || part.q) ? <img src={assetUrl(part.a || part.q)} alt="" className="w-full h-full object-contain" onError={onImgError} /> : <span className="text-slate-600">（無解答原圖）</span>}
      </div>
      <div className="text-center mt-3">
        <div className={cx("text-sm font-semibold", tint)}>{part ? part.group : ""}</div>
        <div className="text-2xl font-black text-white">{part ? part.name : ""}</div>
      </div>
    </div>
  );
  return (
    <div className="w-full flex gap-5 flex-wrap justify-center">
      {cardOf(q.eyes, "眼睛", "👁️", "text-cyan-300")}
      {cardOf(q.mouth, "嘴巴", "👄", "text-pink-300")}
    </div>
  );
}

/* ========================================================================
   10. 挑戰畫面
   ====================================================================== */
function QuizScreen({ deck, config, scores, setScores, onMenu, onFinish, bgm }) {
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [left, setLeft] = useState(config.timer);
  const [running, setRunning] = useState(config.timer > 0);
  const q = deck[idx];

  useEffect(() => { setRevealed(false); setLeft(config.timer); setRunning(config.timer > 0); bgm.resetDuck(); }, [idx]);

  useEffect(() => {
    if (!running || config.timer === 0 || revealed) return;
    if (left <= 0) { setRunning(false); SFX.timeup(); return; }
    const t = setTimeout(() => { setLeft(l => l - 1); if (left <= 4) SFX.tick(); }, 1000);
    return () => clearTimeout(t);
  }, [left, running, revealed, config.timer]);

  const reveal = () => { setRevealed(true); setRunning(false); SFX.reveal(); };
  const next = () => { if (idx + 1 >= deck.length) { SFX.finish(); onFinish(); } else setIdx(i => i + 1); };
  const prev = () => setIdx(i => Math.max(0, i - 1));
  const addScore = (ti, d) => {
    setScores(s => { const n = s.slice(); n[ti] = (n[ti] || 0) + d; return n; });
    if (d > 0) SFX.correct(); else SFX.wrong();
  };

  const meta = LEVEL_META.find(m => m.id === q.__level);
  const timePct = config.timer ? Math.max(0, left) / config.timer * 100 : 0;

  return (
    <div className="relative min-h-screen flex flex-col">
      <div className="fixed inset-0 z-0 bg-[#07040f]" />
      <div className="aurora opacity-60"><i /><i /><i /><i /></div>

      <div className="relative z-10 flex flex-col min-h-screen">
        {/* 頂部 */}
        <div className="sticky top-0 z-20 backdrop-blur bg-black/50 border-b border-white/10">
          <div className="mx-auto max-w-6xl px-4 py-3 flex items-center gap-3 flex-wrap">
            <button onClick={() => { SFX.click(); onMenu(); }} className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-sm">← 主選單</button>
            <Pill className={cx("bg-gradient-to-r text-white", meta ? meta.accent : "from-slate-600 to-slate-700")}>
              {meta ? meta.emoji + " 第" + ["一","二","三","四"][meta.n-1] + "關 " + meta.title : "題目"}
            </Pill>
            <div className="text-sm text-slate-300 font-mono">{idx + 1} / {deck.length}</div>
            <div className="flex-1 min-w-[80px] h-1.5 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-pink-500 to-cyan-400 transition-all" style={{ width: ((idx + 1) / deck.length * 100) + "%" }} />
            </div>
            {config.timer > 0 && (
              <div className="flex items-center gap-2">
                <div className="relative w-12 h-12 grid place-items-center">
                  <svg className="absolute inset-0 -rotate-90" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,.12)" strokeWidth="3" />
                    <circle cx="18" cy="18" r="16" fill="none" stroke={left <= 5 ? "#f43f5e" : "#22d3ee"} strokeWidth="3"
                            strokeDasharray={2 * Math.PI * 16} strokeDashoffset={2 * Math.PI * 16 * (1 - timePct / 100)}
                            strokeLinecap="round" style={{ transition: "stroke-dashoffset .9s linear" }} />
                  </svg>
                  <span className={cx("text-sm font-black", left <= 5 ? "text-rose-400" : "text-cyan-300")}>{Math.max(0, left)}</span>
                </div>
                <button onClick={() => { SFX.click(); setRunning(r => !r); }} className="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs">
                  {running ? "⏸" : "▶"}
                </button>
              </div>
            )}
            <BgmButton bgm={bgm} className="!px-3 !py-1.5 !rounded-lg" />
          </div>
        </div>

        {/* 題目 */}
        <div className="flex-1 mx-auto w-full max-w-5xl px-4 py-8">
          <div className="fade-in" key={q.id}>
            {q.__level === "level1" && <Level1Stage q={q} revealed={revealed} flashSec={config.flashSec} />}
            {q.__level === "level2" && <Level2Stage q={q} revealed={revealed} duck={bgm.duck} unduck={bgm.unduck} />}
            {q.__level === "level3" && <Level3Stage q={q} revealed={revealed} maskMode={config.maskMode} maskLevel={config.maskLevel} duck={bgm.duck} unduck={bgm.unduck} />}
            {q.__level === "level4" && <Level4Stage q={q} revealed={revealed} />}
          </div>

          <div className="mt-8 flex flex-wrap gap-3 justify-center">
            <Btn tone="ghost" size="sm" onClick={prev} disabled={idx === 0}>← 上一題</Btn>
            {!revealed
              ? <Btn size="lg" onClick={reveal}>公布答案 🎉</Btn>
              : <Btn size="lg" tone="cyan" onClick={next}>{idx + 1 >= deck.length ? "看結果 🏁" : "下一題 →"}</Btn>}
            <Btn tone="ghost" size="sm" onClick={next}>跳過 →</Btn>
          </div>
        </div>

        {/* 計分板 */}
        <div className="sticky bottom-0 backdrop-blur bg-black/55 border-t border-white/10">
          <div className="mx-auto max-w-6xl px-4 py-3 flex gap-3 overflow-x-auto scroll-thin">
            {config.teams.map((t, i) => (
              <div key={i} className="flex items-center gap-2 shrink-0 rounded-2xl bg-white/5 border border-white/10 px-3 py-2">
                <div className="min-w-[70px]">
                  <div className="text-xs text-slate-400 truncate max-w-[110px]">{t}</div>
                  <div className="text-xl font-black text-white leading-none">{scores[i] || 0}</div>
                </div>
                <button onClick={() => addScore(i, 1)} className="w-9 h-9 rounded-xl bg-emerald-500/80 hover:bg-emerald-400 font-bold">＋</button>
                <button onClick={() => addScore(i, -1)} className="w-9 h-9 rounded-xl bg-rose-600/70 hover:bg-rose-500 font-bold">－</button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================================
   11. 結算
   ====================================================================== */
function ResultScreen({ config, scores, bgm, onMenu, onCover, onAgain }) {
  const rank = config.teams.map((t, i) => ({ name: t, score: scores[i] || 0 })).sort((a, b) => b.score - a.score);
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div className="relative min-h-screen grid place-items-center px-4 py-12">
      <AnimatedBackdrop cover={null} />
      <div className="fixed top-4 right-4 z-40"><BgmButton bgm={bgm} /></div>
      <Card className="relative z-10 p-8 w-full max-w-2xl text-center fade-in">
        <div className="text-6xl mb-2">👑</div>
        <h1 className="text-4xl font-black title-glow">賽果揭曉</h1>
        <p className="text-slate-400 mt-2">恭喜本屆 KPOP 之王！</p>
        <div className="mt-8 space-y-3">
          {rank.map((r, i) => (
            <div key={i} className={cx("flex items-center gap-4 rounded-2xl px-5 py-4 border",
              i === 0 ? "bg-gradient-to-r from-amber-500/25 to-yellow-500/10 border-amber-400/40" : "bg-white/5 border-white/10")}>
              <span className="text-2xl w-8">{medals[i] || (i + 1)}</span>
              <span className="flex-1 text-left font-bold text-lg">{r.name}</span>
              <span className="text-3xl font-black text-white">{r.score}</span>
            </div>
          ))}
        </div>
        <div className="mt-8 flex gap-3 justify-center flex-wrap">
          <Btn onClick={onAgain}>再玩一次 🔁</Btn>
          <Btn tone="ghost" onClick={onMenu}>回主選單</Btn>
          <Btn tone="ghost" onClick={onCover}>回封面</Btn>
        </div>
      </Card>
    </div>
  );
}

/* ========================================================================
   12. 根元件
   ====================================================================== */
function App() {
  const [screen, setScreen] = useState("cover");
  const [deck, setDeck] = useState([]);
  const [scores, setScores] = useState([0, 0]);
  const [config, setConfig] = useState({
    levels: { level1: { on: true, count: 5 }, level2: { on: true, count: 5 }, level3: { on: true, count: 5 }, level4: { on: true, count: 5 } },
    teams: ["隊伍 1", "隊伍 2"],
    timer: 15, flashSec: 1.0, maskMode: "silhouette", maskLevel: 0.7, bgmVol: 0.42, sfx: true, mixLevels: false,
  });

  const pools = useMemo(() => {
    const out = { level1: [], level2: [], level3: [], level4: [] };
    if (!DATA || !DATA.levels) return out;
    Object.keys(out).forEach(k => {
      const lv = DATA.levels[k];
      out[k] = (lv && lv.questions ? lv.questions : []).map(q => ({ ...q, __level: k }));
    });
    return out;
  }, []);

  const cover = (DATA && DATA.cover) ? DATA.cover : null;
  const totals = LEVEL_META.map(m => ({ label: m.title, emoji: m.emoji, n: pools[m.id].length }));

  const dataError = useMemo(() => {
    if (!DATA) return "找不到題庫檔 quiz-data.js。請先執行資料夾中的「更新題庫.bat」重新掃描素材。";
    const total = Object.keys(pools).reduce((s, k) => s + pools[k].length, 0);
    if (total === 0) return "題庫是空的。請確認 D:\\kpop 各關資料夾內有素材，並執行「更新題庫.bat」。";
    return null;
  }, [pools]);

  const bgm = useBgm(DATA && DATA.bgm ? DATA.bgm : []);
  useEffect(() => { bgm.setBaseVolume(config.bgmVol); }, [config.bgmVol]);
  useEffect(() => { SFX.setEnabled(config.sfx); }, [config.sfx]);

  const buildDeck = () => {
    let d = [];
    ["level1", "level2", "level3", "level4"].forEach(k => {
      const lv = config.levels[k];
      if (!lv.on) return;
      d = d.concat(pickN(pools[k], lv.count));
    });
    if (config.mixLevels) d = shuffle(d);
    return d;
  };

  const startChallenge = () => {
    const d = buildDeck();
    if (!d.length) return;
    setDeck(d);
    setScores(config.teams.map(() => 0));
    bgm.resetDuck();
    bgm.suspend();              // 進入挑戰 → 自動停止背景音樂
    setScreen("quiz");
  };

  const goMenu  = () => { bgm.resetDuck(); bgm.wake(); setScreen("menu"); };
  const goCover = () => { bgm.resetDuck(); bgm.wake(); setScreen("cover"); };
  const finish  = () => { bgm.resetDuck(); bgm.wake(); setScreen("result"); };

  if (screen === "cover")
    return <CoverScreen cover={cover} totals={totals} bgm={bgm} onStart={() => setScreen("menu")} />;
  if (screen === "menu")
    return <MenuScreen config={config} setConfig={setConfig} pools={pools} dataError={dataError}
             bgm={bgm} onBack={goCover} onStart={startChallenge} />;
  if (screen === "quiz")
    return <QuizScreen deck={deck} config={config} scores={scores} setScores={setScores}
             bgm={bgm} onMenu={goMenu} onFinish={finish} />;
  return <ResultScreen config={config} scores={scores} bgm={bgm}
           onMenu={goMenu} onCover={goCover} onAgain={startChallenge} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
